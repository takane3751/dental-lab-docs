<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>運営管理コンソール（サービス全体）</title>
<style>
:root{
  --bg:#f5f5f8; --surface:#fff; --surface-2:#fafafc; --border:#e0e0e8; --border-2:#eeeef4;
  --text:#1a1a24; --muted:#666677; --faint:#9494a6;
  /* 運営側は紫系。技工所側・医院側（緑系）と取り違えないようにする */
  --primary:#5b21b6; --primary-dark:#4c1d95; --primary-soft:#f0eafc;
  --accent:#b45309; --accent-soft:#fdf2e3;
  --danger:#b91c1c; --danger-soft:#fdeceb;
  --success:#15803d; --success-soft:#e9f6ed;
  --ins:#1d4ed8; --ins-soft:#e8eefc;
  --pri:#a16207; --pri-soft:#fbf3e0;
  --money:#0f766e; --money-soft:#e6f2f0;
  --radius:10px; --shadow:0 1px 2px rgba(20,10,40,.06),0 4px 14px rgba(20,10,40,.05);
  --hdrh:92px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}

.devbar{background:#111827;color:#9ca3af;font-size:11.5px;padding:4px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.devbar b{color:#e5e7eb}.devbar .sp{flex:1}.devbar a{color:#93c5fd}
.devbar select{width:auto;padding:1px 5px;font-size:11.5px;background:#374151;border:1px solid #4b5563;color:#fff;border-radius:4px}

header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.hd{max-width:1440px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mk{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px}
.hd .sp{flex:1}
.opsbadge{background:var(--primary-soft);color:var(--primary-dark);border:1px solid #d9caf5;
  border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700}
.pill{border:1px solid var(--border);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
nav.tabs{max-width:1440px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:none;padding:9px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--primary-dark);border-bottom-color:var(--primary);font-weight:600}

main{max-width:1440px;margin:0 auto;padding:18px 18px 70px}
h1{font-size:20px;margin:0 0 3px}
h2{font-size:15px;margin:0 0 10px}
h3{font-size:13.5px;margin:0 0 7px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hdr{padding:11px 15px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card .hdr h2,.card .hdr h3{margin:0}
.card .bd{padding:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:230px 1fr}
@media(max-width:960px){.g2,.g3,.g4,.g21,.g12{grid-template-columns:1fr}}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mt{margin-top:14px}.mb{margin-bottom:14px}

.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px;transition:.12s}
.btn:hover{border-color:var(--faint);background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--primary-dark)}
.btn.dgr{background:#fff;border-color:#e5b4b1;color:var(--danger)}
.btn.wrn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.mny{background:var(--money);border-color:var(--money);color:#fff;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.lg{padding:10px 20px;font-size:14.5px}
.btn.block{width:100%;display:block}
.btn:disabled{opacity:.45;cursor:not-allowed}

.b{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;line-height:1.7;white-space:nowrap}
.b.ins{background:var(--ins-soft);color:var(--ins)}
.b.pri2{background:var(--pri-soft);color:var(--pri)}
.b.wait{background:var(--accent-soft);color:var(--accent)}
.b.prog{background:var(--primary-soft);color:var(--primary-dark)}
.b.done{background:var(--success-soft);color:var(--success)}
.b.dgr{background:var(--danger-soft);color:var(--danger)}
.b.gray{background:#eeeef2;color:var(--muted)}
.b.mny{background:var(--money-soft);color:var(--money)}

.alert{border-radius:var(--radius);padding:12px 14px;font-size:13px;border:1px solid}
.alert.warn{background:var(--accent-soft);border-color:#f0d5a8;color:#7c3d06}
.alert.dgr{background:var(--danger-soft);border-color:#f0c0bd;color:#8c1d18}
.alert.info{background:var(--primary-soft);border-color:#d9caf5;color:#3f1d80}
.alert.ok{background:var(--success-soft);border-color:#b7e0c4;color:#12592d}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 11px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border-2);vertical-align:middle}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}
.tw{overflow-x:auto}
.num{text-align:right;font-variant-numeric:tabular-nums}

label.f{display:block;margin-bottom:12px}
label.f .lb{font-size:12.5px;font-weight:600;margin-bottom:4px;display:flex;gap:6px;align-items:center}
label.f .hint{font-size:11.5px;color:var(--muted);font-weight:400}
.req{color:var(--danger);font-size:10.5px;font-weight:700}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#fff;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
textarea{min-height:64px;resize:vertical}
input[type=range]{width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer;background:#fff;font-size:12.5px}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.sw{position:relative;width:40px;height:22px;background:var(--border);border-radius:99px;cursor:pointer;transition:.15s;flex:none;border:none;padding:0}
.sw.on{background:var(--primary)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:99px;transition:.15s}
.sw.on::after{left:20px}

.stat{padding:13px 15px}
.stat .n{font-size:23px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat .d{font-size:11px;color:var(--faint);margin-top:2px}
.empty{text-align:center;padding:30px 16px;color:var(--faint);font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 13px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0}
.note{font-size:11.5px;color:var(--faint)}
code{background:var(--surface-2);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.bar{height:7px;background:#eeeef2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar i.w{background:var(--accent)}.bar i.d{background:var(--danger)}

.setnav{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.setnav a{padding:9px 13px;background:#fff;font-size:13px;cursor:pointer;color:var(--text)}
.setnav a:hover{background:var(--surface-2)}
.setnav a.on{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}

.mask{position:fixed;inset:0;background:rgba(20,10,40,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
.modal.wide{max-width:860px}
.modal .mh{padding:15px 19px;border-bottom:1px solid var(--border-2);font-weight:700}
.modal .mb{padding:19px}
.modal .mf{padding:13px 19px;border-top:1px solid var(--border-2);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 14px 14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a24;color:#fff;padding:10px 19px;border-radius:99px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* 料金ルールの行 */
.rule{display:grid;grid-template-columns:90px 1fr 110px 110px 130px 34px;gap:8px;align-items:center;
  padding:8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px}
.rule+.rule{margin-top:6px}
.rule.hdrow{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:11.5px;border-style:dashed}
@media(max-width:900px){.rule{grid-template-columns:1fr 1fr}}

/* 請求書プレビュー（PDF出力の見た目を確認するためのもの） */
.inv{background:#fff;border:1px solid #ccc;padding:26px 30px;max-width:720px;margin:0 auto;
  font-size:12px;line-height:1.7;color:#000}
.inv .ih{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.inv .ttl{font-size:21px;font-weight:700;letter-spacing:.22em;border-bottom:2px solid #000;padding-bottom:3px}
.inv .meta{font-size:11px;text-align:right;line-height:1.9}
.inv .to{font-size:14px;font-weight:700;border-bottom:1px solid #000;padding-bottom:3px;display:inline-block;min-width:250px}
.inv .total{border:2px solid #000;padding:7px 12px;font-size:17px;font-weight:700;display:inline-block;margin:12px 0}
.inv table{font-size:11.5px;margin-top:10px}
.inv th{background:#f0f0f0;color:#000;border:1px solid #999;padding:5px 7px;font-size:11px}
.inv td{border:1px solid #ccc;padding:5px 7px}
.inv .from{margin-top:20px;font-size:11px;border-top:1px solid #ccc;padding-top:10px}
.inv .seal{float:right;width:52px;height:52px;border:1px solid #c00;border-radius:99px;color:#c00;
  display:grid;place-items:center;font-size:9px;text-align:center;line-height:1.3}
.printhint{background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;
  padding:9px 12px;font-size:11.5px;color:var(--muted);margin-bottom:12px}

/* 重複疑いの強調 */
.dupe{background:#fff8e1}
</style>
</head>
<body>

<div class="devbar">
  <b>DEMO</b><span>運営管理コンソール</span>
  <span>ログイン中</span><select id="userSel"></select>
  <span class="sp"></span>
  <a href="index.html">解説</a><a href="clinic.html">医院側</a><a href="lab.html">技工所側</a><a href="station.html">工程端末</a>
</div>

<header>
  <div class="hd">
    <div class="logo"><span class="mk">運営</span>
      <span>技工物受発注SaaS <span class="opsbadge">運営管理コンソール</span></span></div>
    <span class="sp"></span>
    <span class="pill" id="userPill"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="app"></main>
<div id="overlay"></div>

<script src="shared.js"></script>
<script>
/* ============================================================
   運営（サービス提供者）側のデモデータ

   ★課金の考え方（v0.5 で確定した前提）
   - 月額固定は取らない
   - 初期費用は任意。請求書を手動で作成できるようにする
   - 継続収益は「案件で医院から技工所へ支払われた額」の一部を徴収する
   - 料率(%)か1件固定額(円)か未定のため、両方＋併用に対応する

   ★契約関係と算定の起点（2026-08-15 オーナー確認）
   - 運営が契約を結ぶのは【技工所だけ】。医院と契約するのは技工所であって運営ではない。
     運営は技工所へ「使った分」を請求するだけなので、資金移動業には当たらない整理。
   - 算定の起点は【医院への請求が確定した時点】。入金確認は待たない。
   - 医院が技工所へ支払わなかった場合でも、案件が「要請求」のままなら運営は請求を立てる。
     技工所が折れて案件をキャンセルにした場合は、その案件の利用料は立てない。
     → 案件に billStatus（BILLED / CANCELED）を持たせ、CANCELED は算定対象から外す。
   ============================================================ */

const SVC_USERS=[
  {id:'a1',name:'高根 弘二',email:'takane@g-tech.example.jp',role:'SYS_ADMIN',label:'運営管理者',status:'ACTIVE'},
  {id:'a2',name:'運営サポート',email:'support@g-tech.example.jp',role:'SYS_SUPPORT',label:'サポート',status:'ACTIVE'}
];

/* ---------- 料金プラン ----------
   rules は上から評価し、最初に一致したものを使う。
   一致しなければプランの既定（mode/percent/flat）にフォールバックする。 */
let PLANS=[
  {id:'pl_std',name:'標準（レベニューシェア）',initialFee:150000,
   mode:'PERCENT',percent:8,minFee:200,maxFee:5000,
   desc:'案件額の8%。1件あたり200〜5,000円で頭打ち',
   rules:[
     {cov:'PRIVATE',  type:null,          amtMin:50000,amtMax:null,mode:'PERCENT',percent:5,memo:'高額な自費は率を下げる'},
     {cov:'PRIVATE',  type:null,          amtMin:null, amtMax:null,mode:'PERCENT',percent:8,memo:'自費の標準'},
     {cov:'INSURANCE',type:null,          amtMin:null, amtMax:null,mode:'FLAT',   flat:250,  memo:'保険は単価が低いので固定額'}
   ]},
  {id:'pl_flat',name:'1件あたり固定',initialFee:100000,
   mode:'FLAT',flat:300,minFee:null,maxFee:null,
   desc:'案件の内容を問わず1件300円',
   rules:[]},
  {id:'pl_intro',name:'導入促進（初年度）',initialFee:0,
   mode:'PERCENT',percent:4,minFee:100,maxFee:2000,
   desc:'初期費用なし・案件額の4%。初年度限定',
   rules:[]}
];
const planById=id=>PLANS.find(p=>p.id===id)||PLANS[0];

/* ---------- 技工所（テナント） ---------- */
let LABS=[
  {id:'t1',name:'なかたに技工所',code:'LAB-0001',status:'ACTIVE',since:'2024-04-01',
   pref:'大阪府',tel:'06-6xxx-xxxx',contact:'中谷 誠',
   planId:'pl_std',overrides:[],
   billingDay:'月末',terms:'翌月末',pay:'BANK',card:null,
   initialFee:{amount:150000,status:'PAID',invoicedOn:'2024-04-05'},
   clinics:4,staff:6},
  {id:'t2',name:'サンライズ・デンタルラボ',code:'LAB-0042',status:'ACTIVE',since:'2025-11-10',
   pref:'大阪府',tel:'072-xxx-xxxx',contact:'日下部 亮',
   planId:'pl_std',
   /* 個別上書き：自費のラミネートだけ率を下げている */
   overrides:[{cov:'PRIVATE',type:'ラミネートベニア',amtMin:null,amtMax:null,mode:'PERCENT',percent:4,memo:'交渉により'}],
   billingDay:'20日',terms:'翌月10日',pay:'CARD',card:{brand:'Visa',last4:'6411',exp:'12/28'},
   initialFee:{amount:150000,status:'PAID',invoicedOn:'2025-11-14'},
   clinics:2,staff:3},
  {id:'t3',name:'みどり歯科技工所',code:'LAB-0130',status:'TRIAL',since:'2026-08-01',
   pref:'兵庫県',tel:'078-xxx-xxxx',contact:'緑川 明',
   planId:'pl_intro',overrides:[],
   billingDay:'月末',terms:'翌月末',pay:'BANK',card:null,
   initialFee:{amount:0,status:'NONE',invoicedOn:null},
   clinics:1,staff:2},
  {id:'t4',name:'共和デンタルワークス',code:'LAB-0207',status:'SUSPENDED',since:'2025-02-20',
   pref:'京都府',tel:'075-xxx-xxxx',contact:'共和 太一',
   planId:'pl_flat',overrides:[],
   billingDay:'月末',terms:'翌月末',pay:'BANK',card:null,
   initialFee:{amount:100000,status:'UNPAID',invoicedOn:'2025-02-25'},
   clinics:0,staff:1}
];
const labById=id=>LABS.find(l=>l.id===id)||{name:'—',code:'—'};
const LAB_STATUS={ACTIVE:{l:'稼働中',c:'done'},TRIAL:{l:'トライアル',c:'prog'},
  SUSPENDED:{l:'停止中',c:'gray'},PENDING:{l:'開設準備',c:'wait'}};

/* ---------- 医院（グローバル・医院コードで一意） ---------- */
let CLINICS=[
  {id:'c1',code:'CL-2026-00417',name:'さくら歯科クリニック',pref:'大阪府',tel:'0666661111',
   labs:['t1','t2'],cases:38,since:'2024-04-01'},
  {id:'c2',code:'CL-2026-00418',name:'A歯科医院',pref:'大阪府',tel:'0666662222',
   labs:['t1'],cases:47,since:'2025-04-01'},
  {id:'c3',code:'CL-2026-00419',name:'B歯科クリニック',pref:'大阪府',tel:'0666663333',
   labs:['t1'],cases:34,since:'2025-09-12'},
  {id:'c4',code:'CL-2026-00420',name:'みどり台デンタル',pref:'兵庫県',tel:'0788881111',
   labs:['t1','t3'],cases:29,since:'2025-06-20'},
  {id:'c5',code:'CL-2026-00421',name:'C歯科',pref:'大阪府',tel:'0666664444',
   labs:['t2'],cases:6,since:'2026-07-30'},
  /* ★重複の疑い：電話番号が c2 と一致。運営が統合を判断する対象 */
  {id:'c6',code:'CL-2026-00433',name:'Ａ歯科医院',pref:'大阪府',tel:'0666662222',
   labs:['t2'],cases:3,since:'2026-08-02'}
];

/* ---------- 案件（手数料の算定対象） ----------
   医院が技工所へ支払った額が確定した案件のみが対象になる。 */
const TYPES=['クラウン','インレー','ブリッジ','前装冠','局部床義歯','ラミネートベニア'];
let _s=20260812;
const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff};
const pick=a=>a[Math.floor(rnd()*a.length)];
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

let CASES=[];
(function(){
  const active=LABS.filter(l=>l.status!=='SUSPENDED');
  for(let i=0;i<180;i++){
    const lab=pick(active);
    const clinicPool=CLINICS.filter(c=>c.labs.includes(lab.id));
    if(!clinicPool.length)continue;
    const cl=pick(clinicPool);
    const cov=rnd()<0.62?'INSURANCE':'PRIVATE';
    const type=cov==='INSURANCE'?pick(['クラウン','インレー','ブリッジ','前装冠','局部床義歯'])
                                :pick(['クラウン','インレー','ブリッジ','ラミネートベニア']);
    const amount=cov==='INSURANCE'?ri(5,19)*1000:ri(16,90)*1000;
    /* billStatus … BILLED=医院への請求が確定（利用料の対象）／CANCELED=技工所が請求を取り下げた（対象外）
       PAID/UNPAID は「医院が払ったか」。★払っていなくても利用料は立つ（キャンセルされない限り） */
    const canceled=rnd()<0.035;
    CASES.push({id:'k'+i,no:lab.code.replace('LAB-','')+'-'+(1000+i),
      tenantId:lab.id,clinicId:cl.id,cov,type,amount,
      billStatus:canceled?'CANCELED':'BILLED',
      cancelReason:canceled?pick(['再製作のため技工所判断で請求取下げ','医院との協議により減額・取下げ']):null,
      clinicPaid:canceled?false:rnd()>0.12,

/* ============================================================
   手数料の算定（この関数がビジネスモデルの中核）

   料率(%)・1件固定(円)・案件内容別のルール・下限上限、すべてここで解決する。
   「率にするか固定にするか未定」なので、どちらでも切り替えられる形にしている。
   ============================================================ */
function resolveFee(lab,c){
  const plan=planById(lab.planId);
  /* 技工所ごとの個別上書きを先に評価する */
  const rules=[...(lab.overrides||[]),...(plan.rules||[])];
  const hit=rules.find(r=>
    (!r.cov||r.cov===c.cov) &&
    (!r.type||r.type===c.type) &&
    (r.amtMin==null||c.amount>=r.amtMin) &&
    (r.amtMax==null||c.amount<=r.amtMax));
  const m=hit||{mode:plan.mode,percent:plan.percent,flat:plan.flat};
  let fee=m.mode==='PERCENT'?Math.round(c.amount*(m.percent/100)):(m.flat||0);
  let clamp=null;
  if(plan.minFee!=null&&fee<plan.minFee){fee=plan.minFee;clamp='下限';}
  if(plan.maxFee!=null&&fee>plan.maxFee){fee=plan.maxFee;clamp='上限';}
  return {fee,mode:m.mode,percent:m.percent,flat:m.flat,
          source:hit?(lab.overrides||[]).includes(hit)?'個別':'プラン':'既定',
          memo:hit?hit.memo:null,clamp};
}
const allLabCases=id=>CASES.filter(c=>c.tenantId===id);
/* ★算定対象はキャンセルされていない案件のみ。以降の集計はすべてこちらを使う */
const labCases=id=>billable(allLabCases(id));
const canceledCases=id=>allLabCases(id).filter(c=>c.billStatus==='CANCELED');
function labFeeTotal(id){
  const lab=labById(id);
  return labCases(id).reduce((s,c)=>s+resolveFee(lab,c).fee,0);
}
function labRevenue(id){return labCases(id).reduce((s,c)=>s+c.amount,0)}
const totalFee=()=>LABS.reduce((s,l)=>s+labFeeTotal(l.id),0);
const totalRevenue=()=>LABS.reduce((s,l)=>s+labRevenue(l.id),0);
const BILLABLE=()=>billable(CASES);
const unpaidTotal=()=>INVOICES.filter(i=>['ISSUED','OVERDUE'].includes(i.status))
  .reduce((s,i)=>s+invTotal(i),0);
function invSubtotal(i){return i.lines.reduce((s,l)=>s+l.qty*l.unit,0)}
function invTax(i){return Math.round(invSubtotal(i)*0.1)}
function invTotal(i){return invSubtotal(i)+invTax(i)}

/* ============================================================
   料金シミュレータ — 5つの取り方を、この技工所の実件数の上に並べる

   ★重要な設計上の含み
     ②（流通額 × 率）だけが案件ごとに確定できる。
     ①③④⑤は「その月の合計」が出そろわないと金額が決まらない。
     いまの設計（基本設計 29章）は案件の請求確定ごとに service_fees を
     1行積む形なので、①③④⑤を採るなら月次で確定させる経路が別に要る。
     表の「確定の単位」列はそれを示している。
   ============================================================ */
const SIM_PATTERNS=[
  {id:'FIXED',  name:'① 固定',        hint:'月額いくら',                monthly:true,
   fee:(s,cs,rev)=>s.fixed},
  {id:'PERCENT',name:'② 流通額従量',   hint:'流通額 × 率',               monthly:false,
   fee:(s,cs,rev)=>rev*s.percent/100},
  {id:'TIER',   name:'③ 件数レンジ',   hint:'件数の帯で段階的に',        monthly:true,
   fee:(s,cs,rev)=>s.tierStep>0?Math.max(1,Math.ceil(cs/s.tierStep))*s.tierUnit:0},
  {id:'PROG',   name:'④ 楽天方式',     hint:'レンジごとに率を変えて合算', monthly:true,
   fee:(s,cs,rev)=>{
     /* 累進。各帯からはみ出した分にだけ、その帯の率をかけて合算する */
     const B1=1000000,B2=5000000;
     let f=Math.min(rev,B1)*s.pr1/100;
     if(rev>B1)f+=(Math.min(rev,B2)-B1)*s.pr2/100;
     if(rev>B2)f+=(rev-B2)*s.pr3/100;
     return f;
   }},
  {id:'HYBRID', name:'⑤ ハイブリッド', hint:'月額 ＋ 従量',              monthly:true,
   fee:(s,cs,rev)=>s.hybFixed+rev*s.hybRate/100},
];

/* 案件を決済月ごとにまとめる。月額の取り方と比べるには、月単位に揃える必要がある */
function labMonths(id){
  const by={};
  labCases(id).forEach(c=>{
    const m=(c.settledOn||'').slice(0,7);
    (by[m]||=[]).push(c);
  });
  return Object.keys(by).sort().map(m=>({
    month:m, cases:by[m].length,
    rev:by[m].reduce((a,c)=>a+c.amount,0),
    list:by[m]
  }));
}

function openSim(id){
  const l=labById(id);
  S.sim={fixed:5000,percent:0.1,tierStep:100,tierUnit:1000,
         pr1:0.3,pr2:0.15,pr3:0.05,hybFixed:2000,hybRate:0.05,pick:'PERCENT'};
  S.modal={title:`${l.name} の料金シミュレーション`,wide:true,body:simBody(id),ok:null};
  render();
}

function simBody(id){
  const l=labById(id),s=S.sim;
  const ms=labMonths(id);
  if(!ms.length)return '<p class="note">算定対象の案件がありません。</p>';

  /* 月ごとに5パターンを計算し、月平均で並べる。
     1ヶ月ぶんだけで比べると、月額の取り方が有利にも不利にも振れる */
  const rows=SIM_PATTERNS.map(p=>{
    const per=ms.map(m=>p.fee(s,m.cases,m.rev));
    const avg=per.reduce((a,b)=>a+b,0)/ms.length;
    return {p,per,avg};
  });
  const avgCases=ms.reduce((a,m)=>a+m.cases,0)/ms.length;
  const avgRev=ms.reduce((a,m)=>a+m.rev,0)/ms.length;
  const cur=labFeeTotal(id)/ms.length;   /* 現在の設定（案件ごと）の月平均 */

  const num=(k,step)=>`<input type="number" value="${s[k]}"${step?` step="${step}"`:''}
      oninput="setSim('${k}',+this.value,'${id}')" style="width:100%">`;

  return `
  <p class="note">
    ${l.name} の確定案件 <b>${ms.reduce((a,m)=>a+m.cases,0)}件</b>（${ms.map(m=>m.month).join('・')}）を
    月ごとに分けて、5つの取り方を並べます。表は<b>月平均</b>です。
    現在の設定（案件ごとの算定）は月平均 <b>${yen(cur)}</b>。
  </p>
  <p class="note">
    ★<b>現在の設定はデモの仮置き（案件額の8%）です。</b>会議で「納得できる」とされた水準は
    <b>流通額の0.1%程度</b>なので、下の5パターンはいずれも現在の設定より大幅に低く出ます。
    比べるべきは「現在との差」ではなく<b>5パターンどうし</b>です。
  </p>

  <div class="grid g3 mt">
    <div class="card stat"><div class="n">${Math.round(avgCases)}</div><div class="l">月あたり件数</div></div>
    <div class="card stat"><div class="n">${yen(avgRev)}</div><div class="l">月あたり流通額</div></div>
    <div class="card stat"><div class="n">${yen(avgRev/avgCases)}</div><div class="l">1件あたり平均</div></div>
  </div>

  <h3 class="mt">5つの取り方（月平均）</h3>
  <div class="tw"><table>
    <thead><tr><th>取り方</th><th class="num">月額</th><th class="num">実効料率</th>
      <th class="num">1件あたり</th><th class="num">現在との差</th><th>確定の単位</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td><b>${r.p.name}</b><br><span class="note">${r.p.hint}</span></td>
      <td class="num"><b>${yen(r.avg)}</b></td>
      <td class="num">${avgRev?pct(r.avg/avgRev*100):'—'}</td>
      <td class="num">${avgCases?yen(r.avg/avgCases):'—'}</td>
      <td class="num" style="color:${r.avg-cur>=0?'var(--success)':'var(--danger)'}">
        ${r.avg-cur>=0?'+':'−'}${yen(Math.abs(r.avg-cur))}</td>
      <td>${r.p.monthly
        ? '<span class="b gray">月次でまとめて</span>'
        : '<span class="b mny">案件ごと</span>'}</td>
    </tr>`).join('')}</tbody>
  </table></div>

  <p class="note mt">
    ★<b>「確定の単位」は実装に効きます。</b>案件ごとに確定できるのは②だけです。
    ①③④⑤は月の合計が出そろうまで金額が決まらないため、
    <b>案件の請求確定ごとに利用料を積む今の形（29章）とは別に、月次で確定させる経路が要ります。</b>
  </p>

  <h3 class="mt">パラメータ</h3>
  <div class="grid g2">
    <label class="f"><span class="lb">① 技工所の月額（円）</span>${num('fixed')}</label>
    <label class="f"><span class="lb">② 料率（％）</span>${num('percent','0.01')}</label>
  </div>
  <div class="grid g2 mt">
    <label class="f"><span class="lb">③ 帯の幅（件）</span>${num('tierStep')}</label>
    <label class="f"><span class="lb">③ 1段あたり（円）</span>${num('tierUnit')}</label>
  </div>
  <div class="grid g3 mt">
    <label class="f"><span class="lb">④ 100万円まで（％）</span>${num('pr1','0.01')}</label>
    <label class="f"><span class="lb">④ 500万円まで（％）</span>${num('pr2','0.01')}</label>
    <label class="f"><span class="lb">④ それ以上（％）</span>${num('pr3','0.01')}</label>
  </div>
  <div class="grid g2 mt">
    <label class="f"><span class="lb">⑤ 月額（円）</span>${num('hybFixed')}</label>
    <label class="f"><span class="lb">⑤ 上乗せ料率（％）</span>${num('hybRate','0.01')}</label>
  </div>

  <h3 class="mt">月ごとの内訳</h3>
  <div class="tw"><table>
    <thead><tr><th>月</th><th class="num">件数</th><th class="num">流通額</th>
      ${SIM_PATTERNS.map(p=>`<th class="num">${p.name.slice(0,2)}</th>`).join('')}</tr></thead>
    <tbody>${ms.map((m,i)=>`<tr>
      <td>${m.month}</td><td class="num">${m.cases}</td><td class="num">${yen(m.rev)}</td>
      ${rows.map(r=>`<td class="num">${yen(r.per[i])}</td>`).join('')}
    </tr>`).join('')}</tbody>
  </table></div>

  <p class="note mt">
    ③は<b>帯をまたぐ1件で跳ねます。</b>月末の1件を翌月に回す動機が毎月生まれるため、
    納期を管理するシステムとしては採りにくい形です。採るなら④（累進）に寄せてください。
  </p>`;
}
function setSim(k,v,id){S.sim[k]=v;S.modal.body=simBody(id);render()}

/* ============================================================
   医院（運営から見た全医院）
   ============================================================ */
/* 「別医院として扱う」と判断した組み合わせ。以後の重複検出から外す（FR-SV-009） */
let NOT_DUPE=[];
const pairKey=(a,b)=>[a,b].sort().join('|');
function findDupes(){
  const byTel={};
  CLINICS.forEach(c=>{const t=norm(c.tel);if(!t)return;(byTel[t]||=[]).push(c)});
  return Object.values(byTel)
    .filter(a=>a.length>1)
    .filter(a=>!NOT_DUPE.includes(pairKey(a[0].id,a[1].id)));
}
function markNotDupe(a,b){
  const A=CLINICS.find(x=>x.id===a),B=CLINICS.find(x=>x.id===b);
  NOT_DUPE.push(pairKey(a,b));
  logAudit('別医院として記録',`${A.name} / ${B.name}`,'以後の重複検出から除外');
  toast('別医院として記録しました。重複検出には出なくなります');
  render();
}

        <dl class="kv mt" style="grid-template-columns:90px 1fr">
          <dt>案件</dt><dd>${B.cases}件</dd><dt>取引</dt><dd>${B.labs.length}社</dd>
          <dt>登録</dt><dd>${esc(B.since)}</dd></dl></div></div>

      <input type="text" id="mgCode" placeholder="${esc(A.code)}"></label>`,
    ok:'統合する',fn:()=>{
      if(document.getElementById('mgCode').value.trim()!==A.code){
        toast('医院コードが一致しません');return;
      }
      A.cases+=B.cases;
      B.labs.forEach(id=>{if(!A.labs.includes(id))A.labs.push(id)});
      CASES.forEach(c=>{if(c.clinicId===b)c.clinicId=a});
      CLINICS=CLINICS.filter(x=>x.id!==b);
      logAudit('医院の統合',A.name,`${B.name}（${B.code}）を統合。案件・請求・承認を付け替え`);

  render();
}

function openNewInvoice(labId,kind){
  S.modal={title:'請求書を作成',wide:true,body:`
    <div class="grid g2">
      <label class="f"><span class="lb">技工所 <span class="req">必須</span></span>

          `<option value="${l.id}" ${labId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>

        <select id="niKind" onchange="niKindChange()">
          <option value="FEE" ${kind==='FEE'?'selected':''}>サービス利用料</option>
          <option value="INITIAL">初期費用</option>
          <option value="MANUAL">手動作成（その他）</option>
        </select></label>
      <label class="f"><span class="lb">対象期間・件名</span>
        <input type="text" id="niPeriod" value="2026年8月分"></label>
      <label class="f"><span class="lb">支払期日</span>
        <input type="date" id="niDue" value="2026-09-30"></label>
    </div>
    <h3>明細</h3>
    <div id="niLines"></div>
    <button class="btn sm mt" onclick="niAddLine()">＋ 明細行を追加</button>
    <p class="note mt">初期費用や個別の請求は、この画面で手入力して作成できます。</p>`,
    ok:'下書きを作成',fn:()=>{
      const lab=document.getElementById('niLab').value;
      const lines=[...document.querySelectorAll('#niLines .niRow')].map(r=>({
        name:r.querySelector('.niName').value.trim(),
        qty:+r.querySelector('.niQty').value||1,
        unit:+r.querySelector('.niUnit').value||0
      })).filter(x=>x.name&&x.unit);
      if(!lines.length){toast('明細を1行以上ご入力ください');return}
      INVOICES.unshift({id:'iv'+Date.now(),
        no:'SV-2026-08-'+String(INVOICES.length+1).padStart(3,'0'),
        tenantId:lab,kind:document.getElementById('niKind').value,
        period:document.getElementById('niPeriod').value,
        issuedOn:null,dueOn:document.getElementById('niDue').value,
        status:'DRAFT',paidOn:null,lines});
      S.modal=null;toast('請求書を下書きで作成しました');go('invoices');
    }};
  render();
  setTimeout(()=>{niKindChange()},0);
}
function niKindChange(){
  /* ★setTimeout(...,0) から呼ばれる。発火する前にモーダルが閉じられていると
     要素が無く、TypeError で落ちる（2026-08-28 の網羅テストで検出）。
     遅れて走るコードは、要素がまだあるかを必ず確かめる。 */
  const kEl=document.getElementById('niKind');
  const labEl=document.getElementById('niLab');
  const box=document.getElementById('niLines');
  if(!kEl||!labEl||!box)return;
  const k=kEl.value;
  const lab=labById(labEl.value);
  let name='',unit=0;
  if(k==='FEE'){name=`サービス利用料（2026年8月・案件${labCases(lab.id).length}件）`;unit=labFeeTotal(lab.id)}
  else if(k==='INITIAL'){name='初期導入費用';unit=lab.initialFee?.amount||planById(lab.planId).initialFee||0}
  box.innerHTML='';
  niAddLine(name,1,unit);
}
function niAddLine(name,qty,unit){
  const box=document.getElementById('niLines');
  if(!box)return;
  const d=document.createElement('div');
  d.className='niRow rule';
  d.style.gridTemplateColumns='1fr 70px 110px 34px';
  d.innerHTML=`<input type="text" class="niName" placeholder="内容" value="${esc(name||'')}">
    <input type="number" class="niQty" value="${qty||1}">
    <input type="number" class="niUnit" placeholder="単価" value="${unit||''}">
    <button class="btn sm dgr" onclick="this.closest('.niRow').remove()">×</button>`;
  box.appendChild(d);
}

/* 医院マスタの取り込み。既存は医院コードで突き合わせて更新、無ければ追加 */
function openImportClinics(){
  DL.csv.pickFile(text=>{
    if(text==null){toast('ファイルを読み込めませんでした');return}
    const {items}=DL.csv.toObjects(CSV_COLS.clinics,DL.csv.parse(text));
    const issues=items.map(o=>{
      if(!o.name)return {level:'error',msg:'医院名がありません'};
      if(!o.code)return {level:'warn',msg:'医院コードなし → 新規採番'};
      const hit=CLINICS.find(c=>c.code===o.code);
      if(hit)return {level:'warn',msg:'既存を更新'};
      const dup=CLINICS.find(c=>norm(c.tel)===norm(o.tel)&&norm(o.tel));
      if(dup)return {level:'warn',msg:`電話番号が ${dup.code} と一致`};
      return null;
    });
    const errs=issues.filter(x=>x&&x.level==='error').length;
    S.modal={title:'医院マスタの取り込み',wide:true,body:`
      <p>${items.length}行を読み込みました。内容を確認してから取り込んでください。</p>
      ${errs?`<div class="alert dgr mb">${errs}行にエラーがあります。該当行は取り込みません。</div>`:''}
      ${DL.csv.previewHtml(CSV_COLS.clinics,items,issues)}
      <div class="alert warn mt" style="font-size:12.5px">
        医院コードが一致する行は<b>上書き更新</b>、無い行は<b>新規登録（コードを採番）</b>します。
        電話番号が既存と一致する行は重複の疑いとして残るので、取り込み後に医院一覧で確認してください。</div>`,
      ok:`${items.length-errs}行を取り込む`,fn:()=>{
        let add=0,upd=0;
        items.forEach((o,i)=>{
          if(issues[i]&&issues[i].level==='error')return;
          const hit=o.code&&CLINICS.find(c=>c.code===o.code);
          if(hit){Object.assign(hit,{name:o.name||hit.name,pref:o.pref||hit.pref,tel:o.tel||hit.tel});upd++;}
          else{
            const n=Math.max(...CLINICS.map(c=>+String(c.code).slice(-5)||0))+1+add;
            CLINICS.push({id:'c'+(CLINICS.length+1+add),
              code:o.code||`CL-2026-${String(n).padStart(5,'0')}`,
              name:o.name,pref:o.pref||'—',tel:o.tel||'',labs:[],cases:0,since:DL.TODAY});
            add++;
          }
        });
        logAudit('医院マスタの取り込み','医院マスタ',`新規${add}件・更新${upd}件`);
        closeModal();toast(`新規 ${add}件・更新 ${upd}件を取り込みました`);go('clinics');
      }};
    render();
  });
}

   料金プランの作成・編集

/* プラン本体とルールを1つのモーダルの中で行き来する。
   入れ子のモーダルにすると、閉じたときにどちらが残るのか分かりにくくなるため。 */
function openPlanEdit(id){
  const p=id?PLANS.find(x=>x.id===id):null;
  S.planTarget=p||null;
  S.planDraft=p?JSON.parse(JSON.stringify(p)):{id:'pl_'+Date.now(),name:'',desc:'',initialFee:0,
    mode:'PERCENT',percent:8,flat:300,minFee:null,maxFee:null,rules:[]};
  S.ruleEdit=null;
  planModal();
}
/* 状態（プラン本体を編集中か、ルールを編集中か）からモーダルを組み立て直す */
function planModal(){
  const p=S.planTarget,d=S.planDraft;
  if(S.ruleEdit){
    S.modal={title:S.ruleEdit.i==null?'ルールを追加':'ルールを編集',wide:true,
      body:`<div class="alert info mb" style="font-size:12.5px">
        このルールは<b>${esc(d.name||'（プラン名未入力）')}</b>に属します。
        上から順に評価され、最初に一致したものが使われます。</div>
        ${ruleForm(S.ruleEdit.r,'pr')}`,
      ok:'このルールを反映',fn:()=>{
        const v=readRuleForm('pr');
        if(!v)return;
        if(S.ruleEdit.i==null)d.rules.push(v); else d.rules[S.ruleEdit.i]=v;
        S.ruleEdit=null;planModal();
      },
      foot:`<button class="btn" onclick="S.ruleEdit=null;planModal()">ルール編集をやめる</button>`};
  }else{
    S.modal={title:p?`${p.name} を編集`:'料金プランを作成',wide:true,body:planForm(),
      ok:'保存する',fn:()=>{
        const g=k=>document.getElementById(k);
        d.name=g('pfName').value.trim();
        d.desc=g('pfDesc').value.trim();
        d.initialFee=+g('pfInit').value||0;
        d.mode=g('pfMode').value;
        d.percent=+g('pfPct').value||0;
        d.flat=+g('pfFlat').value||0;
        d.minFee=g('pfMin').value===''?null:+g('pfMin').value;
        d.maxFee=g('pfMax').value===''?null:+g('pfMax').value;
        if(!d.name){toast('プラン名をご入力ください');return}
        if(d.minFee!=null&&d.maxFee!=null&&d.minFee>d.maxFee){toast('下限が上限を超えています');return}
        if(p){Object.assign(p,d);logAudit('料金プランの変更',d.name,planSummaryText(d));}
        else {PLANS.push(d);logAudit('料金プランの作成',d.name,planSummaryText(d));}
        S.planDraft=null;S.planTarget=null;closeModal();
        toast(p?'プランを保存しました':'プランを作成しました');render();
      }};
  }
  render();
}
/* プラン本体の入力欄は render のたびに作り直されるので、
   ルール編集へ移る前に入力中の値を控えておく */
function keepPlanFields(){
  const d=S.planDraft,g=k=>document.getElementById(k);
  if(!g('pfName'))return;
  d.name=g('pfName').value;d.desc=g('pfDesc').value;
  d.initialFee=+g('pfInit').value||0;d.mode=g('pfMode').value;
  d.percent=+g('pfPct').value||0;d.flat=+g('pfFlat').value||0;
  d.minFee=g('pfMin').value===''?null:+g('pfMin').value;
  d.maxFee=g('pfMax').value===''?null:+g('pfMax').value;
}
function delPlan(id){
  const p=PLANS.find(x=>x.id===id);
  const users=LABS.filter(l=>l.planId===id);
  S.modal={title:'料金プランを削除',body:users.length

/* ルール編集へ切り替える。入力途中のプラン本体の値を失わないよう先に控える */
function openPlanRule(i){
  keepPlanFields();
  S.ruleEdit={i,r:i==null
    ?{cov:null,type:null,amtMin:null,amtMax:null,mode:'PERCENT',percent:5,flat:300,memo:''}
    :JSON.parse(JSON.stringify(S.planDraft.rules[i]))};
  planModal();
}
function planRuleRows(){
  const d=S.planDraft;
  if(!d.rules.length)return '<div class="note">ルールなし（既定の算定のみ）</div>';
  return d.rules.map((r,i)=>`<div class="rule">
    <span>${r.cov?(r.cov==='PRIVATE'?'<span class="b pri2">自費</span>':'<span class="b ins">保険</span>'):'<span class="note">すべて</span>'}</span>
    <span>${r.type?esc(r.type):'<span class="note">すべて</span>'}</span>
    <span class="note">${r.amtMin!=null?yen(r.amtMin)+'〜':''}${r.amtMax!=null?'〜'+yen(r.amtMax):(r.amtMin!=null?'':'指定なし')}</span>
    <span><b>${r.mode==='PERCENT'?r.percent+'%':yen(r.flat)}</b></span>
    <span class="note">${esc(r.memo||'')}</span>
    <span class="row" style="gap:2px;flex-wrap:nowrap">
      <button class="btn sm" onclick="movePlanRule(${i},-1)" ${i===0?'disabled':''} title="上へ">↑</button>
      <button class="btn sm" onclick="movePlanRule(${i},1)" ${i===d.rules.length-1?'disabled':''} title="下へ">↓</button>
      <button class="btn sm" onclick="openPlanRule(${i})" title="編集">✎</button>
      <button class="btn sm dgr" onclick="delPlanRule(${i})" title="削除">×</button></span></div>`).join('');
}
function movePlanRule(i,d){
  const a=S.planDraft.rules,j=i+d;
  if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  document.getElementById('pfRules').innerHTML=planRuleRows();
}
function delPlanRule(i){
  S.planDraft.rules.splice(i,1);
  document.getElementById('pfRules').innerHTML=planRuleRows();
}

    <label class="f"><span class="lb">診療区分</span>
      <select id="${pfx}Cov">
        <option value="">すべて</option>
        <option value="INSURANCE" ${r.cov==='INSURANCE'?'selected':''}>保険</option>

        ${TYPES.map(t=>`<option ${r.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
    <label class="f"><span class="lb">金額の下限（円）<span class="hint">この額以上に適用</span></span>
      <input type="number" id="${pfx}Min" value="${r.amtMin??''}" placeholder="指定なし"></label>
    <label class="f"><span class="lb">金額の上限（円）</span>
      <input type="number" id="${pfx}Max" value="${r.amtMax??''}" placeholder="指定なし"></label>
    <label class="f"><span class="lb">算定方式</span>
      <select id="${pfx}Mode" onchange="document.getElementById('${pfx}PctBox').style.display=this.value==='PERCENT'?'':'none';document.getElementById('${pfx}FlatBox').style.display=this.value==='FLAT'?'':'none'">
        <option value="PERCENT" ${r.mode==='PERCENT'?'selected':''}>料率（％）</option>
        <option value="FLAT" ${r.mode==='FLAT'?'selected':''}>1件あたり固定額</option></select></label>
    <div>
      <label class="f" id="${pfx}PctBox" style="display:${r.mode==='PERCENT'?'':'none'}">
        <span class="lb">料率（％）</span>
        <input type="number" id="${pfx}Pct" step="0.5" value="${r.percent??5}"></label>
      <label class="f" id="${pfx}FlatBox" style="display:${r.mode==='FLAT'?'':'none'}">
        <span class="lb">1件あたり（円）</span>
        <input type="number" id="${pfx}Flat" value="${r.flat??300}"></label>
    </div>
  </div>
  <label class="f"><span class="lb">メモ <span class="hint">なぜこの条件にしたかを残す</span></span>
    <input type="text" id="${pfx}Memo" value="${esc(r.memo||'')}" placeholder="高額な自費は率を下げる"></label>`;
}
function readRuleForm(pfx){
  const g=k=>document.getElementById(pfx+k);
  const mode=g('Mode').value;
  const v={cov:g('Cov').value||null,type:g('Type').value||null,
    amtMin:g('Min').value===''?null:+g('Min').value,
    amtMax:g('Max').value===''?null:+g('Max').value,
    mode,percent:+g('Pct').value||0,flat:+g('Flat').value||0,memo:g('Memo').value.trim()};
  if(mode==='PERCENT'&&!v.percent){toast('料率をご入力ください');return null}
  if(mode==='FLAT'&&!v.flat){toast('固定額をご入力ください');return null}
  if(v.amtMin!=null&&v.amtMax!=null&&v.amtMin>v.amtMax){toast('金額の下限が上限を超えています');return null}
  return v;
}

  S.modal={title:canceled?'請求対象に戻す':'この案件をキャンセル扱いにする',wide:true,body:`
    <dl class="kv mb">
      <dt>ケース番号</dt><dd><code>${esc(c.no)}</code></dd>
      <dt>技工所</dt><dd>${esc(l.name)}</dd>
      <dt>医院</dt><dd>${esc((CLINICS.find(x=>x.id===c.clinicId)||{}).name||'—')}</dd>
      <dt>医院への請求額</dt><dd>${yen(c.amount)}</dd>
      <dt>医院からの入金</dt><dd>${c.clinicPaid?'<span class="b done">確認済み</span>':'<span class="b wait">未入金</span>'}</dd>
      <dt>サービス利用料</dt><dd><b>${yen(f.fee)}</b></dd>
    </dl>
    ${canceled?`<div class="alert info">キャンセル扱いを解除すると、この案件は再び利用料の算定対象になります。</div>
      <p class="note">現在の理由：${esc(c.cancelReason||'—')}</p>`
    :`<div class="alert warn">
      <b>医院が支払っていないこと自体は、キャンセルの理由になりません。</b><br>
      案件が「要請求」のままなら、運営は技工所へ利用料を請求します。
      技工所が請求を取り下げた場合にのみ、キャンセル扱いにしてください。</div>
     <label class="f mt" style="margin-bottom:0"><span class="lb">理由 <span class="req">必須</span></span>
      <input type="text" id="ccReason" placeholder="再製作のため技工所判断で請求取下げ"></label>`}`,
    ok:canceled?'請求対象に戻す':'キャンセル扱いにする',danger:!canceled,fn:()=>{
      if(canceled){c.billStatus='BILLED';c.cancelReason=null;
        logAudit('案件の請求対象化',l.name,`${c.no} を算定対象に戻した`);
        closeModal();toast('請求対象に戻しました');render();return}
      const r=document.getElementById('ccReason').value.trim();
      if(!r){toast('理由をご入力ください');return}
      c.billStatus='CANCELED';c.cancelReason=r;
      logAudit('案件のキャンセル扱い',l.name,`${c.no}（${yen(f.fee)}）— ${r}`);
      closeModal();toast('キャンセル扱いにしました。利用料は算定されません');render();
    }};
  render();
}

/* ============================================================
   共通
   ============================================================ */
/* ★ここは以前 (${m.fn})() と関数を文字列化して呼んでいたが、それだと
   クロージャが失われ、モーダル内の変数を参照する確定ボタンが軒並み動かなかった。
   S.modal.fn を直接呼ぶ形にして、開いた側の変数をそのまま使えるようにしている。 */
function closeModal(){S.modal=null;render()}
function renderModal(){
  if(!S.modal)return '';
  const m=S.modal;
  return `<div class="mask" onclick="if(event.target===this)closeModal()">
    <div class="modal ${m.wide?'wide':''}"><div class="mh">${esc(m.title)}</div>
      <div class="mb">${m.body}</div>
      <div class="mf">${m.foot||''}
      <button class="btn" onclick="closeModal()">${m.ok?'キャンセル':'閉じる'}</button>
      ${m.ok?`<button class="btn ${m.danger?'dgr':'pri'}" onclick="S.modal.fn()">${esc(m.ok)}</button>`:''}</div></div></div>`;
}

const TABS=[['dashboard','ダッシュボード'],['labs','技工所'],['clinics','医院'],
  ['plans','料金プラン'],['fees','サービス利用料'],['invoices','請求管理'],
  ['scoring','評価基準'],['users','運営ユーザー'],['audit','監査ログ']];
const TAB_PARENT={lab:'labs',clinic:'clinics',invoice:'invoices'};

function render(){
  document.getElementById('userPill').innerHTML=
    `${esc(ME().name)} <span class="note">${esc(ME().label)}</span>`;
  const cur=TAB_PARENT[S.route]||S.route;
  document.getElementById('tabs').innerHTML=TABS.map(([r,l])=>
    `<button class="${cur===r?'on':''}" onclick="go('${r}')">${l}</button>`).join('');
  const V={dashboard:vDashboard,labs:vLabs,lab:vLab,clinics:vClinics,clinic:vClinic,
    plans:vPlans,fees:vFees,invoices:vInvoices,invoice:vInvoice,scoring:vScoring,
    users:vUsers,audit:vAudit};
  document.getElementById('app').innerHTML=(V[S.route]||vDashboard)();
  document.getElementById('overlay').innerHTML=renderModal()+
    (S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}

const us=document.getElementById('userSel');
us.innerHTML=SVC_USERS.map(u=>`<option value="${u.id}">${u.name}（${u.label}）</option>`).join('');
us.onchange=e=>{S.me=e.target.value;S.route='dashboard';S.hist=[];render()};
render();
</script>
