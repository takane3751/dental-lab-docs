<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>技工物発注システム（医院側）</title>
<style>
:root{
  --bg:#f4f7f6; --surface:#fff; --surface-2:#fafcfb; --border:#dde5e2; --border-2:#eef3f1;
  --text:#16241f; --muted:#61736c; --faint:#8a9a94;
  --primary:#0f766e; --primary-dark:#115e59; --primary-soft:#e6f2f0;
  --accent:#b45309; --accent-soft:#fdf2e3;
  --danger:#b91c1c; --danger-soft:#fdeceb;
  --success:#15803d; --success-soft:#e9f6ed;
  --ins:#1d4ed8; --ins-soft:#e8eefc;
  --pri:#a16207; --pri-soft:#fbf3e0;
  --radius:10px; --shadow:0 1px 2px rgba(16,40,34,.06),0 4px 14px rgba(16,40,34,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}

.devbar{background:#111827;color:#9ca3af;font-size:11.5px;padding:4px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.devbar b{color:#e5e7eb}.devbar .sp{flex:1}.devbar a{color:#93c5fd}
.devbar select{width:auto;padding:1px 5px;font-size:11.5px;background:#374151;border:1px solid #4b5563;color:#fff;border-radius:4px}

header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.hd{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mk{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px}
.hd .sp{flex:1}
.pill{border:1px solid var(--border);background:var(--surface-2);border-radius:99px;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.bell{position:relative;border:1px solid var(--border);background:var(--surface-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:99px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
nav.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:none;padding:9px 13px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--primary-dark);border-bottom-color:var(--primary);font-weight:600}

main{max-width:1180px;margin:0 auto;padding:22px 16px 90px}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hdr{padding:12px 16px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:10px}
.card .hdr h2,.card .hdr h3{margin:0}
.card .bd{padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.form2{grid-template-columns:1fr 340px}
@media(max-width:900px){.g2,.g3,.form2{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mt{margin-top:16px}.mb{margin-bottom:16px}

.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px;transition:.12s}
.btn:hover{border-color:var(--faint);background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--primary-dark)}
.btn.dgr{background:#fff;border-color:#e5b4b1;color:var(--danger)}
.btn.wrn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.lg{padding:12px 22px;font-size:15px}
.btn.block{width:100%;display:block}

.b{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.b.ins{background:var(--ins-soft);color:var(--ins)}
.b.pri2{background:var(--pri-soft);color:var(--pri)}
.b.wait{background:var(--accent-soft);color:var(--accent)}
.b.prog{background:var(--primary-soft);color:var(--primary-dark)}
.b.done{background:var(--success-soft);color:var(--success)}
.b.dgr{background:var(--danger-soft);color:var(--danger)}
.b.gray{background:#eef1f0;color:var(--muted)}

.alert{border-radius:var(--radius);padding:13px 15px;font-size:13.5px;border:1px solid}
.alert.warn{background:var(--accent-soft);border-color:#f0d5a8;color:#7c3d06}
.alert.dgr{background:var(--danger-soft);border-color:#f0c0bd;color:#8c1d18}
.alert.info{background:var(--primary-soft);border-color:#b8dcd7;color:#0b544e}
.alert.ok{background:var(--success-soft);border-color:#b7e0c4;color:#12592d}

.actrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;transition:.12s}
.actrow:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.actrow+.actrow{margin-top:9px}
.actrow .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.actrow .ttl{font-weight:600;font-size:14px}
.actrow .meta{color:var(--muted);font-size:12.5px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border-2);vertical-align:middle}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}
.tw{overflow-x:auto}

label.f{display:block;margin-bottom:14px}
label.f .lb{font-size:13px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:6px}
label.f .hint{font-size:12px;color:var(--muted);font-weight:400}
.req{color:var(--danger);font-size:11px;font-weight:700}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 11px;background:#fff;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:8px;padding:7px 13px;cursor:pointer;background:#fff;font-size:13.5px}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.chip:disabled{opacity:.4;cursor:not-allowed}

.tc{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:12px}
.tc .q{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.tc .mid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc .lbl{font-size:11px;color:var(--faint);text-align:center;margin:3px 0}
.tooth{aspect-ratio:1/1.25;border:1px solid var(--border);background:#fff;border-radius:5px;font-size:11.5px;cursor:pointer;display:grid;place-items:center;padding:0;min-height:32px}
.tooth.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}

.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer}
.ck+.ck{margin-top:7px}
.ck.on{border-color:var(--success);background:var(--success-soft)}
.ck input{margin-top:4px;width:16px;height:16px;accent-color:var(--success)}
.ck .t{font-size:13.5px;font-weight:600}
.ck .d{font-size:12px;color:var(--muted)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:2px;background:var(--border)}
.tli{position:relative;padding-bottom:16px}
.tli::before{content:"";position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:99px;background:var(--border);border:2px solid var(--surface)}
.tli.hi::before{background:var(--primary)}
.tli.ap::before{background:var(--success)}
.tli.wn::before{background:var(--accent)}
.tli .tm{font-size:11.5px;color:var(--faint)}
.tli .tx{font-size:13.5px}
.tli .who{font-weight:600}

/* 🧑‍🔧 v0.8 医院に見せる3段階のミニバー。一覧の1セルに収める。
   ★工程名は出さない。3つだけ（ご回答 #61・BR-58） */
.e3{display:inline-flex;gap:3px;white-space:nowrap}
.e3c{font-size:10.5px;line-height:1.5;padding:1px 6px;border-radius:5px;
  background:var(--surface-2);color:var(--faint);border:1px solid var(--border-2)}
.e3c.dn{background:var(--primary-soft);color:var(--primary-dark);border-color:#b8dcd7}
.e3c.cur{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
.steps{display:flex;gap:0;overflow-x:auto;padding:2px}
.stp{flex:1;min-width:78px;text-align:center;position:relative;font-size:11.5px;color:var(--faint);padding-top:22px}
.stp::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;border-radius:99px;background:#fff;border:2px solid var(--border);transform:translateX(-50%);z-index:2}
.stp::after{content:"";position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--border);z-index:1}
.stp:last-child::after{display:none}
.stp.dn{color:var(--primary-dark)}
.stp.dn::before{background:var(--primary);border-color:var(--primary)}
.stp.dn::after{background:var(--primary)}
.stp.cur{color:var(--primary-dark);font-weight:700}
.stp.cur::before{background:#fff;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}

.diff{border:1px solid var(--border);border-radius:9px;overflow:hidden}
.diff .r{padding:13px 15px}
.diff .r+.r{border-top:1px solid var(--border-2)}
.diff .fn{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.diff .bf{color:var(--faint);text-decoration:line-through;font-size:13.5px}
.diff .af{font-size:15px;font-weight:700;color:var(--primary-dark)}
.diff .rs{margin-top:7px;font-size:12.5px;color:#5b4a2e;background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 11px;border-radius:0 6px 6px 0}

.mask{position:fixed;inset:0;background:rgba(15,30,25,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal.wide{max-width:860px}
.setnav{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.setnav a{padding:10px 13px;background:#fff;font-size:13.5px;cursor:pointer;color:var(--text)}
.setnav a:hover{background:var(--surface-2)}
.setnav a.on{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
@media(max-width:800px){main .grid[style*="200px"]{grid-template-columns:1fr!important}}
/* 請求書プレビュー（PDF出力と同じ） */
.inv{background:#fff;border:1px solid #ccc;padding:26px 30px;max-width:720px;margin:0 auto;
  font-size:12px;line-height:1.7;color:#000}
.inv .ih{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.inv .ttl{font-size:21px;font-weight:700;letter-spacing:.22em;border-bottom:2px solid #000;padding-bottom:3px}
.inv .meta{font-size:11px;text-align:right;line-height:1.9}
.inv .to{font-size:14px;font-weight:700;border-bottom:1px solid #000;padding-bottom:3px;display:inline-block;min-width:250px}
.inv .total{border:2px solid #000;padding:7px 12px;font-size:17px;font-weight:700;display:inline-block;margin:12px 0}
.inv table{font-size:11.5px;margin-top:10px}
.inv th{background:#f0f0f0;color:#000;border:1px solid #999;padding:5px 7px;font-size:11px}
.inv td{border:1px solid #ccc;padding:5px 7px}
.inv .from{margin-top:20px;font-size:11px;border-top:1px solid #ccc;padding-top:10px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--border-2);font-weight:700}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--border-2);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 14px 14px}

.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0}
.stat{padding:14px 16px}
.stat .n{font-size:26px;font-weight:700;line-height:1.2}
.stat .l{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:38px 16px;color:var(--faint);font-size:13.5px}
.ph{background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;display:grid;place-items:center;color:var(--faint);font-size:12px;aspect-ratio:4/3}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#16241f;color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.note{font-size:12px;color:var(--faint)}
code{background:var(--surface-2);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}

/* 見積・納期パネル */
.quote{position:sticky;top:104px}
.qbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.qbox .qh{padding:11px 15px;border-bottom:1px solid var(--border-2);font-size:13px;font-weight:700;background:var(--surface-2)}
.qbox .qb{padding:15px}
.due{text-align:center;padding:6px 0 10px}
.due .dl{font-size:11.5px;color:var(--muted)}
.due .dv{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.due .dd{font-size:12px;color:var(--muted)}
.brk{font-size:11.5px;color:var(--muted);line-height:1.9;border-top:1px dashed var(--border);padding-top:9px;margin-top:6px}
.brk .bi{display:flex;gap:8px}
.brk .bi span:last-child{margin-left:auto;color:var(--text)}
.pricerow{display:flex;font-size:13px;padding:3px 0}
.pricerow span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.pricerow.tot{border-top:1px solid var(--border);margin-top:7px;padding-top:9px;font-weight:700;font-size:16px}
/* 🖥 v0.6：親子構造・義歯のステージ・部位の重複表示 */
.itm{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:#fff}
.itm+.itm{margin-top:8px}
.itm .t{font-size:13.5px;font-weight:600}
.itm .d{font-size:12px;color:var(--muted)}
.ino{width:22px;height:22px;border-radius:99px;background:var(--primary);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;flex:none}
.addpanel{border:1px dashed var(--primary);border-radius:10px;padding:14px;background:var(--primary-soft)}
.addpanel .f{margin-bottom:12px}
.blocked{border:1px solid var(--border);border-radius:9px;padding:11px;background:var(--surface-2)}
.blocked .bh{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px}
.ck.dis{opacity:.55;cursor:not-allowed;background:var(--surface-2)}
.itabs{display:flex;gap:6px;flex-wrap:wrap}
.itab{display:flex;gap:7px;align-items:center;border:1px solid var(--border);border-radius:9px 9px 0 0;background:var(--surface-2);padding:9px 13px;cursor:pointer;font-size:13px}
.itab.on{background:#fff;border-bottom-color:#fff;font-weight:700;color:var(--primary-dark)}
.itab .n{width:18px;height:18px;border-radius:99px;background:var(--border);color:var(--text);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.itab.on .n{background:var(--primary);color:#fff}
.itab .dot{width:7px;height:7px;border-radius:99px;background:var(--accent)}
.tooth.other{background:var(--surface-2);border-style:dashed;color:var(--faint)}
.tlegend{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;border:1px dashed var(--border);background:var(--surface-2)}
.lead{font-size:11.5px;border-top:1px dashed var(--border);padding-top:8px;margin-top:6px}
.lead .li{display:flex;gap:8px;color:var(--muted);line-height:1.85}
.lead .li span:last-child{margin-left:auto}
.lead .li.late{color:var(--accent);font-weight:600}
.cfi{border:1px solid var(--border);border-radius:9px;padding:12px;background:var(--surface-2)}
.cfi+.cfi{margin-top:9px}
.kv.sm dt,.kv.sm dd{font-size:12.5px;padding:3px 0}
.dtl{display:flex;flex-direction:column}
.dsi{display:flex;gap:11px;align-items:flex-start;padding:11px 0}
.dsi+.dsi{border-top:1px dashed var(--border)}
.dsi .dn{width:24px;height:24px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.dsi.fin .dn{background:var(--success-soft);color:var(--success)}
.dsi .t{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dsi .d{font-size:12px;color:var(--muted)}
.pricerow.rush{color:var(--accent)}
.cd{background:var(--accent-soft);border:1px solid #f0d5a8;border-radius:8px;padding:9px 11px;font-size:12.5px;color:#7c3d06;margin-top:10px}
.cd b{font-variant-numeric:tabular-nums}
.rushopt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:#fff}
.rushopt+.rushopt{margin-top:7px}
.rushopt:hover{border-color:var(--accent)}
.rushopt.on{border-color:var(--accent);background:var(--accent-soft)}
.rushopt .rd{font-weight:700;font-size:14px}
.rushopt .rp{margin-left:auto;text-align:right}
.rushopt .rm{font-size:12px;color:var(--accent);font-weight:700}
.rushopt .ra{font-size:12.5px;font-variant-numeric:tabular-nums}
.rushopt.dis{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>

<div class="devbar">
  <b>DEMO</b>
  <span>ログイン中</span><select id="userSel"></select>
  <span>表示する発注先</span><select id="tenantSel"></select>
  <span class="sp"></span>
  <a href="lab.html">技工所側</a><a href="station.html">工程端末</a><a href="admin.html">運営側</a>
</div>

<header>
  <div class="hd">
    <div class="logo" id="brandLogo"><span class="mk">歯</span>
      <span><span id="brand"></span>
        <span class="note" style="font-weight:400;margin-left:6px">医院コード <code id="clinicCode"></code></span></span></div>
    <span class="sp"></span>
    <button class="bell" onclick="showNotif()">🔔<span class="dot">3</span></button>
    <span class="pill" id="userPill"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="app"></main>
<div id="overlay"></div>

<script src="shared.js"></script>
<script>
/* ============================================================
   マスタ相当のデモデータ
   ============================================================ */
/* ログインしている医院。医院コードはシステム全体で一意（BR-32／A-7）。
   このコードがあるので、2社目の技工所が同じ医院を新規登録することはできない。 */
const CLINIC={
  name:'さくら歯科クリニック', code:'CL-2026-00417',
  addr:'大阪市中央区○○ 1-2-3', tel:'06-6xxx-xxxx', founder:'佐々木 誠'
};

/* 取引先技工所（医院視点）。医院は複数の技工所と同時に取引する。
   status: ACTIVE=取引中 / PENDING=技工所から紐付け申請が届いている / INACTIVE=停止中 */
/* 🧑‍🔧 v0.8 status に REQUESTED（こちらから申請中）を追加した。

/* ============================================================

   ============================================================ */
const TODAY=new Date('2026-08-11T10:30:00+09:00');
/* 🧑‍🔧 v0.8 当日受付の締切。「16:30でも可」（ご回答 #4）。分まで見る */
const CUTOFF=LAB_TERMS.cutoff;
const cutoffMin=()=>{const [h,m]=CUTOFF.split(':').map(Number);return h*60+(m||0)};
const pastCutoff=()=>(TODAY.getHours()*60+TODAY.getMinutes())>=cutoffMin();
const LAB_CLOSED=[0,6];                  // 技工所の休業日（日・土）
const CLINIC_CLOSED=[0,4];               // 医院の休診日（日・木）
const HOLIDAYS=['2026-08-13','2026-08-14','2026-08-15'];  // 夏季休業

/* ★toISOString は UTC に変換する。深夜0時JST の Date を通すと前日になる。
   v0.8 で納期の起点が「ご来院日の前日」（＝深夜0時の Date）になったため、
   ここが直接 submitCase() の保存値を1日ずらしていた（監査 B-4）。
   ローカル日付で組み立てること。lab.html にも同じ定義がある。★両方そろえる */
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
/* ★日付だけで引き算する。時刻を持つ Date と深夜0時の Date を素で引くと、
   差に「その日の経過時間」が乗り、Math.round の境界が正午で反転する。
   同じ依頼が午前は「間に合う」・午後は「間に合わない」になっていた（監査 B-1）。
   lab.html:daysTo / station.html:daysTo は最初からこの形。★3画面でそろえる */
const DAY0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const dayDiff=(a,b)=>Math.round((DAY0(a)-DAY0(b))/86400000);
const WD=['日','月','火','水','木','金','土'];
const fmtJ=d=>`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;
/* 🧑‍🔧 v0.8 納期は「◯月◯日着」と書く。「8月25日着とか」（ご回答 #7）。
   医院にとっての納期は「届く日」なので、そう書かないと発送日と混同される。 */
const fmtDue=d=>fmtJ(d)+LAB_TERMS.dueSuffix;
const fmtDueStr=s=>s?fmtJ(new Date(s+'T00:00:00+09:00'))+LAB_TERMS.dueSuffix:'—';
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const isLabClosed=d=>LAB_CLOSED.includes(d.getDay())||HOLIDAYS.includes(fmt(d));
const isClinicClosed=d=>CLINIC_CLOSED.includes(d.getDay());
function addBiz(d,n){let x=new Date(d),left=n;while(left>0){x=addDays(x,1);if(!isLabClosed(x))left--;}return x}
function nextLabOpen(d){let x=new Date(d);while(isLabClosed(x))x=addDays(x,1);return x}
function nextClinicOpen(d){let x=new Date(d);while(isClinicClosed(x))x=addDays(x,1);return x}

/* ============================================================
   🧑‍🔧 v0.8 納期算出

   ★v0.7 は「技工物ごとの標準製作日数を積み上げ、本数と試適で加算する」設計だった。
     実務は違った。

     > 「アポイントベースで、保険は1週間、自費は2週間」
     > 「本数が増えたときの追加日数 → 追加の必要なし」（2026-08-25 ご回答 #1・#2）

   起点＝<b>診療区分の基準日数</b>。技工物ごとの差（adj）はそこからの調整。
   本数の加算は既定 0。IOS は1日短縮。

   ★技工所の設定が「次回ご来院日から逆算」のときは、
     最短日を満たす限り<b>ご来院日の前日</b>にお届けする（早く作りすぎない）。
     ご来院日が最短より前のときは、その旨を出して特急でのみ受ける（原則13）。
   ============================================================ */
function calcLeadTime(variant,units,tryIn,method,cov){
  const notes=[];
  const cv=cov||variant.cov||'INSURANCE';
  // 1. 受付起点日
  let d0=new Date(TODAY);
  if(pastCutoff()){d0=addDays(d0,1);notes.push(`${CUTOFF} を過ぎたため受付は翌日`);}
  d0=nextLabOpen(d0);
  // 2. 資材の到着
  let d1;
  if(method==='IOS'){d1=new Date(d0);notes.push('IOSデータのため搬送日数なし');}
  else{
    const ship=nextClinicOpen(addDays(d0,0));
    d1=nextLabOpen(addDays(ship,1));
    notes.push(`資材の到着に ${dayDiff(d1,d0)}日`);
  }
  // 3. 基準日数（★ここが起点）
  let w=LAB_TERMS.leadBase[cv];
  notes.push(`${cv==='PRIVATE'?'自費':'保険'}の基準 ${w}日`);
  if(variant.adj){w+=variant.adj;notes.push(`${variant.type} のため ${variant.adj>0?'+':''}${variant.adj}日`);}
  if(tryIn&&variant.tryIn){w+=variant.tryIn;notes.push(`試適のため +${variant.tryIn}日`);}
  const per=Math.max(0,units-1)*LAB_TERMS.perUnitExtra;
  if(per){w+=per;notes.push(`${units}本のため +${per}日`);}
  else if(units>1)notes.push(`${units}本でも日数は変わりません`);
  if(method==='IOS'&&LAB_TERMS.iosMinusDays){
    w-=LAB_TERMS.iosMinusDays;notes.push(`IOSのため −${LAB_TERMS.iosMinusDays}日`);}
  w=Math.max(1,Math.ceil(w));
  // 4. 製作完了（暦日で数え、休業日にあたったら次の営業日へ）
  let d2=nextLabOpen(addDays(d1,w));
  const hol=HOLIDAYS.filter(h=>{const hd=new Date(h);return hd>=d1&&hd<=d2});
  if(hol.length)notes.push(`${hol.length}日間の休業により繰り延べ`);
  // 5-6. 発送 → 医院着
  const d4=nextClinicOpen(addDays(d2,1));
  return {earliest:d4,breakdown:{d0,d1,w,d2,d4,notes}};
}

/* ★ご来院日から逆算した「お届け日」。
   最短日より後なら、ご来院日の前日にお届けする（早く作りすぎない）。
   最短日より前なら null を返し、呼び出し側が特急を案内する。 */
function deliverFor(earliest,visitStr){
  if(!visitStr)return {date:earliest,mode:'EARLIEST',short:0};
  const visit=new Date(visitStr+'T00:00:00+09:00');
  const want=nextClinicOpen(addDays(visit,-LAB_TERMS.beforeVisit));
  const short=dayDiff(earliest,want);   /* ★日付だけで比べる（監査 B-1） */
  if(short<=0)return {date:want,mode:'VISIT',short:0,visit,want};
  return {date:earliest,mode:'TOO_SOON',short,visit,want};
}

/* 🧑‍🔧 v0.8 特急。上限は LAB_TERMS.rushMaxDays（4日）。
   ★対象外は義歯だけ（ご回答 #11）。義歯は来院のたびに医院を経由するので、
     技工所側の努力では縮められない。 */
function rushOptions(variant,earliest,units,tryIn,cov,want){
  if(!variant.rush)return [];
  const out=[];
  for(const t of RUSH_TIERS){
    if(t.days>LAB_TERMS.rushMaxDays)continue;
    const d=nextClinicOpen(addDays(earliest,-t.days));
    /* ★休診日で押し戻されて最短と同じ日になる段階は選ばせない。
       「1日短縮」なのに同じ日付が並ぶと、割増だけ取られるように見える。 */
    const future=dayDiff(d,TODAY)>0, sooner=dayDiff(d,earliest)<0;
    /* 🧑‍🔧 v0.8 ★ご来院日に届かない段階は選ばせない（監査 B-2）。
       3日足りないのに「1日短縮＋20%」を押せると、割増を払って結局間に合わない。
       want が無い（ご来院日の未入力）ときは判定しない。 */
    const reaches=!want||dayDiff(d,want)<=0;
    const ok=future&&sooner&&reaches;
    const why=!future?'本日より前になるため'
      :!sooner?'休診日にあたり、通常のお届けと同じ日になるため'
      :!reaches?'この短縮ではご来院日に届かないため':null;
    out.push({days:t.days,date:d,mult:t.mult,pct:t.pct,label:t.label,ok,why,reaches});
  }
  return out;
}

function calcPrice(variant,units,opts,rushMult){
  const base=variant.price*units;
  /* eslint-disable-line — 以下は v0.7 から変えていない */
  let optSum=0;const optLines=[];
  for(const o of opts){const m=OPTIONS.find(x=>x.code===o);if(m){optSum+=m.amount;optLines.push(m);}}
  const sub=base+optSum;
  const rush=rushMult?Math.round(sub*(rushMult-1)):0;
  const ex=sub+rush;
  const tax=Math.round(ex*0.1);
  return {base,units,optLines,optSum,sub,rush,ex,tax,total:ex+tax};
}

/* ============================================================
   新規依頼（🖥 v0.6 で全面改訂）

   第3回会議（2026-08-20）で決まった3点をここで表現している。
   - BR-48 1依頼に技工物明細を複数持てる（同一患者で複数部位・複数種別が同時に来る）
   - BR-49 保険と自費を同一依頼に混在させない。★理由を画面に出す。隠すだけにしない
   - BR-50 義歯は固定物と同一依頼に混在させない → 専用フローへ分岐する
   - BR-52 分納しない。納期は最も遅い明細に律速される
   ============================================================ */

let ITEM_SEQ=0;
const newItem=()=>({iid:'i'+(++ITEM_SEQ),type:null,variant:null,units:1,teeth:[],tryIn:false,
  vals:Object.assign({},CLINIC_DEFAULTS),photos:0});

function startNew(kind){

    dent:null,dvals:{},dteeth:[],

    related:[],          /* 関連する依頼（ご回答 #71） */
    changeNotice:false}; /* 「変更の可能性あり」の事前申告（ご回答 #60） */

}
/* 🧑‍🔧 v0.8 関連する依頼の候補。
   ★同じ患者様で進行中のものを出す。カルテ番号で寄せる（患者コードがあればそちらを優先）。 */
function relatedCandidates(){
  const d=D();
  const key=(d.pat.pno||'').trim(), ch=(d.pat.chart||'').trim();
  if(!key&&!ch)return [];
  return CASES.filter(c=>c.status!=='DELIVERED'&&
    ((key&&c.pno===key)||(ch&&c.chart===ch)));
}
function toggleRelated(id){
  const d=D(),i=d.related.indexOf(id);
  i<0?d.related.push(id):d.related.splice(i,1);
  render();
}
const D=()=>S.draft;
const varOf=it=>VARIANTS.find(v=>v.id===it.variant)||{};
const CUR=()=>{const d=D();return d.items.find(i=>i.iid===d.cur)||d.items[0]||null};
const dentOf=()=>DENTURES.find(x=>x.id===D().dent)||null;
const covLabel=c=>c==='PRIVATE'?'自費':'保険';

/* ---------- 集約：納期・料金 ----------
   明細ごとに算出して、納期は最も遅いもの、料金は合算する。
   分納しない（BR-52）ので「最も遅い明細に律速される」が正しい挙動になる。 */
function itemLead(it){return calcLeadTime(varOf(it),it.units,it.tryIn,D().method,D().cov)}

function draftLead(){
  const d=D(); if(!d.items.length)return null;
  let worst=null;
  for(const it of d.items){
    const lt=itemLead(it);
    if(!worst||lt.earliest>worst.lt.earliest)worst={it,lt};
  }
  return worst;
}

/* 特急は「1つでも特急不可の明細があれば依頼全体で不可」。
   一部だけ早く作っても分納しないので意味がない。
   🧑‍🔧 v0.8：技工物ごとの下限（rushMin）は撤去した。
   上限は技工所の設定（LAB_TERMS.rushMaxDays＝4日）で一律に管理する。 */
function draftRush(){
  const d=D(),w=draftLead();
  if(!w)return [];
  if(d.kind==='REMOVABLE'&&LAB_TERMS.rushExcludeKind==='REMOVABLE')return [];
  if(d.items.some(it=>!varOf(it).rush))return [];
  /* 🧑‍🔧 v0.8 ★ご来院日から逆算した「必要な日」を渡す。
     間に合わない段階を選ばせないため（監査 B-2） */
  const dv=deliverFor(w.lt.earliest,d.pat.visit);
  return rushOptions(varOf(w.it),w.lt.earliest,w.it.units,w.it.tryIn,d.cov,
                     dv.mode==='TOO_SOON'?dv.want:null);
}
const chosenRush=()=>{const d=D();return d.rush!=null?draftRush().find(r=>r.days===d.rush):null};

function draftPrice(){
  const d=D(),chosen=chosenRush();
  let base=0,optSum=0;const optLines=[],lines=[];
  if(d.kind==='REMOVABLE'){
    const dn=dentOf();
    if(dn){
      const mult=d.dvals.arch==='上下顎'?2:1;
      base=dn.price*mult;
      lines.push({name:dn.name+(mult>1?' × 上下顎':''),amount:base});
    }
  }else{
    for(const it of d.items){
      const v=varOf(it),amt=v.price*it.units;
      base+=amt;
      lines.push({name:`${v.type}（${v.mat}）× ${it.units}`,amount:amt});
      if(it.tryIn){const m=OPTIONS.find(x=>x.code==='tryin');
        optSum+=m.amount;optLines.push({name:`試適（${v.type}）`,amount:m.amount});}
      if(it.vals.warranty==='希望する'){const m=OPTIONS.find(x=>x.code==='warranty');
        optSum+=m.amount;optLines.push({name:`保証書発行（${v.type}）`,amount:m.amount});}
    }
  }
  const sub=base+optSum;
  const rush=chosen?Math.round(sub*(chosen.mult-1)):0;
  const ex=sub+rush,tax=Math.round(ex*0.1);
  return {base,lines,optLines,optSum,sub,rush,ex,tax,total:ex+tax};
}

/* ---------- 義歯：ステージの日程 ----------
   固定物と違い、医院と技工所を何度も往復する。往復のたびに来院日が挟まる。
   基本設計 4-2 の case_stages に対応する。 */
function dentSchedule(){
  const d=D(),dn=dentOf(); if(!dn)return [];
  const out=[];let from=new Date(TODAY);
  dn.stages.forEach((s,i)=>{
    /* ★ステージの日数はメタルの有無で決まる（1週 / 2週）。ご回答 自由記入1 */
    const days=dentStageDays(s);
    let deliver;
    if(i===0){
      /* 1回目だけは資材の到着を待つ。基準日数は診療区分ではなくメタルで決める */
      const fake={type:s.name,adj:days-LAB_TERMS.leadBase.INSURANCE,tryIn:0,rush:false,price:0};
      deliver=calcLeadTime(fake,1,false,d.method,'INSURANCE').earliest;
    }else{
      deliver=nextClinicOpen(addDays(nextLabOpen(addDays(from,1)),days+1));
    }
    const visit=nextClinicOpen(deliver);
    out.push({no:i+1,code:s.code,name:s.name,days,metal:!!s.metal,ret:s.ret,deliver,visit});
    from=visit;
  });
  return out;
}

function matsFor(){
  const d=D();
  if(d.kind==='REMOVABLE')return MATS.DENTURE;

/* ---------- 未入力チェック ---------- */
function missing(){
  const d=D(),m=[];
  if(!d.pat.chart)m.push('カルテ番号');
  if(!d.pat.patient)m.push('患者氏名');
  if(!d.pat.visit)m.push('次回ご来院日');
  if(d.kind==='REMOVABLE'){
    if(!d.dteeth.length)m.push('欠損部位');
    if(!d.dvals.arch)m.push('対象（上顎／下顎）');
  }else{
    if(!d.items.length)m.push('技工物');
    d.items.forEach((it,n)=>{
      const v=varOf(it),tag=d.items.length>1?`明細${n+1}の`:'';
      if(!it.teeth.length)m.push(tag+'部位');
      if(d.cov==='PRIVATE'&&!it.vals.shade)m.push(tag+'シェード');
      if(d.cov==='PRIVATE'&&!it.photos)m.push(tag+'シェードテイキング写真');
    });
  }
  return [...new Set(m)];
}
const canNext=()=>missing().length===0;

/* 同じ歯が複数の明細に入っている場合。支台歯とポンティックの関係で正当に重複することが
   あるため、送信はブロックせず警告だけ出す（設計メモ 3-1）。 */
function dupTeeth(){
  const d=D(),seen={},dup=[];
  d.items.forEach(it=>it.teeth.forEach(n=>{
    if(seen[n])dup.push(n);else seen[n]=1;
  }));
  return [...new Set(dup)];
}

  const d=D();d.items=d.items.filter(i=>i.iid!==iid);

      ${(()=>{const cand=relatedCandidates();

          ${cand.map(c=>`<label class="ck ${d.related.includes(c.id)?'on':''}"

            <div><div class="t">${esc(c.type)}（${esc(c.mat||'—')}）${teethLabel(c.teeth)}</div>
              <div class="note"><code>${esc(c.no)}</code> ・ ${esc(labById(c.tenant).name)}
                ・ ${esc(STATUS[c.status].l)}</div></div></label>`).join('')}
          ${d.related.length?`<div class="alert info mt" style="font-size:12.5px">
            ★ 紐付けたご依頼のことは<b>特記事項にも書き添えて</b>ください。
            「${esc(findCase(d.related[0]).type)}と同時装着」のように書いていただくと確実です。</div>`:''}
        </div></div>`})()}

      ${d.items.length>1?`<div class="itabs mb">${d.items.map((x,n)=>{
        const xv=varOf(x),bad=!x.teeth.length||(d.cov==='PRIVATE'&&(!x.vals.shade||!x.photos));

      <div class="card mb"><div class="hdr">
        <h3>${d.items.length>1?`明細 ${d.items.findIndex(x=>x.iid===it.iid)+1}：`:''}${esc(v.type)}</h3>
        <span class="sp"></span><span class="note">${esc(v.mat)}</span></div>
        <div class="bd">
          <div class="row mb"><b style="font-size:13px">部位 <span class="req">必須</span></b>
            <span class="sp"></span>
            <span class="note">選択中 ${it.teeth.length?teethLabel(it.teeth):'なし'}（${it.units}本）</span></div>
          ${toothChart(it.teeth,others)}

          ${dups.length?`<div class="alert warn mt" style="font-size:12.5px">

      </div></div>

      <div class="card mb"><div class="hdr"><h3>技工指示</h3><span class="sp"></span>${covB(d.cov)}
        <span class="note">${esc(v.type)}</span></div>

          <label class="f"><span class="lb">シェード ${d.cov==='PRIVATE'?'<span class="req">必須</span>':''}</span>
            <div class="chips">${['A1','A2','A3','A3.5','A4','B1','B2','C1','BL2','BL3'].map(s=>

      <div class="card"><div class="hdr"><h3>資材の送付方法</h3>
        <span class="sp"></span><span class="note">この依頼に共通</span></div><div class="bd">

          <button class="chip ${d.method==='PHYSICAL'?'on':''}" onclick="setMethod('PHYSICAL')">物理搬送（印象・模型）</button>

      </div></div>
    </div>

    <div class="quote">
      <div class="qbox mb">
        <div class="qh">発注先</div>
        <div class="qb">
          <div class="row" style="gap:8px">

              <div style="font-weight:700;font-size:14px">${esc(labById(d.lab).name)}</div>

            </div>
            <button class="btn sm" onclick="openLabPick()">変更</button>
          </div>
          ${d.items.length>1?`<p class="note mt">

      </div>

      <div class="qbox mb">
        <div class="qh">お届け予定</div>
        <div class="qb">
          <div class="due">
            <div class="dl">${chosen?'特急対応'
              :dv.mode==='VISIT'?'ご来院日に合わせたお届け'
              :dv.mode==='TOO_SOON'?'最短でのお届け'
              :'最短でのお届け'}</div>
            <div class="dv" style="${chosen?'color:var(--accent)':(dv.mode==='TOO_SOON'?'color:var(--danger)':'')}">${fmtDue(dueDate)}</div>
            <div class="dd">${d.items.length}件すべて揃ってのお届け</div>
          </div>
          ${!chosen&&dv.mode==='VISIT'?`<div class="alert ok" style="font-size:12.5px">
            ご来院日（${fmtJ(dv.visit)}）の ${LAB_TERMS.beforeVisit}日前にお届けします。<br>
            最短では ${fmtDue(w.lt.earliest)} ですが、<b>前もって作りすぎないよう</b>ご来院日に合わせています。</div>`:''}
          ${!chosen&&dv.mode==='TOO_SOON'?`<div class="alert dgr" style="font-size:12.5px">
            <b>ご来院日（${fmtJ(dv.visit)}）には ${dv.short}日 間に合いません。</b><br>
            通常の最短は <b>${fmtDue(w.lt.earliest)}</b> です。
            ${dv.short<=LAB_TERMS.rushMaxDays
              ?'特急料金でのご対応なら間に合います。下の「特急料金で対応」をご覧ください。'
              :`特急でも最大 ${LAB_TERMS.rushMaxDays}日 の短縮までです。ご来院日のご調整をお願いします。`}</div>`:''}
          ${!chosen&&dv.mode==='EARLIEST'?`<div class="alert info" style="font-size:12.5px">
            次回ご来院日をご入力いただくと、<b>その前日にお届けする日程</b>でお見積りします。</div>`:''}
          ${d.items.length>1?`<div class="lead">
            ${d.items.map((x,n)=>{const xl=itemLead(x),xv=varOf(x);
              const late=x.iid===w.it.iid;
              return `<div class="li ${late?'late':''}">
                <span>${n+1}. ${esc(xv.type)}</span>
                <span>${fmtDue(xl.earliest)}${late?' ← 最も遅い':''}</span></div>`}).join('')}
            <div class="note" style="margin-top:6px">
              ★ 一部だけ先にお届けすることはしていません。最も時間のかかるものに揃えます。</div>
          </div>`:''}
          <div class="brk">
            <div class="bi"><span>受付</span><span>${fmtJ(w.lt.breakdown.d0)}</span></div>
            <div class="bi"><span>資材お預かり</span><span>${fmtJ(w.lt.breakdown.d1)}</span></div>
            <div class="bi"><span>製作</span><span>${w.lt.breakdown.w}日</span></div>
            <div class="bi"><span>発送</span><span>${fmtJ(w.lt.breakdown.d2)}</span></div>
            <div class="bi"><span>お届け</span><span>${fmtJ(w.lt.breakdown.d4)}</span></div>
            ${w.lt.breakdown.notes.map(n=>`<div style="color:var(--faint)">※ ${esc(n)}</div>`).join('')}
          </div>
          ${mins>0?`<div class="cd">本日 ${CUTOFF} までのお申し込みで本日受付になります<br>
            残り <b>${Math.floor(mins/60)}時間${mins%60}分</b></div>`:
            `<div class="cd">本日の受付は終了しました。お申し込みは翌営業日の受付になります。</div>`}

          ${/* 🧑‍🔧 v0.8 ★特急を出すのは「ご来院日に間に合っていない」ときだけ。
                以前は dv.mode を見ずに出していたため、
                「前もって作りすぎないようご来院日に合わせています」と説明した真下で、
                その1ヶ月前の日付を＋150%で売る画面になっていた（監査 B-2）。
                間に合っているものを前倒しする理由は医院側に無い。原則38 に反する。 */''}
          ${chosen?`<div class="mt">
            <button class="btn sm block" onclick="setRush(null)">通常納期に戻す</button></div>`
          :dv.mode==='VISIT'?`<div class="note mt">
            ご来院日に間に合っているため、特急のお申し込みは必要ありません。</div>`
          :ro.length?`
          <div class="mt">
            <div class="row" style="margin-bottom:8px"><b style="font-size:13px">もっと早くご希望の場合</b></div>
            <button class="btn wrn block" onclick="openRush()">特急料金で対応</button>
          </div>`:`<div class="note mt">
            ${d.kind==='REMOVABLE'
              ?'義歯は特急の対象外です。ご来院のたびに医院を経由するため、技工所側では日数を縮められません。'
              :d.items.some(x=>!varOf(x).rush)
              ?'特急対応を承れない材料が含まれているため、このお申し込みでは特急を承れません。'
              :'この材料は特急対応を承れません'}</div>`}
        </div>
      </div>

      <div class="qbox">
        <div class="qh">お見積り（概算）</div>
        <div class="qb">
          ${price.lines.map(l=>`<div class="pricerow"><span>${esc(l.name)}</span><span>${yen(l.amount)}</span></div>`).join('')}
          ${price.optLines.map(o=>`<div class="pricerow"><span>${esc(o.name)}</span><span>${yen(o.amount)}</span></div>`).join('')}
          ${price.rush?`<div class="pricerow rush"><span>特急割増（×${chosen.mult}）</span><span>${yen(price.rush)}</span></div>`:''}
          <div class="pricerow"><span>消費税</span><span>${yen(price.tax)}</span></div>
          <div class="pricerow tot"><span>合計</span><span>${yen(price.total)}</span></div>
          <p class="note mt">技工所の確認により変動する場合があります</p>
        </div>
      </div>
    </div>
  </div>

  <div class="row mt" style="justify-content:space-between">
    <button class="btn" onclick="D().stage=1;render()">戻る</button>
    <div class="row">
      <button class="btn" onclick="saveDraft()">下書き保存</button>
      <button class="btn pri lg" ${canNext()?'':'disabled'} onclick="D().stage=3;render()">内容を確認</button>
    </div>
  </div>
  ${!canNext()?`<p class="note mt" style="text-align:right">未入力：${missing().join('、')}</p>`:''}`;
}

      ← 通常の技工依頼に戻る</button></div>`;

function pickDent(id){D().dent=id;render()}
function setDV(k,v){D().dvals[k]=v;render()}

/* ---------- 共通の入力ハンドラ ---------- */
function setP(k,v){D().pat[k]=v;render()}
function setV(k,v){const it=CUR();if(it){it.vals[k]=v;render()}}
function setTryIn(b){const it=CUR();if(it){it.tryIn=b;D().rush=null;render()}}
function setMethod(m){D().method=m;D().rush=null;render()}
function setRush(n){D().rush=n;S.modal=null;render()}
function addPhoto(){const it=CUR();if(it){it.photos++;render()}}
function toggleMat(k){D().mats[k]=!D().mats[k];render()}
/* 義歯は欠損部位、固定物は明細ごとの部位。同じチャートを使い回す */
function toggleTooth(n,scope){
  const d=D();
  if(scope==='dent'){
    const a=d.dteeth,i=a.indexOf(n);i<0?a.push(n):a.splice(i,1);render();return;
  }
  const it=CUR();if(!it)return;
  const i=it.teeth.indexOf(n);
  i<0?it.teeth.push(n):it.teeth.splice(i,1);
  it.units=Math.max(1,it.teeth.length);
  d.rush=null;render();
}
/* 明細が複数あるとき、詳細の指定を同じ内容で入れたいことが多い。
   毎回入力させるのは「アバウトな指示でよい」という前提に反する。 */
function copySpecs(){
  const d=D(),src=CUR();if(!src)return;
  const keys=TECH_FIELDS[d.cov].map(f=>f.c);
  d.items.forEach(it=>{if(it.iid!==src.iid)keys.forEach(k=>{it.vals[k]=src.vals[k]})});
  toast(`詳細の指定をほかの ${d.items.length-1}件 にも反映しました`);
}

function openLabPick(){
  const d=D(),cands=activeLabs().filter(l=>l.handles.includes(d.cov));
  const t=d.kind==='REMOVABLE'?'局部床義歯':(d.items[0]?d.items[0].type:null);
  const auto=routeLab(d.cov,t);
  S.modal={title:'発注先の変更',body:`
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:14px">
      ${esc(covLabel(d.cov))}${t?` ・ ${esc(t)}`:''} を扱える取引先です。</p>
    ${cands.map(l=>`<div class="rushopt ${d.lab===l.id?'on':''}" onclick="setLab('${l.id}')">
      <div><div class="rd">${esc(l.name)}</div>

/* 🧑‍🔧 v0.8 特急（ご回答 #9・#10・#86）

   ★段階を 20 / 50 / 100 / 150% にした。上限は4日短縮。
   ★<b>定価との差額を必ず出す</b>。合計だけを出すと「いくら上がったのか」が分からず、
     電話での問い合わせに戻ってしまう。 */
function openRush(){
  const d=D(),w=draftLead(),ro=draftRush();
  const norm=(()=>{const s=D().rush;D().rush=null;const x=draftPrice().total;D().rush=s;return x})();
  const dv=deliverFor(w.lt.earliest,d.pat.visit);
  S.modal={title:'特急料金で対応',body:`
    ${dv.mode==='VISIT'?`<div class="alert ok mb" style="font-size:12.5px">
      ご来院日（${fmtJ(dv.visit)}）には<b>通常の日程で間に合います。</b>特急のお申し込みは必要ありません。<br>
      それより前にお受け取りになりたい場合のみ、下からお選びください。</div>`:''}
    ${dv.mode==='TOO_SOON'?`<div class="alert dgr mb" style="font-size:12.5px">
      ご来院日（${fmtJ(dv.visit)}）に間に合わせるには <b>${dv.short}日</b> 縮める必要があります。
      ${dv.short<=LAB_TERMS.rushMaxDays
        ?`下の <b>${dv.short}日短縮</b> 以上をお選びください。`
        :`特急でも最大 ${LAB_TERMS.rushMaxDays}日 までです。ご来院日のご調整をお願いします。`}</div>`:''}
    <p style="font-size:13.5px;color:var(--muted);margin-bottom:14px">
      通常の最短お届けは <b style="color:var(--text)">${fmtDue(w.lt.earliest)}</b>（${yen(norm)}）です。
      割増料金にて、下記の日程で承れます。最大 <b>${LAB_TERMS.rushMaxDays}日</b> まで繰り上げられます。
      ${d.items.length>1?'<br>技工物 '+d.items.length+'件すべてを繰り上げます。':''}</p>
    ${ro.length?ro.map(r=>{
      const save=D().rush;D().rush=r.days;const p=draftPrice();D().rush=save;
      return `<div class="rushopt ${r.ok?'':'dis'}" ${r.ok?`onclick="setRush(${r.days})"`:''}>
        <div><div class="rd">${fmtDue(r.date)}</div>
          <div class="note">${esc(r.label)} ・ 割増 <b>＋${r.pct}%</b>${r.ok?'':' ・ '+esc(r.why||'')+'承れません'}</div></div>
        <div class="rp"><b>${yen(p.total)}</b>
          ${LAB_TERMS.rushShowDiff?`<div class="note" style="color:var(--accent)">
            通常より ＋${yen(p.total-norm)}</div>`:''}</div>
      </div>`}).join('')
    :`<div class="alert warn" style="font-size:12.5px">
      ${d.kind==='REMOVABLE'
        ?'義歯は特急の対象外です。ご来院のたびに医院を経由するため、技工所側では日数を縮められません。'
        :'この内容には特急をご用意していません。'}</div>`}
    <p class="note mt">特急のお申し込みは、技工所の受諾をもって確定します。
      割増率は取引先ごとの設定です（現在：${RUSH_TIERS.filter(t=>t.days<=LAB_TERMS.rushMaxDays)
        .map(t=>`${t.days}日＝＋${t.pct}%`).join(' ／ ')}）。</p>`,ok:null};
  render();
}

function toothChart(sel,others,scope){
  const q=(f,t,r)=>{let a=[];for(let i=f;i<=t;i++)a.push(i);if(r)a.reverse();return a};
  const oth=others||[];
  const t=n=>`<button class="tooth ${sel.includes(n)?'on':(oth.includes(n)?'other':'')}"
    onclick="toggleTooth(${n}${scope?`,'${scope}'`:''})">${n%10}</button>`;
  return `<div class="tc">
    <div class="lbl">上顎</div>
    <div class="mid"><div><div class="q">${q(11,18,true).map(t).join('')}</div><div class="lbl">右上</div></div>
      <div><div class="q">${q(21,28).map(t).join('')}</div><div class="lbl">左上</div></div></div>
    <div style="height:8px"></div>
    <div class="mid"><div><div class="q">${q(41,48,true).map(t).join('')}</div><div class="lbl">右下</div></div>
      <div><div class="q">${q(31,38).map(t).join('')}</div><div class="lbl">左下</div></div></div>
    <div class="lbl">下顎</div></div>`;
}

function submitCase(){
  /* ★ S.draft を null にした後に chosenRush() を呼ぶと落ちる。先に取り出しておく */
  const d=D(),price=draftPrice(),rush=chosenRush();
  const id='c'+(CASES.length+1);
  const no=labById(d.lab).pre+'-2026-000'+(150+CASES.length);
  let due,items,head;
  if(d.kind==='REMOVABLE'){
    const dn=dentOf(),sch=dentSchedule();
    due=fmt(sch[sch.length-1].deliver);
    items=[{no:1,type:dn.name,mat:d.dvals.arch||'—',teeth:d.dteeth,units:d.dteeth.length,
      shade:d.dvals.toothShade||'—',amount:price.base}];
    head=dn.name;
    var stages=sch.map(s=>({no:s.no,name:s.name,deliver:fmt(s.deliver),ret:s.ret,
      status:s.no===1?'IN_LAB':'PENDING'}));
  }else{
    const w=draftLead();
    const dv=deliverFor(w.lt.earliest,d.pat.visit);
    due=fmt(rush?rush.date:dv.date);
    items=d.items.map((it,n)=>{const v=varOf(it);
      return {no:n+1,type:v.type,mat:v.mat,teeth:it.teeth,units:it.units,
        shade:it.vals.shade||'—',tryIn:it.tryIn,amount:v.price*it.units};});
    head=d.items.length>1?`${varOf(d.items[0]).type} ほか${d.items.length-1}件`:varOf(d.items[0]).type;
  }
  CASES.unshift({id,no,tenant:d.lab,kind:d.kind,
    patient:d.pat.patient,chart:d.pat.chart,pno:d.pat.pno||null,cov:d.cov,
    type:head,mat:items[0].mat,teeth:items.flatMap(i=>i.teeth),
    shade:items[0].shade,due,items,stages:d.kind==='REMOVABLE'?stages:null,
    status:'SUBMITTED',step:0,creator:S.user,amount:price.total,
    isRush:!!rush,
    /* 🧑‍🔧 v0.8 患者コード・変更の事前申告・関連するご依頼 */
    changeNotice:!!d.changeNotice,
    related:(d.related||[]).slice(),
    timeline:[{t:'たった今',who:U().name,
      tx:d.kind==='REMOVABLE'?`義歯の依頼を送信しました（お預かり ${stages.length}回）`
        :`依頼を送信しました（技工物 ${items.length}件）`,k:'hi'}]});
  /* ★関連は双方向に張る。片方からしか見えないと、もう一方の画面で気付けない */
  (d.related||[]).forEach(rid=>{const r=findCase(rid);
    if(r){r.related=(r.related||[]);
      if(!r.related.includes(id))r.related.push(id);
      r.timeline.push({t:'たった今',who:U().name,tx:`関連するご依頼（${no}）を紐付けました`,k:''})}});
  S.draft=null;
  toast(rush?'特急でのご依頼を送信しました':'依頼を送信しました');
  go('case',id);
}

   > 「責任の所在を先生が考える責任の所在っていうところをチェック入れるところを
   >   作ってくれるとありがたいです。そこを必須項目にしてチェックを入れないと送れない
   >   という形にしたい」

   ★変えた点3つ
     1. 前回の指示書を<b>自動で添付する。外せない</b>
     2. <b>責任の所在の申告を必須</b>にする。選ばないと送信できない
     3. 「修正」と「再製作」を<b>別のものとして扱う</b>
        （「修正と再生の線引きをしっかりしないといけない」ご回答 #59）

   ★これで未決 #55（再製作の利用料が二重に立つ）が解ける。
     医院が「技工所起因」と申告した案件は、運営への利用料を立てない。
   ★残る論点：責任の所在が両者で食い違った場合（新規未決 #68）。
   ============================================================ */
function openTrouble(id){
  const c=findCase(id);
  if(!S.tb||S.tb.id!==id)S.tb={id,kind:'適合が悪い',want:'REMAKE',fault:null,photo:0};
  const t=S.tb;
  S.modal={title:'不具合のご報告',wide:true,body:`
    <p class="note mb">${esc(c.no)} ・ ${esc(c.patient)}様
      ${c.pno?`・ 患者コード ${esc(c.pno)}`:''} ・ ${esc(c.type)}（${esc(c.mat||'—')}）</p>

    ${t.fault?`<div class="alert ok mb" style="font-size:12.5px">
      責任の所在をご申告いただきました（<b>${esc((FAULT_OPTIONS.find(f=>f.k===t.fault)||{}).l)}</b>）。
      <a href="#" onclick="document.getElementById('faultBox').scrollIntoView({block:'center'});return false"
        style="margin-left:6px">変更する</a></div>`
    :`<div class="alert dgr mb" style="font-size:12.5px">
      ★ このご報告には<b>責任の所在のご申告が必要です</b>（下の方にあります）。
      どちらの責任であっても、原因を把握しておくために必要な項目です。
      <a href="#" onclick="document.getElementById('faultBox').scrollIntoView({block:'center'});return false"
        style="margin-left:6px">その項目へ</a></div>`}

    <label class="f"><span class="lb">どのような不具合でしょうか <span class="req">必須</span></span>
      <div class="chips">${['適合が悪い','高い（咬合）','コンタクトが強い/弱い','色が合わない','形態','破折','その他'].map(k=>
        `<button class="chip ${t.kind===k?'on':''}" onclick="S.tb.kind='${k}';openTrouble('${id}')">${k}</button>`).join('')}
      </div></label>

    <label class="f"><span class="lb">ご希望 <span class="req">必須</span></span>
      <div class="chips">
        <button class="chip ${t.want==='REMAKE'?'on':''}" onclick="S.tb.want='REMAKE';openTrouble('${id}')">
          再製作（作り直し）</button>
        <button class="chip ${t.want==='FIX'?'on':''}" onclick="S.tb.want='FIX';openTrouble('${id}')">
          修正（お預かりして調整）</button>
        <button class="chip ${t.want==='ASK'?'on':''}" onclick="S.tb.want='ASK';openTrouble('${id}')">
          まず相談したい</button>
      </div></label>
    <div class="alert info" style="font-size:12.5px">
      ★ <b>「修正」と「再製作」は別のものとして扱います。</b>
      修正は現物をお預かりして調整するもの、再製作は新しくお作りするものです。
      ${t.want==='REMAKE'?'再製作では<b>新しいご依頼が作られます</b>。'
        :t.want==='FIX'?'修正では<b>同じご依頼のまま</b>お預かりの記録が付きます。'
        :'ご相談では案件は作られません。技工所とのやり取りだけが記録されます。'}</div>

    <label class="f"><span class="lb">詳しい状況 <span class="req">必須</span></span>
      <textarea id="tbText" placeholder="装着時に近心のコンタクトが強く、隣接歯に接触しています">${esc(t.text||'')}</textarea></label>

    <label class="f"><span class="lb">お写真<span class="hint">あると原因の特定が早くなります</span></span>
      <div class="row"><button class="btn sm" onclick="addTroublePhoto('${id}')">写真を追加</button>
        <span class="note">${t.photo?`${t.photo}枚を添付しました`:'未添付'}</span></div></label>

    <div class="card mb" style="border-color:#b8dcd7"><div class="hdr" style="background:var(--primary-soft)">
      <h3 style="color:#0b544e">前回の技工指示書</h3><span class="b prog">自動で添付されます</span></div>
      <div class="bd">
        <dl class="kv sm">
          <dt>ケース番号</dt><dd><code>${esc(c.no)}</code></dd>
          <dt>技工物</dt><dd>${esc(c.type)} ／ ${esc(c.mat||'—')}</dd>
          <dt>部位</dt><dd>${teethLabel(c.teeth)}</dd>
          <dt>シェード</dt><dd>${esc(c.shade||'—')}</dd>
          <dt>納品</dt><dd>${fmtDueStr(c.due)}</dd>
        </dl>
        <div class="row"><button class="btn sm" onclick="printOrder('${id}')">指示書を確認する</button>
          <span class="note">★ この添付は外せません。原因を追うために必要です</span></div>
      </div></div>

    <div class="card mb" id="faultBox" style="border-color:${t.fault?'var(--border)':'var(--danger)'}">
      <div class="hdr"><h3>責任の所在についてのご申告</h3>
        <span class="req">必須</span>
        ${t.fault?'<span class="sp"></span><span class="b done">選択済み</span>':''}</div>
      <div class="bd">
        <p class="note mb">現時点で<b>先生がお考えになる</b>原因をお選びください。
          確定ではありません。技工所側でも原因区分を登録し、双方の記録として残ります。</p>
        ${FAULT_OPTIONS.map(f=>`<label class="ck ${t.fault===f.k?'on':''}"
          onclick="S.tb.fault='${f.k}';openTrouble('${id}')">
          <input type="radio" ${t.fault===f.k?'checked':''}>
          <div><div class="t">${esc(f.l)}</div><div class="note">${esc(f.note)}</div></div></label>`).join('')}
        ${t.fault?'':`<div class="alert dgr mt" style="font-size:12.5px">
          ★ <b>ここをお選びいただかないと送信できません。</b>
          どちらの責任であっても、原因を把握しておくために必要な項目です。</div>`}
        ${t.fault==='LAB'?`<div class="alert info mt" style="font-size:12.5px">
          技工所起因としてご申告いただいた場合、再製作の費用は原則として技工所の負担になります。
          ${LAB_TERMS.rushExcludeKind!=='ALL'?'特急でのお作り直しをご希望の場合、割増も技工所が負担します。':''}</div>`:''}
        ${t.fault==='CLINIC'?`<div class="alert warn mt" style="font-size:12.5px">
          当院起因としてご申告いただいた場合、再製作は通常の技工料でのご請求になります。</div>`:''}
      </div></div>

    <div class="alert warn" style="font-size:12.5px">
      ご報告いただくと${t.want==='REMAKE'?'<b>再製作のご依頼が作られ</b>':'技工所に通知され'}、
      前回の指示書とご申告の内容が技工所に届きます。
      費用のご負担については、原因の確認後に取引条件に沿ってご相談となります。</div>`,
    ok:'報告する',danger:true,fn:()=>{
      const el=document.getElementById('tbText');
      const txt=(el&&el.value||'').trim();
      if(el)S.tb.text=txt;
      if(!txt){toast('状況をご入力ください');render();return}
      if(!S.tb.fault){
        toast('責任の所在をお選びください（必須です）');
        openTrouble(id);
        /* ★下にある必須項目まで自動で送る。押しても何も起きないように見えるのを防ぐ */
        const box=document.getElementById('faultBox');
        if(box)box.scrollIntoView({block:'center',behavior:'smooth'});
        return;
      }
      const f=FAULT_OPTIONS.find(x=>x.k===S.tb.fault);
      const wantL={REMAKE:'再製作',FIX:'修正',ASK:'ご相談'}[S.tb.want];
      c.timeline.push({t:'たった今',who:U().name,
        tx:`不具合を報告しました（${S.tb.kind}／ご希望：${wantL}／責任の所在：${f.l}）`,k:'wn'});
      if(S.tb.want==='REMAKE'){
        /* ★再製作は新しい依頼として作る。前回の指示書と申告を引き継ぐ */
        const n={id:'c'+(CASES.length+1),no:c.no+'-R1',tenant:c.tenant,
          patient:c.patient,chart:c.chart,pno:c.pno,cov:c.cov,type:c.type,mat:c.mat,
          teeth:c.teeth.slice(),shade:c.shade,due:c.due,
          status:'SUBMITTED',step:0,creator:S.user,amount:0,
          remakeOf:c.id,fault:S.tb.fault,remakeKind:S.tb.kind,
          timeline:[{t:'たった今',who:U().name,
            tx:`再製作のご依頼（元：${c.no}／責任の所在：${f.l}）`,k:'wn'}]};
        CASES.unshift(n);
        c.status='REMAKE';
        c.related=(c.related||[]).concat([n.id]);
        S.tb=null;closeModal();
        toast('再製作のご依頼を作成しました。前回の指示書を添付済みです');
        go('case',n.id);return;
      }
      c.status=S.tb.want==='FIX'?'REMAKE':c.status;
      S.tb=null;closeModal();
      toast('報告しました。技工所より折り返しご連絡いたします');go('case',id);
    }};
  render();
}

      <div class="chips" id="scNotice">

          .forEach(x=>x.classList.remove('on'));this.classList.add('on')">変更の可能性あり</button>
        <button class="chip ${c.changeNotice?'':'on'}" onclick="[...document.querySelectorAll('#scNotice .chip')]
          .forEach(x=>x.classList.remove('on'));this.classList.add('on')">これで確定</button>
      </div></label>`,
    ok:'変更を依頼する',fn:()=>{

      <div style="flex:1"><b>${esc(l.name)}</b><div class="note"><code>${esc(l.code)}</code></div></div>

/* ★技工所コードの完全一致でのみ申請できる。部分一致は許さない（BR-32 の精神）。
   一覧を列挙できてしまうと、どこがどの技工所と取引しているかが推測できるため。 */
function openLabRequest(){
  S.modal={title:'技工所に取引を申請する',body:`
    <p class="note mb">技工所から教えていただいた<b>技工所コード</b>をご入力ください。
      コードは<b>完全一致</b>でのみ検索できます（一覧から選ぶことはできません）。</p>
    <label class="f"><span class="lb">技工所コード <span class="req">必須</span></span>
      <input type="text" id="lrCode" placeholder="LAB-0001" autocomplete="off"></label>
    <label class="f" style="margin-bottom:0"><span class="lb">ひとことメッセージ
      <span class="hint">技工所側の画面に表示されます</span></span>
      <input type="text" id="lrMemo" placeholder="自費のジルコニアをお願いしたく、ご連絡いたしました"></label>
    <div class="alert info mt" style="font-size:12.5px">
      申請すると、技工所側に貴院の<b>医院名と医院コードだけ</b>が通知されます。
      承認されるまで、案件・患者様の情報は一切お見せしていません（BR-34）。<br>
      ★ どちらから申請しても、成立には<b>双方の同意</b>が必要です。</div>`,
    ok:'申請する',fn:()=>{
      const code=((document.getElementById('lrCode')||{}).value||'').trim();
      if(!code){toast('技工所コードをご入力ください');return}
      const hit=LABS.find(l=>l.code===code);
      if(!hit){toast('その技工所コードは見つかりませんでした。コードをご確認ください');return}
      if(hit.status==='ACTIVE'){toast(`${hit.name} とはすでに取引中です`);return}
      if(hit.status==='REQUESTED'){toast(`${hit.name} には申請中です`);return}
      if(hit.status==='PENDING'){
        toast(`${hit.name} からすでに申請が届いています。下の「承認する」をお使いください`);
        closeModal();render();return;
      }
      hit.status='REQUESTED';hit.since='2026-08-11';
      closeModal();toast(`${hit.name} に取引を申請しました。技工所の承認をお待ちください`);render();
    }};
  render();
}
function cancelLabRequest(id){
  const l=labById(id);
  S.modal={title:'申請を取り下げる',body:`<p><b>${esc(l.name)}</b> への取引の申請を取り下げます。</p>
    <p class="note">あらためて申請することもできます。</p>`,
    ok:'取り下げる',danger:true,fn:()=>{
      l.status='INACTIVE';l.since=null;closeModal();
      toast('申請を取り下げました');render()}};
  render();
}
function approveLink(id){const l=labById(id);l.status='ACTIVE';l.since='2026-08-11';

  toast(`${l.name} との取引を開始しました`);render()}
function rejectLink(id){const l=labById(id);

function setFallback(id){ROUTING.fallback=id;toast(`既定の発注先を ${labById(id).name} にしました`);render()}

function delRule(i){ROUTING.rules.splice(i,1);toast('ルールを削除しました');render()}
function openAddRule(){
  const types=[...new Set(VARIANTS.map(v=>v.type))];

    ok:'追加する',fn:()=>{

function openLabStop(id){const l=labById(id);
  S.modal={title:'取引を停止',body:`
    <div class="alert warn mb"><b>${esc(l.name)} への新規発注を停止します</b><br>
      進行中の案件はそのまま継続します。停止後も履歴と請求は参照できます。</div>
    ${ROUTING.fallback===id?'<div class="alert dgr">この技工所は既定の発注先です。停止すると別の技工所を既定に設定する必要があります。</div>':''}`,
    ok:'停止する',fn:()=>{l.status='INACTIVE';
      if(ROUTING.fallback===id){const n=activeLabs()[0];if(n)ROUTING.fallback=n.id}
      ROUTING.rules=ROUTING.rules.filter(r=>r.lab!==id);
      S.modal=null;toast('取引を停止しました');render()}};
  render()}
function resumeLab(id){const l=labById(id);l.status='ACTIVE';toast('取引を再開しました');render()}

/* ============================================================
   下書き
   ============================================================ */
let DRAFTS=[];
function saveDraft(){
  const d=D();
  /* 🖥 v0.6：明細が複数になったので、下書きの見出しも件数で表す */
  let label='（技工物未選択）';
  if(d.kind==='REMOVABLE'){
    const dn=dentOf();
    if(dn)label=`${dn.name}（義歯・お預かり${dn.stages.length}回）`;
  }else if(d.items.length){
    const v=varOf(d.items[0]);
    label=d.items.length>1?`${v.type} ほか${d.items.length-1}件`:`${v.type} ／ ${v.mat}`;
  }
  DRAFTS.unshift({id:'dr'+Date.now(),at:'2026-08-15 10:40',by:U().name,
    patient:d.pat.patient||'（患者名未入力）',label,
    cov:d.cov,data:JSON.parse(JSON.stringify(d))});
  toast('下書きを保存しました。［依頼一覧 › 下書き］から再開できます');
  render();
}
function vDrafts(){
  return `
  <div class="row mb">${backBtn()}<button class="btn sm" onclick="go('cases')">依頼一覧</button></div>
  <h1>下書き</h1>
  <p class="sub">送信前の依頼です。${DRAFTS.length}件</p>
  ${DRAFTS.length?`<div class="card"><div class="tw"><table>
    <thead><tr><th>患者</th><th>内容</th><th>区分</th><th>保存日時</th><th>作成者</th><th></th></tr></thead>
    <tbody>${DRAFTS.map(d=>`<tr>
      <td><b>${esc(d.patient)}</b></td><td>${esc(d.label)}</td>
      <td>${d.cov?covB(d.cov):'—'}</td>
      <td class="note">${esc(d.at)}</td><td class="note">${esc(d.by)}</td>
      <td><button class="btn sm pri" onclick="resumeDraft('${d.id}')">再開する</button>
        <button class="btn sm dgr" onclick="delDraft('${d.id}')">削除</button></td></tr>`).join('')}</tbody>
  </table></div></div>`
  :`<div class="card"><div class="empty">下書きはありません。
    <div class="note mt">依頼の入力途中で「下書き保存」を押すと、ここに保存されます。</div></div></div>`}`;
}
function resumeDraft(id){
  const d=DRAFTS.find(x=>x.id===id);
  S.draft=JSON.parse(JSON.stringify(d.data));
  DRAFTS=DRAFTS.filter(x=>x.id!==id);
  go('new');toast('下書きを読み込みました');
}
function delDraft(id){
  S.modal={title:'下書きを削除',body:'<p>この下書きを削除します。よろしいですか。</p>',
    ok:'削除する',danger:true,fn:()=>{DRAFTS=DRAFTS.filter(x=>x.id!==id);closeModal();toast('削除しました')}};
  render();
}

/* ★以前は (${m.fn})() と関数を文字列にして呼んでいたため、モーダルを開いた側の
   変数を参照する確定ボタンが動かなかった。S.modal.fn を直接呼びクロージャを保つ。 */
function closeModal(){S.modal=null;render()}
function renderModal(){
  if(!S.modal)return '';
  const m=S.modal;
  return `<div class="mask" onclick="if(event.target===this)closeModal()">
    <div class="modal ${m.wide?'wide':''}"><div class="mh">${esc(m.title)}</div><div class="mb">${m.body}</div>
      <div class="mf">${m.foot||''}
      <button class="btn" onclick="closeModal()">${m.ok?'キャンセル':'閉じる'}</button>
      ${m.ok?`<button class="btn ${m.danger?'wrn':'pri'}" id="okBtn" ${m.okDisabled?'disabled':''}
        onclick="S.modal.fn()">${esc(m.ok)}</button>`:''}</div></div></div>`;
}

const TABS=[['dashboard','ホーム'],['new','新規依頼'],['cases','依頼一覧'],
  ['labs','取引先技工所'],['staff','スタッフ'],['invoices','ご請求'],['settings','設定']];
/* 詳細画面に入ってもどのタブにいたかが分かるように、親タブへ寄せる */
const TAB_PARENT={case:'cases',approve:'cases',issue:'cases',ship:'cases',accept:'cases',drafts:'cases'};

function render(){
  const bEl=document.getElementById('brand');
  if(bEl)bEl.textContent=BRAND.name||CLINIC.name;
  const cEl=document.getElementById('clinicCode');
  if(cEl)cEl.textContent=CLINIC.code;
  document.getElementById('userPill').innerHTML=`${esc(U().name)} <span class="note">${esc(U().role)}</span>`;
  const cur=TAB_PARENT[S.route]||S.route;
  document.getElementById('tabs').innerHTML=TABS.map(([r,l])=>
    `<button class="${cur===r?'on':''}"
      onclick="${r==='new'?'startNew()':`go('${r}')`}">${l}</button>`).join('');
  const V={dashboard:vDashboard,new:vNew,cases:vCases,case:vCase,approve:vApprove,
    issue:vIssue,ship:vShip,accept:vAccept,invoices:vInvoices,labs:vLabs,staff:vStaff,
    settings:vSettings,drafts:vDrafts};
  document.getElementById('app').innerHTML=(V[S.route]||vDashboard)();
  document.getElementById('overlay').innerHTML=renderModal()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
}

const us=document.getElementById('userSel');
us.innerHTML=loginUsers().map(u=>`<option value="${u.id}">${u.name}（${u.role}）</option>`).join('');
us.onchange=e=>{S.user=e.target.value;render()};
applyBrand();
const ts=document.getElementById('tenantSel');
ts.innerHTML=`<option value="ALL">すべての発注先</option>`+
  activeLabs().map(l=>`<option value="${l.id}">${l.name}</option>`).join('');
ts.onchange=e=>{S.labFilter=e.target.value;S.route='dashboard';S.hist=[];render()};
render();
