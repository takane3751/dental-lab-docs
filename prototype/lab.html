function spToggle(vid){
  if(!S.spVars)S.spVars=[];
  const i=S.spVars.indexOf(vid);
  i<0?S.spVars.push(vid):S.spVars.splice(i,1);
  const b=document.querySelector(`#spVars .chip[data-v="${vid}"]`);
  if(b)b.classList.toggle('on',S.spVars.includes(vid));
}
function delSubPattern(id){

  S.modal={title:'細分工程のパターンを削除',body:`
    <p>「<b>${esc(f.name)}</b>」（${f.steps.length}手順）を削除します。</p>
    ${vs.length?`<div class="alert dgr mt" style="font-size:12.5px">
      ${vs.length}件の技工物がこの並びを使っています
      （${vs.map(v=>esc(v.type)).join('、')}）。削除すると仕上げの手順が決まらなくなります。</div>`:''}`,
    ok:'削除する',danger:true,fn:()=>{
      SUB_STEPS=SUB_STEPS.filter(x=>x.id!==id);

      closeModal();toast('削除しました');
    }};
  render();
}
function openSubLink(vid){

    <label class="f"><span class="lb">仕上げの細分</span>
      <select id="slFin">
        <option value="">（未設定）</option>
        ${SUB_STEPS.map(f=>`<option value="${f.id}" ${v.fin===f.id?'selected':''}>

    <label class="f" style="margin-bottom:0"><span class="lb">メタルを扱う

function csvSubSteps(){
  const rows=[];

    pattern:f.name,kind:f.kind||'',pre:f.pre||'',no:i+1,step:s,
    variants:VARIANTS.filter(v=>v.fin===f.id).map(v=>v.type+'／'+v.mat).join('・')})));
  DL.csv.export('細分工程.csv',
    [{k:'pattern',l:'パターン'},{k:'kind',l:'系統'},{k:'pre',l:'前提'},

/* ============================================================
   🖥 v0.6 工程ルート（N-5・BR-54）
   ============================================================ */
function setRoutes(){
  return `
  <div class="card mb"><div class="hdr"><h2>工程ルート</h2><span class="sp"></span>
    <button class="btn sm" onclick="csvRoutes()">CSV出力</button>
    <button class="btn sm pri" onclick="openRoute(null)">＋ ルートを追加</button></div>
    <div class="bd"><div class="alert info" style="font-size:12.5px">

      同じ「クラウン」でも <b>CAD/CAM は加工を通り、鋳造は埋没・鋳造を通る</b>という違いを
      ここで表します。</div></div>
    ${ROUTES.map(r=>{
      const used=VARIANTS.filter(v=>v.route===r.id);
      const n=CASES.filter(c=>variantOf(c).route===r.id).length;
      return `<div class="bd" style="border-top:1px solid var(--border-2)">
        <div class="row mb"><b style="font-size:13.5px">${esc(r.name)}</b>

          <span class="b prog">${r.steps.length}工程</span>
          <span class="note">進行中 ${n}件</span>
          <span class="sp"></span>
          <button class="btn sm" onclick="openRoute('${r.id}')">編集</button>
          <button class="btn sm dgr" onclick="delRoute('${r.id}')">削除</button></div>
        <div class="rt">${STEPS.map(s=>{
          const at=r.steps.indexOf(s.c);
          return `<span class="rs ${at>=0?'on':''}">${at>=0?`<i>${at+1}</i>`:''}${esc(s.n)}</span>`}).join('<span class="ra">›</span>')}</div>
        <div class="note mt">通る工程：${r.steps.map(c=>esc(stepName(c))).join(' → ')}</div>
        ${r.memo?`<div class="note">※ ${esc(r.memo)}</div>`:''}
        <div class="note">使う技工物：${used.length?used.map(v=>esc(v.type+'／'+v.mat)).join('、'):'<b>なし</b>'}</div>
        ${r.steps.includes('FINISHING')&&used.length?`<div class="note">
          仕上げの細分：${[...new Set(used.map(v=>v.fin).filter(Boolean))]
            .map(id=>{const f=subOf(id);return f?esc(f.name)+`（${f.steps.length}手順）`:''}).join('、')||'未設定'}</div>`:''}
      </div>`}).join('')}
  </div>`;
}
function openRoute(id){
  const r=id?ROUTES.find(x=>x.id===id):null;
  /* 🧑‍🔧 v0.8：既定は「受付・確認 → 仕様調整 → 仕上げ → 最終検品 → 梱包・発送」。
     以前は廃止した MATERIAL_CHECK を既定に入れていたため、追加した直後に
     どのルートにも属さない工程ができてしまっていた */
  const d=r||{id:'rt'+Date.now(),code:'RT-',name:'',
    steps:['INTAKE','CLARIFY','FINISHING','QC','SHIPPING'],memo:''};
  S.modal={title:r?`ルート「${r.name}」を編集`:'工程ルートを追加',wide:true,body:`
    <div class="grid g2">
      <label class="f"><span class="lb">ルート名 <span class="req">必須</span></span>
        <input type="text" id="rtName" value="${esc(d.name)}" placeholder="鋳造（金パラ・ゴールド）"></label>
      <label class="f"><span class="lb">コード</span><input type="text" id="rtCode" value="${esc(d.code)}"></label>
    </div>
    <label class="f"><span class="lb">経由する工程
      <span class="hint">押した順に番号が付きます。もう一度押すと外れます</span></span>
      <div class="chips" id="rtChips">${STEPS.map(s=>{
        const at=d.steps.indexOf(s.c);
        return `<button class="chip ${at>=0?'on':''}" data-c="${s.c}" onclick="rtToggle('${s.c}')">
          ${at>=0?`<b>${at+1}</b> `:''}${esc(s.n)}</button>`}).join('')}</div></label>
    <div class="alert info" style="font-size:12.5px" id="rtPrev">
      ${d.steps.map(c=>esc(stepName(c))).join(' → ')||'まだ選ばれていません'}</div>
    <label class="f" style="margin-bottom:0"><span class="lb">メモ</span>
      <input type="text" id="rtMemo" value="${esc(d.memo||'')}" placeholder="スキャン・デザイン・加工を通らない"></label>`,
    ok:r?'保存する':'追加する',fn:()=>{
      const name=document.getElementById('rtName').value.trim();
      if(!name){toast('ルート名をご入力ください');return}
      if(!S.rtSteps||!S.rtSteps.length){toast('工程を1つ以上お選びください');return}
      const x={code:document.getElementById('rtCode').value.trim(),name,
        steps:S.rtSteps.slice(),memo:document.getElementById('rtMemo').value.trim()};
      if(r)Object.assign(r,x); else ROUTES.push(Object.assign({id:d.id},x));
      S.rtSteps=null;closeModal();toast('保存しました。次に確定する案件から適用されます');
    }};
  S.rtSteps=d.steps.slice();
  render();
}
/* 押した順に工程を並べる。モーダルを閉じずに順序が見えるように、その場で描き替える */
function rtToggle(code){
  if(!S.rtSteps)S.rtSteps=[];
  const i=S.rtSteps.indexOf(code);
  i<0?S.rtSteps.push(code):S.rtSteps.splice(i,1);
  const box=document.getElementById('rtChips');
  if(box)box.querySelectorAll('.chip').forEach(b=>{
    const c=b.dataset.c,at=S.rtSteps.indexOf(c);
    b.className='chip'+(at>=0?' on':'');
    b.innerHTML=(at>=0?`<b>${at+1}</b> `:'')+esc(stepName(c));
  });
  const p=document.getElementById('rtPrev');
  if(p)p.textContent=S.rtSteps.map(c=>stepName(c)).join(' → ')||'まだ選ばれていません';
}
function delRoute(id){
  const r=ROUTES.find(x=>x.id===id);
  const used=VARIANTS.filter(v=>v.route===id);
  S.modal={title:'工程ルートを削除',body:`
    <p>ルート「<b>${esc(r.name)}</b>」を削除します。</p>
    ${used.length?`<div class="alert dgr mt" style="font-size:12.5px">
      ${used.length}件の技工物がこのルートを使っています
      （${used.map(v=>esc(v.type)).join('、')}）。削除すると工程が決まらなくなります。</div>`:''}`,
    ok:'削除する',danger:true,fn:()=>{
      ROUTES=ROUTES.filter(x=>x.id!==id);closeModal();toast('削除しました')}};
  render();
}
function csvRoutes(){
  const cols=[{k:'code',l:'コード'},{k:'name',l:'ルート名'},{k:'variants',l:'使う技工物'}];
  for(let i=1;i<=STEPS.length;i++)cols.push({k:'s'+i,l:i+'番目'});
  cols.push({k:'memo',l:'メモ'});
  DL.csv.export('工程ルート.csv',cols,ROUTES.map(r=>{
    const o={code:r.code,name:r.name,memo:r.memo||'',
      variants:VARIANTS.filter(v=>v.route===r.id).map(v=>v.type+'／'+v.mat).join('・')};
    r.steps.forEach((c,i)=>{o['s'+(i+1)]=stepName(c)});
    return o}));
  toast('CSVを出力しました');
}

/* ============================================================
   🖥 v0.6 工程エリアとゾーン（N-5・N-6／BR-53・BR-55）

function setAreas(){

  const nz=ZONES.length,na=ZONES.filter(z=>z.type==='ACTIVE').length,
        nd=ZONES.filter(z=>z.type==='DONE').length;
  return `
  <div class="card mb"><div class="hdr"><h2>工程エリアとゾーン</h2><span class="sp"></span>
    <button class="btn sm" onclick="csvZones()">CSV出力</button>
    <button class="btn sm pri" onclick="openArea(null)">＋ エリアを追加</button></div>
    <div class="bd">
      <div class="alert info mb" style="font-size:12.5px">

        「受注管理をする場所と模型を削る場所が同じ」という場合はエリアを分けず、
        <b>ゾーンを分けて</b>ください。</div>
      <label class="f"><span class="lb">待機と作業中を分ける
        <span class="hint">分けると作業時間のタイムスタンプが自動で取れます</span></span>
        <div class="row"><div class="sw ${CFG.zones?'on':''}" onclick="CFG.zones=!CFG.zones;render()"></div>
          <span class="note">${CFG.zones
            ?`ゾーン ${nz}個（作業中 ${na}個・完了 ${nd}個）。アンテナが ${nz}本必要です`
            :'1エリア1センサーで運用します。工程の通過は取れますが、実作業時間は取れません'}</span></div></label>
      <label class="f" style="margin-bottom:0"><span class="lb">完了ゾーンを使う
        <span class="hint">★これがないと「次工程が詰まって待っている時間」が実作業時間に混ざります</span></span>
        <div class="row"><div class="sw ${CFG.zoneDone?'on':''}" onclick="CFG.zoneDone=!CFG.zoneDone;render()"></div>
          <span class="note">${CFG.zoneDone
            ?'作業が終わった現物を完了棚に移した時点で実作業時間を確定します'
            :'作業中ゾーンから離れた時点で確定します（次工程待ちが混ざります）'}</span></div></label>
      ${CFG.zoneDone?`<div class="alert info" style="font-size:12.5px">
        完了棚にあるものは<b>次工程の担当者にとっての待ち</b>です。
        次のエリアの端末に「前の工程の完了棚にあるもの」として出ます。<br>
        アンテナは 18本 → <b>${nz}本</b> になります（機器費で約30万円の差）。</div>`:''}
    </div></div>

  ${AREAS.map(a=>{
    const zs=zonesOfArea(a.id),ss=stepsOfArea(a.id);
    const n=CASES.filter(c=>ss.includes(STEPS[c.step].c)).length;
    return `<div class="card mb"><div class="hdr">
      <h3>${esc(a.name)}</h3><code class="note">${esc(a.code)}</code>
      <span class="b prog">${ss.length}工程</span>
      ${CFG.zones?`<span class="b gray">${zs.length}ゾーン</span>`:''}
      <span class="note">いま ${n}件</span>
      <span class="sp"></span>
      <button class="btn sm" onclick="openArea('${a.id}')">編集</button>
      <button class="btn sm dgr" onclick="delArea('${a.id}')">削除</button></div>
      <div class="bd">
        <div class="row mb"><span class="note">行う工程</span>
          <div class="chips">${ss.length?ss.map(c=>`<span class="chip on" style="cursor:default">${esc(stepName(c))}</span>`).join('')
            :'<span class="b dgr">未割当</span>'}</div></div>
        ${a.note?`<p class="note">※ ${esc(a.note)}</p>`:''}
      </div>
      ${CFG.zones?`<div class="tw"><table>
        <thead><tr><th>ゾーン</th><th>種類</th><th>この工程の作業中</th><th>置き方</th>
          <th>アンテナ</th><th>リーダー</th><th></th></tr></thead>
        <tbody>${zs.map(z=>`<tr>
          <td><b>${esc(z.name)}</b><div class="note"><code>${esc(z.code)}</code></div></td>
          <td><span class="b ${ZONE_TYPE[z.type].c}">${ZONE_TYPE[z.type].l}</span></td>
          <td>${z.step?esc(stepName(z.step)):'<span class="note">—</span>'}</td>
          <td class="note">${esc(z.shelf||'—')}</td>
          <td><code>ANT-${String(z.ant).padStart(2,'0')}</code></td>
          <td><code>${esc(a.reader)}</code></td>
          <td><button class="btn sm" onclick="openZone('${z.id}')">編集</button>
            <button class="btn sm dgr" onclick="delZone('${z.id}')">削除</button></td></tr>`).join('')
          ||'<tr><td colspan="7" class="note">ゾーンが未登録です</td></tr>'}</tbody>

      <div class="bd"><button class="btn sm pri" onclick="openZone(null,'${a.id}')">＋ ゾーンを追加</button>

        ${!zs.some(z=>z.type==='WAIT')?`<span class="note" style="margin-left:10px">

  ${CFG.zones?`<div class="card"><div class="hdr"><h3>リーダーのチャンネル</h3></div>

      機器費の見積りは「調査検証」の資料（v0.3）をご覧ください。</div></div></div>`:''}`;
}

    </div>

        device:document.getElementById('arDevice').value.trim(),
        note:document.getElementById('arNote').value.trim()};
      if(a)Object.assign(a,x); else AREAS.push(Object.assign({id:d.id},x));

      const sel=S.arSteps||cur;
      AREA_STEPS=AREA_STEPS.filter(y=>y.area!==d.id&&!sel.includes(y.step));

function arToggle(code){

  const b=document.querySelector(`#arSteps .chip[data-c="${code}"]`);
  if(b)b.classList.toggle('on',S.arSteps.includes(code));
}
function delArea(id){

            `<option value="${c}" ${f===c?'selected':''}>${esc(c)}</option>`).join('')}

      </div>

  ${list.map(m=>{

        <tbody>${ps.map(p=>{

            <td>${p.pref?'<span class="b done">優先</span>':`<button class="btn sm" onclick="setPref('${p.id}')">優先にする</button>`}</td>

            <td class="note">${esc(p.at||'未取込')}</td>
            <td><button class="btn sm" onclick="openMatPrice('${p.id}')">編集</button>

      ${dup?`<div class="bd"><div class="alert warn" style="font-size:12.5px">

const MP_COLS=[{k:'mat',l:'材料名'},{k:'code',l:'材料コード'},{k:'sup',l:'発注先'},
  {k:'sku',l:'商品コード'},{k:'unit',l:'単位'},{k:'price',l:'価格（税抜）'},
  {k:'pref',l:'優先'},{k:'at',l:'価格リストの日付'}];
function csvMatPrices(){
  DL.csv.export('材料の発注先と価格.csv',MP_COLS,
    MAT_PRICES.map(p=>({mat:matOf(p.mat).name,code:matOf(p.mat).code,sup:supOf(p.sup).name,
      sku:p.sku||'',unit:p.unit||'',price:p.price,pref:p.pref?'○':'',at:p.at||''})));
  toast('CSVを出力しました');
}
function importMatPrices(){
  DL.csv.pickFile((text,fname)=>{
    if(!text){toast('ファイルを読み込めませんでした');return}
    const rows=DL.csv.parse(text);
    const {items}=DL.csv.toObjects(MP_COLS,rows);
    const issues=items.map(o=>{
      if(!o.mat&&!o.code)return {level:'error',msg:'材料が空です'};
      const m=MATERIALS.find(x=>x.name===o.mat||x.code===o.code);
      if(!m)return {level:'error',msg:'未登録の材料です'};
      if(!SUPPLIERS.find(s=>s.name===o.sup))return {level:'error',msg:'未登録の発注先です'};
      if(!o.price||isNaN(+String(o.price).replace(/[,¥円]/g,'')))return {level:'error',msg:'価格が数値ではありません'};
      const dup=MAT_PRICES.find(p=>p.mat===m.id&&supOf(p.sup).name===o.sup);
      if(dup)return {level:'warn',msg:'既存の価格を上書きします'};
      return null;
    });
    const ok=items.filter((o,i)=>!issues[i]||issues[i].level!=='error');
    S.modal={title:'価格リストの取り込み',wide:true,body:`
      <p class="note mb"><code>${esc(fname)}</code> ／ ${items.length}行
        （取り込める ${ok.length}行 ・ 取り込めない ${items.length-ok.length}行）</p>
      ${DL.csv.previewHtml(MP_COLS,items,issues,40)}
      <div class="alert warn mt" style="font-size:12.5px">
        ★ 取り込みは必ずこのプレビューを挟みます（BR-47）。
        「既存の価格を上書きします」の行は、価格とリストの日付が置き換わります。</div>`,
      ok:`${ok.length}行を取り込む`,okDisabled:!ok.length,fn:()=>{
        let add=0,upd=0;
        items.forEach((o,i)=>{
          if(issues[i]&&issues[i].level==='error')return;
          const m=MATERIALS.find(x=>x.name===o.mat||x.code===o.code);
          const s=SUPPLIERS.find(x=>x.name===o.sup);
          const price=+String(o.price).replace(/[,¥円]/g,'');
          const ex=MAT_PRICES.find(p=>p.mat===m.id&&p.sup===s.id);
          if(ex){Object.assign(ex,{sku:o.sku||ex.sku,unit:o.unit||ex.unit,price,at:o.at||ex.at});upd++}
          else{MAT_PRICES.push({id:'mp'+Date.now()+add,mat:m.id,sup:s.id,sku:o.sku,unit:o.unit,
            price,pref:!MAT_PRICES.some(p=>p.mat===m.id&&p.pref),at:o.at||null});add++}
        });
        closeModal();toast(`${add}件を追加、${upd}件を更新しました`);
      }};
    render();
  });
}

/* ---------- ディーラーへの価格照会シート（エクスポート／インポート） ---------- */

function openDealerSheet(supId){

      すでに登録済みの商品コード・単位は入れておきます。</p>`,
    ok:'書き出す',fn:()=>{
      DL.csv.export(
        `価格照会シート${s?'_'+s.name:''}.csv`,DS_COLS,
        mats.map(m=>{
          const ex=supId?MAT_PRICES.find(p=>p.mat===m.id&&p.sup===supId):null;
          return {code:m.code,mat:m.name,cat:m.cat,sku:ex?ex.sku:'',item:'',
            unit:ex?ex.unit:'',price:'',lead:'',note:''}}));

function importDealerSheet(){
  DL.csv.pickFile((text,fname)=>{
    if(!text){toast('ファイルを読み込めませんでした');return}
    const rows=DL.csv.parse(text);
    const {items}=DL.csv.toObjects(DS_COLS,rows);
    /* 価格が空の行は「回答なし＝取り扱いなし」として無視する。エラーにはしない */
    const filled=items.filter(o=>String(o.price||'').trim()!=='');
    const issues=items.map(o=>{
      if(String(o.price||'').trim()==='')return {level:'warn',msg:'価格が空欄（取り扱いなしとして無視）'};
      const m=MATERIALS.find(x=>x.code===o.code||x.name===o.mat);
      if(!m)return {level:'error',msg:'当社に無い材料です'};
      const n=+String(o.price).replace(/[,¥円\s]/g,'');
      if(isNaN(n)||n<=0)return {level:'error',msg:'価格が数値ではありません'};
      return null;
    });
    const bad=issues.filter(i=>i&&i.level==='error').length;
    S.modal={title:'ディーラーの回答を取り込む',wide:true,body:`
      <p class="note mb"><code>${esc(fname)}</code> ／ ${items.length}行
        （価格の記入あり ${filled.length}行 ・ 空欄 ${items.length-filled.length}行 ・ 取り込めない ${bad}行）</p>
      <label class="f"><span class="lb">どの発注先の回答か <span class="req">必須</span></span>
        <select id="dsSup">${SUPPLIERS.slice().sort((a,b)=>a.prio-b.prio).map(s=>
          `<option value="${s.id}">${esc(s.name)}（${SUP_TYPE[s.type].l}）</option>`).join('')}</select></label>
      <label class="f"><span class="lb">価格リストの日付 <span class="hint">いつ時点の価格か</span></span>
        <input type="date" id="dsAt" value="2026-08-21"></label>
      <label class="f"><span class="lb">優先発注先の扱い</span>
        <div class="row"><div class="sw" onclick="this.classList.toggle('on')" id="dsPref"></div>
          <span class="note">この発注先を、取り込んだ材料の優先発注先にする</span></div></label>
      ${DL.csv.previewHtml(DS_COLS,items,issues,40)}
      <div class="alert warn mt" style="font-size:12.5px">
        ★ 価格が空欄の行は「その発注先では扱いがない」とみなして<b>取り込みません</b>。
        エラーにはしないので、一部だけご記入いただいた回答でもそのまま使えます。<br>
        ★ 優先発注先を切り替えるかどうかは<b>御社の判断</b>です。既定では切り替えません。</div>`,
      ok:`${filled.length-bad}行を取り込む`,okDisabled:(filled.length-bad)<=0,fn:()=>{
        const sup=document.getElementById('dsSup').value;
        const at=document.getElementById('dsAt').value||null;
        const makePref=document.getElementById('dsPref').classList.contains('on');
        let add=0,upd=0;
        items.forEach((o,i)=>{
          if(issues[i]&&issues[i].level!=='warn'&&issues[i].level==='error')return;
          if(String(o.price||'').trim()==='')return;
          const m=MATERIALS.find(x=>x.code===o.code||x.name===o.mat);
          if(!m)return;
          const price=+String(o.price).replace(/[,¥円\s]/g,'');
          if(isNaN(price)||price<=0)return;
          const ex=MAT_PRICES.find(p=>p.mat===m.id&&p.sup===sup);
          if(ex){Object.assign(ex,{sku:o.sku||ex.sku,unit:o.unit||ex.unit,price,at});upd++}
          else{MAT_PRICES.push({id:'mp'+Date.now()+'_'+add,mat:m.id,sup,sku:o.sku,unit:o.unit,
            price,pref:false,at});add++}
          if(makePref){MAT_PRICES.filter(p=>p.mat===m.id).forEach(p=>p.pref=(p.sup===sup))}
        });
        const s=SUPPLIERS.find(x=>x.id===sup);
        s.listAt=at;s.listFmt='EXCEL';
        closeModal();
        toast(`${supOf(sup).name} の価格を ${add}件追加・${upd}件更新しました`);
      }};
    render();
  });
}

function poQty(i,v){S.poDraft.lines[i].qty=Math.max(1,+v||1);renderPOModal()}
function poDel(i){S.poDraft.lines.splice(i,1);renderPOModal()}

/* ============================================================
   🏭 v0.7 発注書（PDF・CSV）とEC連携の想定

   ★ここでは「どこで何を発注するか」を登録する。
     連携EC（提携予定）についてはこの画面から直接発注できるよう拡張していく。
     ECが出来上がるまでと、その他のディーラーへ発注する際は、
     ここで発注書を作成して PDF と CSV を出す。
     CSV は「ディーラー独自の発注書に貼り付けるためのコピー元」として使う。
   ============================================================ */
const poAmount=p=>p.lines.reduce((n,l)=>{
  const mp=MAT_PRICES.find(x=>x.mat===l.mat&&x.sup===p.sup);
  return n+(mp?mp.price*l.qty:0)},0);
const poTax=p=>Math.round(poAmount(p)*0.1);
const poUnit=(p,l)=>(MAT_PRICES.find(x=>x.mat===l.mat&&x.sup===p.sup)||{price:0,unit:''});

/* 発注書の印刷レイアウト。請求書と同じ体裁に揃える */
function poHtml(p){
  const s=supOf(p.sup);
  return `
  <div class="inv">
    <div class="ih">
      <div>
        <div class="ttl">発 注 書</div>
        <div style="margin-top:16px" class="to">${esc(s.name)} 御中</div>
        <div style="margin-top:14px">下記のとおり発注いたします。</div>
        <div class="total">発注金額　${yen(poAmount(p)+poTax(p))}</div>
        <div style="font-size:11px">希望納入日　${esc(p.wantOn||'指定なし')}</div>
      </div>
      <div class="meta">発注番号　${esc(p.no)}<br>
        発注日　${esc(p.at)}<br>
        発注方法　${esc(s.order||'—')}</div>
    </div>
    <table>
      <thead><tr><th style="width:34%">品名</th><th style="width:18%">品番</th>
        <th style="width:14%">単位</th><th style="width:8%">数量</th>
        <th style="width:13%">単価</th><th style="width:13%">金額</th></tr></thead>
      <tbody>
        ${p.lines.map(l=>{const mp=poUnit(p,l);
          return `<tr><td>${esc(matOf(l.mat).name)}</td>
          <td>${esc(mp.sku||'—')}</td>
          <td>${esc(mp.unit||'—')}</td>
          <td style="text-align:right">${l.qty}</td>
          <td style="text-align:right">${yen(mp.price)}</td>
          <td style="text-align:right">${yen(mp.price*l.qty)}</td></tr>`}).join('')}
        <tr><td colspan="5" style="text-align:right">小計（10%対象）</td>
          <td style="text-align:right">${yen(poAmount(p))}</td></tr>
        <tr><td colspan="5" style="text-align:right">消費税（10%）</td>
          <td style="text-align:right">${yen(poTax(p))}</td></tr>
        <tr><td colspan="5" style="text-align:right;font-weight:700">合計</td>
          <td style="text-align:right;font-weight:700">${yen(poAmount(p)+poTax(p))}</td></tr>
      </tbody>
    </table>
    ${p.memo?`<p style="font-size:11.5px;margin-top:10px">備考：${esc(p.memo)}</p>`:''}
    <div class="from" style="display:flex;justify-content:space-between;gap:20px">
      <div><b>${esc(LAB.name)}</b><br>${esc(LAB.addr)}<br>TEL ${esc(LAB.tel)}<br>
        登録番号 ${esc(LAB.invoiceNo)}</div>
      <div style="text-align:right">
        品違い・欠品の場合はご連絡ください。<br>納品書を同梱してください。</div>
    </div>
  </div>`;
}
function printPO(id){
  const p=PO.find(x=>x.id===id);
  if(!p){toast('発注が見つかりません');return}
  DL.printNode(poHtml(p),`発注書_${p.no}_${supOf(p.sup).name}`);
}
function openPOView(id){
  const p=PO.find(x=>x.id===id);
  if(!p){toast('発注が見つかりません');return}
  const s=supOf(p.sup);
  S.modal={title:`${p.no} の発注書`,wide:true,body:`
    ${s.ec?`<div class="alert ok mb" style="font-size:12.5px">
      この発注先は<b>連携ECサイト</b>です。EC が公開されたら、この画面から直接発注できるようになります。
      現在は発注書を出力してご利用ください。</div>`:''}
    <div class="poprev">${poHtml(p)}</div>
    <div class="alert info mt" style="font-size:12.5px">
      <b>CSV は「ディーラー独自の発注書に貼り付けるためのコピー元」です。</b>
      発注先の様式がそれぞれ違うため、こちらから様式を指定はしません。
      品名・品番・単位・数量・単価の並びで出します。</div>`,
    foot:`<button class="btn" onclick="printPO('${p.id}')">PDF・印刷</button>
      <button class="btn" onclick="csvPOLines('${p.id}')">CSV出力</button>`,ok:null};
  render();
}
/* 1件の発注の明細だけを出す。全件の履歴CSV（csvPO）とは別物 */
const PO_LINE_COLS=[{k:'name',l:'品名'},{k:'sku',l:'品番'},{k:'unit',l:'単位'},
  {k:'qty',l:'数量'},{k:'price',l:'単価'},{k:'amount',l:'金額'}];
function csvPOLines(id){
  const p=PO.find(x=>x.id===id);
  if(!p){toast('発注が見つかりません');return}
  DL.csv.export(`発注書_${p.no}_${supOf(p.sup).name}.csv`,PO_LINE_COLS,
    p.lines.map(l=>{const mp=poUnit(p,l);
      return {name:matOf(l.mat).name,sku:mp.sku||'',unit:mp.unit||'',
        qty:l.qty,price:mp.price,amount:mp.price*l.qty}}));
  toast('CSVを出力しました。発注先の様式に貼り付けてご利用ください');
}
function csvPO(){
  DL.csv.export('資材の発注.csv',
    [{k:'no',l:'発注番号'},{k:'sup',l:'発注先'},{k:'type',l:'種別'},{k:'at',l:'発注日'},
     {k:'mat',l:'材料'},{k:'qty',l:'数量'},{k:'price',l:'単価'},{k:'status',l:'状況'},{k:'memo',l:'メモ'}],
    PO.flatMap(p=>p.lines.map(l=>{
      const mp=MAT_PRICES.find(x=>x.mat===l.mat&&x.sup===p.sup)||{price:0};
      return {no:p.no,sup:supOf(p.sup).name,type:SUP_TYPE[supOf(p.sup).type].l,at:p.at,
        mat:matOf(l.mat).name,qty:l.qty,price:mp.price,status:PO_STATUS[p.status].l,memo:p.memo||''}})));
  toast('CSVを出力しました');
}

        :`<div class="note mb">${EXT.length}段階にまとめて出します</div>
          <div class="brk">${EXT.map(s=>`<div class="bi"><span>${esc(s)}</span>

/* ============================================================

  ${tab==='case'?`<div class="card"><div class="hdr"><h2>案件ごとの採算</h2>

      <b>0円としては数えていません。</b>登録すると材料費が増え、粗利はこれより下がります。</div>`:''}

const mins=n=>n==null?'—':(n>=60?`${Math.floor(n/60)}時間${n%60}分`:`${n}分`);
function bar(v,max,cls){
  const w=max?Math.max(2,Math.round(v/max*100)):0;
  return `<div class="wb"><div class="wf ${cls||''}" style="width:${w}%"></div></div>`;
}
function wtStep(){
  const cmp=wtRange()&&S.wtCmp!==false;
  const rows=STEPS.map(s=>{
    const st=workStat(s.c,null);
    const b=BENCH[s.c]||null;
    return {s,st,b,ratio:(st.work&&b)?st.work/b:null,dl:cmp?workDelta(s.c,null):null};
  });
  const maxW=Math.max(...rows.map(r=>r.st.work||0),1);
  const maxQ=Math.max(...rows.map(r=>r.st.queue||0),1);
  return `
  <div class="card mb"><div class="hdr"><h2>工程ごとの実作業時間</h2>
    <span class="sp"></span><span class="note">中央値／${CFG.minSamples}件以上のものだけ</span></div>
    <div class="tw"><table>
      <thead><tr><th>工程</th><th>エリア</th><th>件数</th><th>実作業</th><th></th>
        ${cmp?'<th>前の期間と比べて</th>':''}
        <th>待ち</th><th></th><th>他社平均</th><th>比</th></tr></thead>
      <tbody>${rows.map(r=>{
        const ar=areaOfStep(r.s.c);
        return `<tr>
          <td><b>${esc(r.s.n)}</b></td>
          <td class="note">${ar?esc(ar.name):'—'}</td>
          <td>${r.st.n}</td>
          <td>${r.st.enough?mins(r.st.work):`<span class="note">—</span>`}</td>
          <td style="width:110px">${r.st.enough?bar(r.st.work,maxW):''}</td>
          ${cmp?`<td>${deltaHtml(r.dl)}</td>`:''}
          <td>${r.st.enough?mins(r.st.queue):'<span class="note">—</span>'}</td>
          <td style="width:110px">${r.st.enough?bar(r.st.queue,maxQ,'q'):''}</td>
          <td class="note">${r.b?mins(r.b):'—'}</td>
          <td>${r.ratio?`<span class="b ${r.ratio<=0.95?'done':r.ratio<=1.1?'gray':'wait'}">
            ${Math.round(r.ratio*100)}%</span>`:'<span class="note">—</span>'}</td></tr>`}).join('')}</tbody>
    </table></div>
    ${cmp?`<div class="bd"><div class="alert info" style="font-size:12.5px">
      <b>▼ は実作業が短くなった（速くなった）ことを表します。</b>
      工程の手順を変えた・機械を替えたときに、効果が出たかをここで見ます。</div></div>`:''}
    <div class="bd"><div class="alert info" style="font-size:12.5px">
      「他社平均」はテナントを横断した<b>匿名の集計</b>です。どの技工所の数字かは分かりません。
      比が 100% を超えている工程は、手順の見直しで縮められる可能性があります。</div></div></div>

  <div class="card"><div class="hdr"><h2>待ちが長い工程</h2></div><div class="bd">
    <p class="note mb">実作業より<b>待ち時間</b>のほうが長い工程は、人手ではなく段取りの問題です。</p>
    ${(()=>{const w=rows.filter(r=>r.st.enough&&r.st.queue>r.st.work)
        .sort((a,b)=>(b.st.queue-b.st.work)-(a.st.queue-a.st.work));
      return w.length?`<div class="tw"><table>
        <thead><tr><th>工程</th><th>待ち</th><th>実作業</th><th>差</th><th>読み取れること</th></tr></thead>
        <tbody>${w.map(r=>`<tr><td><b>${esc(r.s.n)}</b></td>
          <td>${mins(r.st.queue)}</td><td>${mins(r.st.work)}</td>
          <td><span class="b wait">＋${mins(r.st.queue-r.st.work)}</span></td>
          <td class="note">前工程からの流れが詰まっているか、担当者の空きを待っています</td></tr>`).join('')}</tbody>
      </table></div>`:'<div class="alert ok" style="font-size:12.5px">待ちが実作業を上回る工程はありません。</div>'})()}
  </div></div>`;
}

/* 折れ線グラフ。SVG を組み立てるだけ。ライブラリは使わない */
function lineChart(labels,series,unit){
  const W=760,H=260,L=52,R=14,T=16,B=34;
  const iw=W-L-R,ih=H-T-B;
  const all=series.flatMap(s=>s.vals);
  const max=Math.max(1,...all), min=0;
  /* 目盛りはきりのいい数に丸める */
  const step=Math.max(1,Math.ceil(max/4/5)*5);
  const top=step*Math.ceil(max/step)||step;
  const x=i=>L+(labels.length<2?iw/2:iw*i/(labels.length-1));
  const y=v=>T+ih-ih*(v-min)/(top-min);
  const grid=[];
  for(let v=0;v<=top;v+=step)grid.push(v);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc((series[0]||{}).name||'')}ほかの推移">
    ${grid.map(v=>`<line class="gl" x1="${L}" y1="${y(v).toFixed(1)}" x2="${W-R}" y2="${y(v).toFixed(1)}"/>
      <text class="ax" x="${L-7}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join('')}
    <text class="ax" x="${L-7}" y="${T-4}" text-anchor="end">${esc(unit)}</text>
    ${labels.map((l,i)=>`<text class="ax" x="${x(i).toFixed(1)}" y="${H-12}" text-anchor="middle">${esc(l)}</text>`).join('')}
    ${series.map(s=>{
      const pts=s.vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      return `<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"
        stroke-linecap="round" points="${pts}"/>
        ${s.vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.4"
          fill="#fff" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} ${esc(labels[i])} ${v}${esc(unit)}</title></circle>`).join('')}`;
    }).join('')}
  </svg></div>`;
}
function csvMonths(){
  const rows=[];
  MONTHS.forEach(m=>Object.keys(m.by).forEach(sid=>{

/* 面談シートの中身。★本人に見せてよいものだけ */
function reviewHtml(who){
  const p=staffOf(who);
  const mine=MONTHS.map(m=>(m.by[who]||{}));
  const cur=mine[mine.length-1]||{},prv=mine[mine.length-2]||{};
  const dW=prv.work?Math.round((cur.work-prv.work)/prv.work*100):null;
  const cases=CASES.filter(c=>c.assign.some(a=>a.s===who));
  /* 得意な技工物・時間がかかっている技工物。★数値ではなく言葉で返す */
  const pg=prodTypes().map(t=>({t,m:prodStat(t,who),a:prodStat(t,null)}))
    .filter(x=>x.m.enough&&x.a.enough).map(x=>Object.assign(x,{r:x.m.work/x.a.work}));
  const strong=pg.filter(x=>x.r<=0.9).sort((a,b)=>a.r-b.r).slice(0,2);
  const weak=pg.filter(x=>x.r>=1.15).sort((a,b)=>b.r-a.r).slice(0,2);
  const sk=SKILLS[who]||{};
  return `<div class="iv">
    <h2>${esc(p.name)} さん ／ ふりかえりシート</h2>

                .map(q=>({q,s:prodStat(weak[0].t,q.id)})).filter(x=>x.s.enough)
                .sort((a,b)=>a.s.work-b.s.work)[0];
              return best?esc(best.q.name)+' さん':'先輩'})()} と一緒に進めます`

      <tr><th>お願いしたいこと</th>
        <td>作業が終わった現物は<b>完了棚</b>へ移してください。<br>

    </tbody></table>

    <div style="font-size:11.5px;font-weight:600;margin-top:12px">本人からのひとこと</div>

function importTrays(){

    const issues=items.map(o=>!o.tray?{level:'error',msg:'トレイ番号がありません'}:null);

    S.modal={title:'トレイの一括登録',wide:true,body:`

      }};
    render();
  });
}

function importBank(){
  DL.csv.pickFile(text=>{
    if(text==null){toast('ファイルを読み込めませんでした');return}
    const cols=[{k:'date',l:'入金日'},{k:'name',l:'振込名義'},{k:'amount',l:'入金額'}];
    const {items}=DL.csv.toObjects(cols,DL.csv.parse(text));
    /* 金額の完全一致 → 名義のカナ部分一致 の順に候補を出す。確定は人が行う */
    const matched=items.map(o=>{
      const amt=+String(o.amount||'').replace(/[,¥]/g,'')||0;
      const hit=LAB_INVOICES.find(i=>i.status!=='PAID'&&liTotal(i)===amt);
      return {o,amt,hit};
    });
    S.modal={title:'銀行CSVの取込',wide:true,body:`
      <p>${items.length}件の入金を読み込みました。金額が一致する請求を候補として出しています。</p>
      <div class="tw" style="max-height:300px;overflow:auto"><table>
        <thead><tr><th>入金日</th><th>振込名義</th><th class="num">入金額</th><th>候補</th></tr></thead>
        <tbody>${matched.map(m=>`<tr>
          <td class="note">${esc(m.o.date)}</td><td>${esc(m.o.name)}</td>
          <td class="num">${yen(m.amt)}</td>
          <td>${m.hit?`<b>${esc(m.hit.no)}</b> ${esc((clinicOf(m.hit.clinic)||{}).name)}`
            :'<span class="b wait">候補なし</span>'}</td></tr>`).join('')}</tbody></table></div>
      <div class="alert warn mt" style="font-size:12.5px">
        <b>自動では確定しません。</b>候補を確認して消込ボタンで確定してください。</div>`,
      ok:`一致した ${matched.filter(m=>m.hit).length}件を消込`,fn:()=>{
        matched.forEach(m=>{if(m.hit){m.hit.status='PAID';m.hit.paidOn=m.o.date||'2026-08-15'}});
        closeModal();toast(`${matched.filter(m=>m.hit).length}件を消込みました`);
      }};
    render();
  });
}

function doAssign(cid,sid){
  const c=findCase(cid),sk=SKILLS[sid]||{};
  if(sk.maxStar&&caseStar(c)>sk.maxStar){

  }
  c.assign=c.assign.filter(a=>a.r!=='MAIN');
  c.assign.push({s:sid,r:'MAIN'});
  c.tl.push({t:'たった今',w:ME().name,x:`${staffOf(sid).name} をメイン担当にアサインしました`,k:''});
  S.modal=null;toast('アサインしました');render();
}

function advance(id){
  const c=findCase(id);
  if(c.step>=STEPS.length-1){toast('最終工程です');return}
  const from=STEPS[c.step].n;c.step++;
  const to=STEPS[c.step];
  c.tl.push({t:'たった今',w:ME().name,x:`工程を「${from}」→「${to.n}」に進めました`,k:to.chg?'':'wn'});
  toast(!to.chg&&STEPS[c.step-1].chg?'加工工程に入りました。以降、仕様変更は受け付けません。':`「${to.n}」に進みました`);
  render();
}
/* ★ findIndex が -1 のとき splice(-1,1) は「最後の1件」を消してしまう。
   二重クリックで無関係な特急依頼が消えるため、必ず i<0 を弾く。 */
function acceptRush(id){
  const i=RUSH_REQS.findIndex(r=>r.caseId===id);
  if(i<0){toast('この特急依頼はすでに処理済みです');render();return}
  RUSH_REQS.splice(i,1);
  const c=findCase(id);if(c)c.isRush=true;
  toast('特急依頼を受諾しました');render()}
function declineRush(id){
  S.modal={title:'特急依頼の辞退',body:`
    <label class="f"><span class="lb">理由（医院に伝わります）</span>
      <textarea>現在、加工機の稼働が逼迫しており、ご希望の納期での対応が難しい状況です。通常納期でのご提案をさせていただきます。</textarea></label>`,
    ok:'辞退して通常納期を提案',fn:()=>{
      const i=RUSH_REQS.findIndex(r=>r.caseId===id);
      if(i>=0)RUSH_REQS.splice(i,1);
      S.modal=null;toast('辞退し、通常納期で提案しました');render()}};
  render();
}

  if(isStaff())return [['dashboard','My ダッシュボード'],['board','案件ボード'],['cases','My 案件'],
    ['ship','発送予定']];
  const t=[['dashboard','ダッシュボード'],['board','案件ボード'],['cases','案件一覧'],
    ['ship','発送予定'],['capacity','キャパシティ'],
    ['supply','資材の発注'],['clinics','医院マスタ'],['worktime','作業時間'],['analytics','分析'],
    ['invoices','請求・入金']];
  /* 🧑‍🔧 v0.8.1 採算。★賃率・想定使用量が未入力なら、タブごと出さない（FR-PF-004）。
     空欄だらけの画面を出すと「使えないシステム」の印象しか残らない（原則48） */

  if(isAdmin())t.push(['service','サービス利用料']);

    invoices:vInvoices,service:vService,settings:vSettings};
  document.getElementById('app').innerHTML=(V[S.route]||vDashboard)();
  document.getElementById('overlay').innerHTML=renderModal()+(S.toast?`<div class="toast">${esc(S.toast)}</div>`:'');
  syncHeaderHeight();
}
/* 検索窓とアクションバーの sticky 位置に使う。ヘッダーが折り返して高さが変わっても追従する（A-8） */
function syncHeaderHeight(){
  const h=document.querySelector('header');
  if(h)document.documentElement.style.setProperty('--hdrh',h.offsetHeight+'px');
}
addEventListener('resize',syncHeaderHeight);
const rs=document.getElementById('roleSel');
rs.innerHTML=STAFF.map(s=>`<option value="${s.id}">${s.name}（${s.label}）</option>`).join('');
rs.onchange=e=>{S.me=e.target.value;S.route='dashboard';S.hist=[];S.sel=[];render()};
/* 🧑‍🔧 v0.8 デモの規模を切り替える（ご回答 #92「最低3パターン欲しい。最優先は小規模ラボ」）*/
const sc=document.getElementById('scaleSel');
sc.innerHTML=Object.values(SCALES).map(x=>
  `<option value="${x.k}" ${x.k===SCALE?'selected':''}>${x.l}（${x.mo}）</option>`).join('');
sc.onchange=e=>setScale(e.target.value);
applyBrand();
render();
</script>
</body>
</html>
