<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>なかたに技工所 業務管理</title>
<style>
:root{
  --bg:#f4f7f6; --surface:#fff; --surface-2:#fafcfb; --border:#dde5e2; --border-2:#eef3f1;
  --text:#16241f; --muted:#61736c; --faint:#8a9a94;
  --primary:#0f766e; --primary-dark:#115e59; --primary-soft:#e6f2f0;
  --accent:#b45309; --accent-soft:#fdf2e3;
  --danger:#b91c1c; --danger-soft:#fdeceb;
  --success:#15803d; --success-soft:#e9f6ed;
  --ins:#1d4ed8; --ins-soft:#e8eefc;
  --pri:#a16207; --pri-soft:#fbf3e0;
  --mcp:#6d28d9; --mcp-soft:#f0eafc;
  --od:#7f1d1d; --d0:#b91c1c; --d1:#b45309; --d3:#ca8a04; --dn:#15803d;
  --radius:10px; --shadow:0 1px 2px rgba(16,40,34,.06),0 4px 14px rgba(16,40,34,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary);text-decoration:none}

.devbar{background:#111827;color:#9ca3af;font-size:11.5px;padding:4px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.devbar b{color:#e5e7eb}.devbar .sp{flex:1}.devbar a{color:#93c5fd}
.devbar select{width:auto;padding:1px 5px;font-size:11.5px;background:#374151;border:1px solid #4b5563;color:#fff;border-radius:4px}

header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.hd{max-width:1440px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo .mk{width:26px;height:26px;border-radius:7px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px}
.hd .sp{flex:1}
.pill{border:1px solid var(--border);background:var(--surface-2);border-radius:99px;padding:4px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.bell{position:relative;border:1px solid var(--border);background:var(--surface-2);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;cursor:pointer}
.bell .dot{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:99px;font-size:10.5px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
nav.tabs{max-width:1440px;margin:0 auto;padding:0 18px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:none;padding:9px 12px;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--primary-dark);border-bottom-color:var(--primary);font-weight:600}

main{max-width:1440px;margin:0 auto;padding:18px 18px 70px}
h1{font-size:20px;margin:0 0 3px}
h2{font-size:15.5px;margin:0 0 10px}
h3{font-size:13.5px;margin:0 0 7px}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .hdr{padding:11px 15px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:9px}
.card .hdr h2,.card .hdr h3{margin:0}
.card .bd{padding:15px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:240px 1fr}
@media(max-width:1000px){.g2,.g3,.g4,.g21,.g12{grid-template-columns:1fr}}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.sp{flex:1}.mt{margin-top:14px}.mb{margin-bottom:14px}

.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px}
.btn:hover{border-color:var(--faint);background:var(--surface-2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--primary-dark)}
.btn.dgr{background:#fff;border-color:#e5b4b1;color:var(--danger)}
.btn.wrn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.lg{padding:11px 20px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:none;background:none;padding:6px 12px;cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--primary);color:#fff;font-weight:600}

.b{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;line-height:1.7;white-space:nowrap}
.b.ins{background:var(--ins-soft);color:var(--ins)}
.b.pri2{background:var(--pri-soft);color:var(--pri)}
.b.wait{background:var(--accent-soft);color:var(--accent)}
.b.prog{background:var(--primary-soft);color:var(--primary-dark)}
.b.done{background:var(--success-soft);color:var(--success)}
.b.dgr{background:var(--danger-soft);color:var(--danger)}
.b.gray{background:#eef1f0;color:var(--muted)}
.b.mcp{background:var(--mcp-soft);color:var(--mcp)}

.alert{border-radius:var(--radius);padding:12px 14px;font-size:13px;border:1px solid}
.alert.warn{background:var(--accent-soft);border-color:#f0d5a8;color:#7c3d06}
.alert.dgr{background:var(--danger-soft);border-color:#f0c0bd;color:#8c1d18}
.alert.info{background:var(--primary-soft);border-color:#b8dcd7;color:#0b544e}
.alert.ok{background:var(--success-soft);border-color:#b7e0c4;color:#12592d}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 11px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--border-2);vertical-align:middle}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}
.tw{overflow-x:auto}

/* ダッシュボードの行から詳細に飛べることを示す（A-5） */
.rowlink{cursor:pointer;border-radius:7px;margin:0 -8px;padding-left:8px!important;padding-right:8px!important;transition:.12s}
.rowlink:hover{background:var(--surface-2)}

/* 案件一覧：検索窓とアクションバーを固定し、スクロールはリストだけにする（A-8）
   --hdrh はヘッダーの実測値を render() で入れる。折り返しで高さが変わっても追従する。 */
:root{--hdrh:92px}
.stick{position:sticky;top:var(--hdrh);z-index:30}
.listwrap{overflow:auto;max-height:calc(100vh - var(--hdrh) - 210px);min-height:240px}
.listwrap table{border-collapse:separate;border-spacing:0}
.listwrap thead th{position:sticky;top:0;z-index:6;box-shadow:inset 0 -1px 0 var(--border)}
.listwrap td{border-bottom:1px solid var(--border-2)}
.actbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;border-top:1px solid #b8dcd7;background:var(--primary-soft);
  border-radius:0 0 var(--radius) var(--radius)}
.actbar .cnt{font-weight:700;font-size:13.5px;color:var(--primary-dark)}

label.f{display:block;margin-bottom:12px}
label.f .lb{font-size:12.5px;font-weight:600;margin-bottom:4px;display:flex;gap:6px;align-items:center}
label.f .hint{font-size:11.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#fff;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer;background:#fff;font-size:12.5px}
.chip.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
.sw{position:relative;width:40px;height:22px;background:var(--border);border-radius:99px;cursor:pointer;transition:.15s;flex:none}
.sw.on{background:var(--primary)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:99px;transition:.15s}
.sw.on::after{left:20px}

/* カンバン */
.kbwrap{overflow-x:auto;padding-bottom:8px}
.kb{display:flex;gap:10px;align-items:flex-start;min-height:60vh}
.lane{flex:0 0 250px;background:#eef2f1;border-radius:10px;padding:8px;max-height:74vh;display:flex;flex-direction:column}
.lane.lock{background:#fbeceb}
.lane .lh{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin-bottom:7px;padding:0 3px;flex:none}
.lane .lh .n{background:#fff;border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
.lane .ls{overflow-y:auto;flex:1;padding-right:2px}
.kc{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 9px;margin-bottom:6px;cursor:pointer;font-size:12.5px;border-left:4px solid var(--dn)}
.kc:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.kc.od{border-left-color:var(--od);background:#fef5f5}
.kc.d0{border-left-color:var(--d0)}
.kc.d1{border-left-color:var(--d1)}
.kc.d3{border-left-color:var(--d3)}
.kc .t{font-weight:700;font-size:13px;display:flex;gap:5px;align-items:center}
.kc .m{color:var(--muted);font-size:11.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .f{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap}
.kc .due{font-weight:700;font-size:11.5px}
.kc .due.od,.kc .due.d0{color:var(--d0)}
.kc .due.d1{color:var(--d1)}
.kc.compact{padding:5px 8px}
.kc.compact .m{display:none}
.kc .pin{color:var(--accent);font-size:11px}
.av{width:20px;height:20px;border-radius:99px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:none}
.av.sub{background:var(--faint)}
.diff{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:17px;border-radius:4px;font-size:10.5px;font-weight:700;background:#eef1f0;color:var(--muted);padding:0 4px}
.diff.hi{background:#fde8e8;color:var(--danger)}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--border)}
.tli{position:relative;padding-bottom:13px}
.tli::before{content:"";position:absolute;left:-18px;top:6px;width:9px;height:9px;border-radius:99px;background:var(--border);border:2px solid var(--surface)}
.tli.hi::before{background:var(--primary)}.tli.ap::before{background:var(--success)}
.tli.wn::before{background:var(--accent)}.tli.rf::before{background:#b45309}
.tli .tm{font-size:11px;color:var(--faint)}
.tli .tx{font-size:13px}.tli .who{font-weight:600}

.bar{height:7px;background:#eef1f0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar i.w{background:var(--accent)}.bar i.d{background:var(--danger)}
.score{font-size:24px;font-weight:700}
.stat{padding:13px 15px}
.stat .n{font-size:24px;font-weight:700;line-height:1.2}
.stat .l{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:30px 16px;color:var(--faint);font-size:13px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 13px;font-size:13px}
.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0}
.note{font-size:11.5px;color:var(--faint)}
code{background:var(--surface-2);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
pre{background:#16241f;color:#d7e5e0;border-radius:9px;padding:12px 14px;overflow-x:auto;font-size:12px;line-height:1.7;font-family:ui-monospace,Menlo,monospace}
.mask{position:fixed;inset:0;background:rgba(15,30,25,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:600px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
.modal.wide{max-width:880px}
/* 設定の一覧行（マスタ編集で共通に使う） */
.mrow{display:grid;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px}
.mrow+.mrow{margin-top:6px}
.mrow.hdrow{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:11.5px;border-style:dashed}
.swatch{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:5px}
/* 請求書プレビュー（PDF出力と同じレイアウト） */
.inv{background:#fff;border:1px solid #ccc;padding:26px 30px;max-width:720px;margin:0 auto;
  font-size:12px;line-height:1.7;color:#000}
.inv .ih{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.inv .ttl{font-size:21px;font-weight:700;letter-spacing:.22em;border-bottom:2px solid #000;padding-bottom:3px}
.inv .meta{font-size:11px;text-align:right;line-height:1.9}
.inv .to{font-size:14px;font-weight:700;border-bottom:1px solid #000;padding-bottom:3px;display:inline-block;min-width:250px}
.inv .total{border:2px solid #000;padding:7px 12px;font-size:17px;font-weight:700;display:inline-block;margin:12px 0}
.inv table{font-size:11.5px;margin-top:10px}
.inv th{background:#f0f0f0;color:#000;border:1px solid #999;padding:5px 7px;font-size:11px}
.inv td{border:1px solid #ccc;padding:5px 7px}
.inv .from{margin-top:20px;font-size:11px;border-top:1px solid #ccc;padding-top:10px}
.modal .mh{padding:15px 19px;border-bottom:1px solid var(--border-2);font-weight:700}
.modal .mb{padding:19px}
.modal .mf{padding:13px 19px;border-top:1px solid var(--border-2);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2);border-radius:0 0 14px 14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16241f;color:#fff;padding:10px 19px;border-radius:99px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.ph{background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;display:grid;place-items:center;color:var(--faint);font-size:11.5px;aspect-ratio:4/3}
.setnav{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.setnav a{padding:9px 13px;background:#fff;font-size:13px;cursor:pointer;color:var(--text)}
.setnav a:hover{background:var(--surface-2)}
.setnav a.on{background:var(--primary-soft);color:var(--primary-dark);font-weight:600}
/* 🖥 v0.6：工程ルート・ゾーン・作業時間・発注 */
.rt{display:flex;flex-wrap:wrap;align-items:center;gap:3px}
.rs{border:1px solid var(--border);border-radius:7px;padding:4px 9px;font-size:12px;
  background:var(--surface-2);color:var(--faint);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.rs.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-dark);font-weight:600}
.rs i{background:var(--primary);color:#fff;border-radius:99px;width:15px;height:15px;font-size:9.5px;
  font-style:normal;font-weight:700;display:grid;place-items:center}
.ra{color:var(--border);font-size:12px}
.wb{background:var(--surface-2);border-radius:99px;height:7px;overflow:hidden;min-width:48px}
.wf{height:100%;background:var(--primary);border-radius:99px}
.wf.q{background:var(--accent)}
.qbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.qbox .qh{padding:10px 14px;border-bottom:1px solid var(--border-2);font-size:12.5px;font-weight:700;background:var(--surface-2)}
.qbox .qb{padding:14px}
.brk{font-size:11.5px;color:var(--muted);line-height:1.85}
.brk .bi{display:flex;gap:8px}
.brk .bi span:last-child{margin-left:auto;color:var(--text)}
.pricerow{display:flex;font-size:13px;padding:3px 0}
.pricerow span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.pricerow.tot{border-top:1px solid var(--border);margin-top:7px;padding-top:9px;font-weight:700;font-size:15px}
ul.li{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.9}
ul.li li{margin:0}
/* 🏭 v0.7：一覧の並び替えと複数選択の絞り込み */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{background:var(--primary-soft)}
th.sortable.on{color:var(--primary-dark)}
th .sa{font-size:10px;opacity:.35;margin-left:3px}
th .sa.on{opacity:1;font-size:11px}
.fpanel{padding:11px 14px;border-top:1px solid var(--border-2);background:var(--surface-2)}
.fpanel .chips{gap:6px}
.chip .n{display:inline-block;margin-left:6px;background:var(--border);color:var(--text);
  border-radius:99px;padding:0 6px;font-size:10.5px;font-weight:700;min-width:17px;text-align:center}
.chip.on .n{background:var(--primary);color:#fff}
/* 納期のチップは残日数で色を付ける。超過が一目で分かるように */
.chip.dchip{padding:5px 10px;font-size:12.5px}
.chip.dchip.od{border-color:var(--danger);color:var(--danger)}
.chip.dchip.od.on{background:var(--danger);border-color:var(--danger);color:#fff}
.chip.dchip.od.on .n{background:rgba(255,255,255,.3)}
.chip.dchip.d0{border-color:var(--accent);color:#7c3d06}
.chip.dchip.d0.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.dchip.d0.on .n{background:rgba(255,255,255,.3)}
.chip.dchip.d1{border-color:#e0b04a}
.chip .av{width:16px;height:16px;font-size:8.5px;vertical-align:-3px;margin-right:2px}
/* 🏭 v0.7：現場サマリのマトリクス */
table.mx{font-size:12.5px}
table.mx th,table.mx td{text-align:center;padding:6px 8px;white-space:nowrap}
table.mx th:first-child,table.mx td:first-child{text-align:left}
table.mx thead th{background:var(--surface-2);font-size:11.5px}
table.mx thead th.od{background:var(--danger-soft);color:#8c1d18}
table.mx thead th.d0{background:var(--accent-soft);color:#7c3d06}
table.mx thead th.d1{background:#fdf6e3;color:#7a6a38}
table.mx tfoot td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--border)}
table.mx td.has.od{background:var(--danger-soft)}
table.mx td.has.d0{background:var(--accent-soft)}
table.mx td .z{color:var(--faint)}
.mxb{border:none;background:none;font-size:14px;font-weight:700;cursor:pointer;color:var(--text);
  padding:2px 8px;border-radius:6px;min-width:30px}
.mxb:hover{background:var(--primary);color:#fff}
.mxb.tot{color:var(--muted);font-size:13px}
table.mx .av{width:17px;height:17px;font-size:9px;vertical-align:-3px;margin-right:3px}
/* 発注書のモーダル内プレビュー。印刷レイアウトをそのまま縮小して見せる */
.poprev{border:1px solid var(--border);border-radius:9px;padding:14px;background:#fff;
  max-height:52vh;overflow:auto}
.poprev .inv{box-shadow:none;padding:0}
/* 🧑‍🔧 v0.8：難易度の★表示 */
.stars{white-space:nowrap;letter-spacing:-.5px;color:#e0a020;font-size:12px}
/* 🧑‍🔧 v0.8：画面内リンク（設定の別ページへ飛ばす） */
.lnk{color:var(--primary);cursor:pointer;font-weight:600;text-decoration:underline;
  text-decoration-style:dotted;text-underline-offset:2px}
.lnk:hover{color:var(--primary-dark)}
/* 🧑‍🔧 v0.8：細分工程の並び替え */
.sub-list{display:flex;flex-direction:column;gap:4px}

/* 運営側の resolveFee と同じロジック。技工所にも同じ数字が見えている必要がある */
function svcFee(c){
  const hit=SVC.rules.find(r=>
    (!r.cov||r.cov===c.cov)&&(!r.type||r.type===c.type)&&
    (r.amtMin==null||c.amount>=r.amtMin)&&(r.amtMax==null||c.amount<=r.amtMax));
  const m=hit||{mode:SVC.mode,percent:SVC.percent,flat:SVC.flat};
  let fee=m.mode==='PERCENT'?Math.round(c.amount*(m.percent/100)):(m.flat||0);
  let clamp=null;
  if(SVC.minFee!=null&&fee<SVC.minFee){fee=SVC.minFee;clamp='下限'}
  if(SVC.maxFee!=null&&fee>SVC.maxFee){fee=SVC.maxFee;clamp='上限'}
  return {fee,mode:m.mode,percent:m.percent,flat:m.flat,memo:hit?hit.memo:null,clamp};
}

         ★suspect（置き忘れ・推定）は除外し、件数を持ち帰る（BR-74・FR-PF-006） --- */
  const all=WORK_SESSIONS.filter(w=>w.case===c.id);
  const used=all.filter(w=>!w.suspect&&rateOf(w.who)!=null);
  const noRate=all.filter(w=>!w.suspect&&rateOf(w.who)==null);
  const laborLines=used.map(w=>({who:w.who,step:w.step,min:w.work,
    rate:rateOf(w.who),cost:Math.round(w.work/60*rateOf(w.who)),est:false}));
  /* ★仕掛かり中の案件は、通過済みの工程ぶんしか実測が無い。
     そのまま出すと「まだ手をかけていない案件ほど儲かっている」ように見える。
     ★未通過の工程は工程ごとの中央値で補い、推定であることを画面に出す（FR-PF-007）。
     本実装では case_margins を請求確定時に1回だけ書くので、この補完は起きない。
     デモは全件が仕掛かり中なので、比較できる形にするために補っている。 */
  const route=routeOf((v.route))||null;
  const path=route?route.steps:STEPS.map(x=>x.c);
  const doneSteps=new Set(used.map(w=>w.step));
  const avgRate=(()=>{const r=RATES.map(x=>x.rate);return r.length?r.reduce((a,b)=>a+b,0)/r.length:0})();
  for(const code of path){
    if(doneSteps.has(code))continue;
    const m=stepMedian(code);
    if(!m||!avgRate)continue;
    const min=Math.round(m*(1+((c.units||1)-1)*0.55));
    laborLines.push({who:null,step:code,min,rate:Math.round(avgRate),
      cost:Math.round(min/60*avgRate),est:true});
  }
  const labor=laborLines.reduce((a,x)=>a+x.cost,0);
  const estSteps=laborLines.filter(x=>x.est).length;
  /* --- 材料費。★価格・使用量が未登録のものは 0円 にせず「不明」に積む --- */
  const matLines=[],missing=[];
  for(const u of USAGE.filter(x=>x.v===c.variant)){
    const p=prefPrice(u.mat);
    if(!p){missing.push(matOf(u.mat).name);continue}
    const qty=u.qty*(c.units||1);
    /* ★仕入単位へ換算する。qty は使用量の単位（g・個・枚）、p.price は仕入単位あたり */
    const packs=qty/(u.pack||1);
    matLines.push({mat:u.mat,name:matOf(u.mat).name,qty:+qty.toFixed(2),unit:u.unit,
      packs:+packs.toFixed(3),price:p.price,per:p.unit,cost:Math.round(packs*p.price)});
  }
  if(!USAGE.some(x=>x.v===c.variant))missing.push((v.type||'この技工物')+'（使用量が未登録）');
  const material=matLines.reduce((a,x)=>a+x.cost,0)+CONSUMABLE_PER_CASE;
  const gp=revenue-labor-material;
  return {revenue,labor,material,gp,
    pct:revenue>0?gp/revenue*100:null,        /* ★売上0のとき null。0% と出さない */
    laborLines,matLines,missing,
    excluded:all.filter(w=>w.suspect).length, /* ★捨てた件数（BR-74） */
    noRate:noRate.length,
    estSteps,                                  /* ★推定で補った工程数 */
    source:estSteps===0?'MEASURED':(used.length?'PARTIAL':'ESTIMATED'),
    sessions:used.length};
}
/* 工程ごとの実作業時間の中央値。★suspect は除く（BR-74）。呼ばれるたびに数えないようキャッシュ */
let _stepMed=null;
function stepMedian(code){
  if(!_stepMed){
    _stepMed={};
    for(const w of WORK_SESSIONS){
      if(w.suspect)continue;
      (_stepMed[w.step]=_stepMed[w.step]||[]).push(w.work);
    }
    for(const k in _stepMed){
      const a=_stepMed[k].sort((x,y)=>x-y);
      _stepMed[k]=a.length?a[Math.floor(a.length/2)]:0;
    }
  }
  return _stepMed[code]||0;
}
/* 採算を出せる状態か。★未入力なら画面ごと出さない（FR-PF-004）
   「当てずっぽうの原価は、無いより悪い」（原則48） */

/* 集計。key ごとに合算する。★件数が minSamples 未満なら率を出さない（FR-PF-021） */
function marginBy(keyFn,labelFn,list){
  const m={};
  for(const c of (list||CASES)){
    const k=keyFn(c); if(k==null)continue;
    const g=marginOf(c);
    if(!g.sessions)continue;                  /* 実作業の記録が無い案件は入れない */
    (m[k]=m[k]||{k,label:labelFn(c),n:0,revenue:0,labor:0,material:0,gp:0,min:0})
    m[k].n++; m[k].revenue+=g.revenue; m[k].labor+=g.labor;
    m[k].material+=g.material; m[k].gp+=g.gp;
    m[k].min+=g.laborLines.reduce((a,x)=>a+x.min,0);
  }
  return Object.values(m).map(r=>({...r,
    pct:r.n>=CFG.minSamples&&r.revenue>0?r.gp/r.revenue*100:null,
    perHour:r.n>=CFG.minSamples&&r.min>0?Math.round(r.gp/(r.min/60)):null}))
    .sort((a,b)=>b.gp-a.gp);
}

/* 工程ごとの目安（分）。実測が溜まるまでは技工物の難易度から作る */

  EXPORT:6,NESTING:9,MILLING:26,ADJUST:17,FINISHING:62,QC:9,SHIPPING:7};
/* 工程ごとの待ち時間の目安（分）。担当者が限られる工程・機械待ちの工程は長い */
const QUEUE_BASE={INTAKE:14,CLARIFY:120,WAXUP:80,SCAN:38,DESIGN:180,DESIGN_REVIEW:260,
  EXPORT:20,NESTING:35,MILLING:145,ADJUST:55,FINISHING:70,QC:18,SHIPPING:12};
/* スタッフの速さの癖。1.0 が標準。工程ごとに得意不得意がある */
const STAFF_SKEW={
  s3:{DESIGN:0.82,SCAN:0.90,FINISHING:1.18,CASTING:1.22},
  s4:{CASTING:0.84,FINISHING:0.88,DESIGN:1.26,SCAN:1.15},
  s5:{MODEL:0.86,QC:0.80,MILLING:0.94,DESIGN:1.05}
};
let WORK_SESSIONS=[];
function genWork(){
  WORK_SESSIONS=[];
  const staff=['s3','s4','s5'];
  let id=0;
  for(const c of CASES){
    const route=routeOf(variantOfId(c.variant).route);
    const path=route?route.steps:STEPS.map(s=>s.c);
    /* 現在の工程まで（通過済みの工程）についてセッションを作る */
    for(const code of path){
      const i=stepIdx(code);
      if(i<0||i>=c.step)continue;
      const who=(c.assign.find(a=>a.p===code)||c.assign.find(a=>a.r==='MAIN')||{}).s||pick(staff);
      const base=STEP_BASE[code]||20;
      const skew=(STAFF_SKEW[who]&&STAFF_SKEW[who][code])||1.0;
      const size=1+(c.units-1)*0.55;
      let work=Math.round(base*skew*size*(0.72+rnd()*0.6));
      /* 待ちは工程ごとに詰まり方が違う。人手が1人しかいない工程は長く待つ。
         ここが実作業より長い工程は「人手ではなく段取りの問題」として画面に出す */
      let queue=Math.round(QUEUE_BASE[code]*(0.5+rnd()*1.1)*(c.isRush?0.2:1));
      /* 1割ほど、置き忘れ・昼休み跨ぎで実態と合わない記録が混ざる */
      let suspect=false;
      if(rnd()<0.09){ work=work+Math.round(60+rnd()*300); suspect=true; }
      else if(rnd()<0.03){ work=1; suspect=true; }
      WORK_SESSIONS.push({id:'ws'+(++id),case:c.id,step:code,
        area:(areaOfStep(code)||{id:null}).id,
        zone:(ZONES.find(z=>z.step===code)||{id:null}).id,
        who,queue,work,suspect,
        at:fmt(addDays(TODAY,-ri(0,26)))});
    }
  }
  _stepMed=null;   /* 🧑‍🔧 v0.8.1 規模を切り替えたら中央値のキャッシュを捨てる */
  genMonths();
}

/* ============================================================
   🧑‍🔧 v0.8 月次の集計（ご回答 #37・#40）

   > 「月一回でいい。数字も欲しいが、直感的に分かるグラフにしてもらえるとありがたい」

   ★本実装では case_work_sessions を月で集約する。
     デモでは直近の月だけを実データ（WORK_SESSIONS）から作り、
     それ以前の5か月は傾向を見せるために生成している。画面にもそう明記する。
   ★グラフは自前の SVG で描く。外部ライブラリは足さない。
   ============================================================ */
const MONTH_N=6;
let MONTHS=[];
function genMonths(){
  /* ★ med() はこの下で const 宣言されるため、ここから呼ぶと TDZ になる。
     genWork() は読み込み時に走るので、中央値はローカルに持つ */
  const mid=a=>{if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y);
    const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2)};
  /* ★記録が1件もない担当は月次に出さない。
     0分の点を打つと「急に速くなった」ように見えてしまう（小規模ラボでは全員に案件が回らない） */
  const staff=STAFF.filter(s=>s.role==='LAB_STAFF'&&
    WORK_SESSIONS.some(w=>w.who===s.id&&!w.suspect)).map(s=>s.id);
  /* 直近の月＝TODAY の月。そこから遡って MONTH_N か月 */
  const keys=[];
  for(let i=MONTH_N-1;i>=0;i--){
    const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);
    keys.push({k:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,
               l:`${d.getMonth()+1}月`,cur:i===0});
  }
  MONTHS=keys.map((m,mi)=>{
    const row={key:m.k,label:m.l,cur:m.cur,by:{}};
    staff.forEach(sid=>{
      if(m.cur){
        /* 直近の月は実データから作る */
        const a=WORK_SESSIONS.filter(w=>w.who===sid&&!w.suspect);
        row.by[sid]={n:a.length,work:mid(a.map(w=>w.work)),queue:mid(a.map(w=>w.queue))};
      }else{
        /* それ以前は「少しずつ速くなってきた」傾向を作る。月が古いほど遅い */
        const back=MONTH_N-1-mi;
        const a=WORK_SESSIONS.filter(w=>w.who===sid&&!w.suspect);
        const base=mid(a.map(w=>w.work))||30, q=mid(a.map(w=>w.queue))||40;
        const f=1+back*0.055+(rnd()-0.5)*0.08;
        row.by[sid]={n:Math.max(1,Math.round(a.length*(0.8+rnd()*0.45))),
          work:Math.round(base*f),queue:Math.round(q*(1+back*0.03+(rnd()-0.5)*0.12))};
      }
    });
    return row;
  });
}
/* ★呼び出しはここ。genWork() の末尾が genMonths() を呼ぶので、

   🏭 v0.7 集計期間（レビュー指摘）

   ★全期間（TOTAL）だけでは「成長したか」が分からない。
     期間を指定でき、さらに「前の同じ長さの期間」と比較できるようにする。
   ★比較は件数が少ないと意味を持たないので、
     どちらかの期間が minSamples 未満なら差を出さない。
   ============================================================ */
const WT_RANGES=[
  {k:'all', l:'全期間', d:null},
  {k:'d7',  l:'直近7日',  d:7},
  {k:'d14', l:'直近14日', d:14},
  {k:'d30', l:'直近30日', d:30}
];
/* 期間の [from,to]（両端含む・YYYY-MM-DD）。null なら全期間 */
function wtRange(k,shift){
  const r=WT_RANGES.find(x=>x.k===(k||S.wtRange||'all'));
  if(!r||!r.d)return null;
  const off=(shift||0)*r.d;
  const to=fmt(addDays(TODAY,-off));
  const from=fmt(addDays(TODAY,-off-r.d+1));
  return {from,to,days:r.d,label:r.l};
}
const inRange=(w,rg)=>!rg||(w.at>=rg.from&&w.at<=rg.to);
/* 現在の期間（shift=0）と、その1つ前の同じ長さの期間（shift=1） */
const sessionsIn=(rg)=>WORK_SESSIONS.filter(w=>inRange(w,rg));
const validSessions=(rg)=>sessionsIn(rg===undefined?wtRange():rg).filter(w=>!w.suspect);
const suspectCount=(rg)=>sessionsIn(rg===undefined?wtRange():rg).filter(w=>w.suspect).length;
const med=a=>{if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y);
  const m=Math.floor(s.length/2);return s.length%2?s[m]:Math.round((s[m-1]+s[m])/2)};
/* 工程 × 担当 の実作業時間の中央値。★件数が minSamples 未満なら出さない（BR-22） */
function workStat(stepCode,who,rg){
  const a=validSessions(rg===undefined?wtRange():rg)
    .filter(w=>(!stepCode||w.step===stepCode)&&(!who||w.who===who));
  if(a.length<CFG.minSamples)return {n:a.length,work:null,queue:null,enough:false};
  return {n:a.length,work:med(a.map(w=>w.work)),queue:med(a.map(w=>w.queue)),enough:true};
}
/* ============================================================
   🏭 技工物種別ごとの得意・不得意（レビュー指摘）

   ★工程ごとの評価だけでは「クラウンは速いが義歯は遅い」が見えない。
     RFID の記録には案件が紐付いているので、技工物種別で切り直せる。
     教育に使うには「何が得意か」より「何が伸びたか」のほうが効く。
   ★工程数が技工物によって違うため、合計時間では比べられない。
     「1工程あたりの実作業時間」を全体中央値と比べる（工程ごとの評価と同じ考え方）。
   ============================================================ */
/* 作業セッションに案件の属性（技工物種別・難易度）を付ける */
function prodSessions(rg){
  const out=[];
  for(const w of validSessions(rg)){
    const c=findCase(w.case);
    if(c)out.push({who:w.who,step:w.step,work:w.work,queue:w.queue,
      type:c.type,variant:c.variant,diff:c.diff,cov:c.cov});
  }
  return out;
}
/* 技工物種別 × 担当。work は「1工程あたり」の中央値 */
function prodStat(type,who,rg){
  const a=prodSessions(rg===undefined?wtRange():rg)
    .filter(w=>(!type||w.type===type)&&(!who||w.who===who));
  if(a.length<CFG.minSamples)return {n:a.length,work:null,enough:false};
  return {n:a.length,work:med(a.map(w=>w.work)),enough:true};
}
/* 技工物種別の前期間比較。★「技術が向上したか」はここで見る */
function prodDelta(type,who){
  const rg=wtRange();
  if(!rg)return null;
  const cur=prodStat(type,who,rg);
  const prv=prodStat(type,who,wtRange(null,1));
  if(!cur.enough||!prv.enough)return {enough:false,curN:cur.n,prvN:prv.n};
  const d=cur.work-prv.work;
  return {enough:true,cur:cur.work,prv:prv.work,d,
    pct:prv.work?Math.round(d/prv.work*100):0};
}
/* 記録がある技工物種別（多い順） */
function prodTypes(rg){
  const m={};
  prodSessions(rg===undefined?wtRange():rg).forEach(w=>{m[w.type]=(m[w.type]||0)+1});
  return Object.keys(m).sort((a,b)=>m[b]-m[a]);
}
/* 難易度帯。技工物種別と併せて見ると「難しいものが苦手」なのか
   「特定の技工物が苦手」なのかを切り分けられる */
const DIFF_BANDS=[{k:'lo',l:'やさしい（〜19）',f:d=>d<20},
  {k:'mid',l:'標準（20〜34）',f:d=>d>=20&&d<35},
  {k:'hi',l:'難しい（35〜）',f:d=>d>=35}];
function diffStat(band,who,rg){
  const b=DIFF_BANDS.find(x=>x.k===band);
  const a=prodSessions(rg===undefined?wtRange():rg)
    .filter(w=>(!band||b.f(w.diff))&&(!who||w.who===who));
  if(a.length<CFG.minSamples)return {n:a.length,work:null,enough:false};
  return {n:a.length,work:med(a.map(w=>w.work)),enough:true};
}

/* 前の期間との比較。改善なら negative（時間が短くなった）を good として扱う */
function workDelta(stepCode,who){
  const rg=wtRange();
  if(!rg)return null;                      /* 全期間では比較しない */
  const cur=workStat(stepCode,who,rg);
  const prv=workStat(stepCode,who,wtRange(null,1));
  if(!cur.enough||!prv.enough)return {enough:false,curN:cur.n,prvN:prv.n};
  const d=cur.work-prv.work;
  return {enough:true,cur:cur.work,prv:prv.work,d,
    pct:prv.work?Math.round(d/prv.work*100):0};
}

function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

/* 画面遷移。ブラウザバック相当を成立させるため履歴を積む（A-6）。 */
function go(r,p,sub){
  const np=p||null;
  if(S.route!==r||S.param!==np)S.hist.push({r:S.route,p:S.param,s:S.sub});
  S.route=r;S.param=np;if(sub!==undefined)S.sub=sub;window.scrollTo(0,0);render();
}
function back(){
  const h=S.hist.pop();
  if(h){S.route=h.r;S.param=h.p;S.sub=h.s}else{S.route='dashboard';S.param=null}
  window.scrollTo(0,0);render();
}
function backBtn(){return `<button class="btn sm" onclick="back()" title="直前の画面に戻ります">← 戻る</button>`}

function dueTxt(due){const d=daysTo(due);const j=fmtJ(new Date(due+'T00:00:00+09:00'));
  return d<0?`${j} 超過${-d}日`:d===0?`${j} 本日`:d===1?`${j} 明日`:`${j} 残${d}日`}
/* 医院に見せる納期は「着」を付ける。技工所の中では発送日で話す（ご回答 #7・#45） */

   納期（医院への到着日）は併記する。CFG.showShipDate で切り替えられる。
   ============================================================ */
const shipOf=c=>c.ship||fmt(addDays(new Date(c.due+'T00:00:00+09:00'),-1));

  const j=fmtJ(new Date(s+'T00:00:00+09:00'));
  return d<0?`${j} 超過${-d}日`:d===0?`${j} 本日発送`:d===1?`${j} 明日発送`:`${j} 残${d}日`}

}

/* ============================================================
   カンバン（🏭 v0.7 でレビュー指摘を反映）

   ★絞り込みから「工程」「工程ルート」を外した。
     グルーピングで既に列に分かれているので、同じ軸で絞ると
     列が1本になるだけで情報が減る。担当と納期は逆で、
     絞っても列構成が残るため「急ぎがどの工程にいるか」が見える。

   ★代わりに「現場サマリ」を置いた。目的が2つある。
     - 管理者：いま現場がどうなっているか（誰の持ち分に急ぎが何件あるか）
     - スタッフ：自分の仕事があとどれだけあるか
                 （手元に溜まっている分と、これから来る分を納期別に）
   ============================================================ */
const DUE_BUCKETS=[
  {k:'od',   l:'超過',     cls:'od', f:d=>d<0},
  {k:'d0',   l:'本日',     cls:'d0', f:d=>d===0},
  {k:'d1',   l:'明日',     cls:'d1', f:d=>d===1},
  {k:'d3',   l:'3日以内',  cls:'d3', f:d=>d>=2&&d<=3},
  {k:'later',l:'それ以降', cls:'',   f:d=>d>3}
];
const bucketOf=due=>{const d=daysTo(due);return (DUE_BUCKETS.find(b=>b.f(d))||DUE_BUCKETS[4]).k};
/* その区分に該当する納期の実日付。クリックで絞り込むときに使う */
function bucketDates(k){
  const b=DUE_BUCKETS.find(x=>x.k===k);
  return [...new Set(visibleCases().filter(c=>c.step<STEPS.length&&b.f(daysTo(c.due))).map(c=>c.due))];
}

/* ---------- スタッフ視点：その案件は「手元」か「これから」か ----------
   自分の対応工程（スタッフ技能）を基準に判定する。
   PROCESS アサインなら、その工程だけが自分の担当区間。 */
function myPhase(c,who){
  const me=who||S.me;
  const a=c.assign.find(x=>x.s===me);
  if(!a)return null;
  const sk=SKILLS[me]||{};
  const mySteps=a.r==='PROCESS'?[a.p]:Object.keys(sk).filter(k=>k!=='maxStar');
  const idxs=mySteps.map(stepIdx).filter(i=>i>=0);
  if(!idxs.length)return 'now';                 /* 技能が未登録なら手元として扱う */
  if(idxs.includes(c.step))return 'now';        /* いま自分の工程にある＝着手できる */
  if(idxs.some(i=>i>c.step))return 'soon';      /* まだ前工程。これから回ってくる */
  return 'done';                                /* 自分の工程は通過済み */
}

/* ---------- 現場サマリ ---------- */
function boardSummary(){
  const wip=visibleCases().filter(c=>c.step<STEPS.length);
  return isStaff()?staffSummary(wip):overseerSummary(wip);

/* 管理者・マネージャー向け：納期区分 × 担当。
   セルを押すとその担当・その納期区分で絞り込む */
function overseerSummary(wip){
  const rows=STAFF.filter(s=>s.role==='LAB_STAFF').map(s=>({id:s.id,name:s.name}));
  rows.push({id:'none',name:'未割当'});
  const cell=(sid,bk)=>wip.filter(c=>
    (sid==='none'?!c.assign.length:c.assign.some(a=>a.s===sid))&&bucketOf(c.due)===bk).length;
  const colTot=bk=>wip.filter(c=>bucketOf(c.due)===bk).length;
  const rowTot=sid=>wip.filter(c=>sid==='none'?!c.assign.length:c.assign.some(a=>a.s===sid)).length;
  const stuck=STEPS.map((s,i)=>({s,n:wip.filter(c=>c.step===i).length}))
    .sort((a,b)=>b.n-a.n).slice(0,4);
  return `
  <div class="card mb"><div class="hdr"><h3>現場の状況</h3>
    <span class="note">進行中 ${wip.length}件</span><span class="sp"></span>
    <span class="note">数字を押すと絞り込みます</span>
    <button class="btn sm" onclick="S.sumOpen=!S.sumOpen;render()">${S.sumOpen===false?'開く':'閉じる'}</button></div>
    ${S.sumOpen===false?'':`<div class="bd">
      <div class="tw"><table class="mx">
        <thead><tr><th>担当</th>
          ${DUE_BUCKETS.map(b=>`<th class="${b.cls}">${b.l}</th>`).join('')}
          <th>合計</th></tr></thead>
        <tbody>${rows.map(r=>`<tr>
          <td><b>${r.id==='none'?'':av(r.id)} ${esc(r.name)}</b></td>
          ${DUE_BUCKETS.map(b=>{const n=cell(r.id,b.k);
            return `<td class="${b.cls} ${n?'has':''}">${n
              ?`<button class="mxb" onclick="boardPick('${r.id}','${b.k}')">${n}</button>`
              :'<span class="z">—</span>'}</td>`}).join('')}
          <td><button class="mxb tot" onclick="boardPick('${r.id}',null)">${rowTot(r.id)}</button></td>
        </tr>`).join('')}</tbody>
        <tfoot><tr><td>合計</td>
          ${DUE_BUCKETS.map(b=>`<td class="${b.cls}">
            <button class="mxb tot" onclick="boardPick(null,'${b.k}')">${colTot(b.k)}</button></td>`).join('')}
          <td><button class="mxb tot" onclick="boardPick(null,null)">${wip.length}</button></td></tr></tfoot>
      </table></div>
      <div class="row mt" style="gap:14px;flex-wrap:wrap">
        <span class="note">滞留の多い工程</span>
        ${stuck.map(x=>`<button class="btn sm" onclick="setB('group','step');render()">
          ${esc(x.s.n)} <b>${x.n}</b></button>`).join('')}
      </div>
    </div>`}
  </div>`;
}

/* スタッフ向け：手元 ／ これから来る × 納期区分。
   「自分の仕事があとどのくらいあるか」に直接答える */
function staffSummary(wip){
  const mine=wip.filter(c=>c.assign.some(a=>a.s===S.me));
  const phase=k=>mine.filter(c=>myPhase(c)===k);
  const now=phase('now'), soon=phase('soon');
  const cell=(arr,bk)=>arr.filter(c=>bucketOf(c.due)===bk).length;
  const line=(label,arr,hint,pk)=>`<tr>
    <td><b>${label}</b><div class="note">${hint}</div></td>
    ${DUE_BUCKETS.map(b=>{const n=cell(arr,b.k);
      return `<td class="${b.cls} ${n?'has':''}">${n
        ?`<button class="mxb" onclick="boardPick('${S.me}','${b.k}','${pk}')">${n}</button>`
        :'<span class="z">—</span>'}</td>`}).join('')}
    <td><button class="mxb tot" onclick="boardPick('${S.me}',null,'${pk}')">${arr.length}</button></td></tr>`;
  const odNow=now.filter(c=>bucketOf(c.due)==='od').length;
  const todayNow=now.filter(c=>bucketOf(c.due)==='d0').length;
  return `
  <div class="card mb"><div class="hdr"><h3>あなたの仕事</h3>
    <span class="note">担当 ${mine.length}件</span><span class="sp"></span>
    <span class="note">数字を押すと絞り込みます</span></div>
    <div class="bd">
      ${odNow||todayNow?`<div class="alert ${odNow?'dgr':'warn'} mb" style="font-size:12.5px">
        手元に <b>${odNow?`納期を超過した ${odNow}件`:''}${odNow&&todayNow?'と':''}${todayNow?`本日納期の ${todayNow}件`:''}</b>
        があります。まずここから着手してください。</div>`:''}
      <div class="tw"><table class="mx">
        <thead><tr><th style="min-width:150px">状態</th>
          ${DUE_BUCKETS.map(b=>`<th class="${b.cls}">${b.l}</th>`).join('')}
          <th>合計</th></tr></thead>
        <tbody>
          ${line('手元にある',now,'いま自分の工程にあり、着手できるもの','now')}
          ${line('これから来る',soon,'まだ前工程。回ってくるのを待っているもの','soon')}
        </tbody>
        <tfoot><tr><td>合計</td>
          ${DUE_BUCKETS.map(b=>`<td class="${b.cls}">${cell(now,b.k)+cell(soon,b.k)}</td>`).join('')}
          <td>${now.length+soon.length}</td></tr></tfoot>
      </table></div>
      <p class="note mt">
        「手元にある」＝現在の工程があなたの対応工程（スタッフ技能）に含まれるもの。<br>
        「これから来る」＝まだ前の工程にあり、あなたの工程に回ってくるもの。
        前工程が詰まっていると、ここが増えます。</p>
    </div></div>`;
}
/* サマリのセルから絞り込む。押した意図（誰の・いつ・どの状態）をそのまま盤面に反映する */
function boardPick(who,bucket,phase){
  S.board.who=who||null;
  S.board.dues=bucket?bucketDates(bucket):[];
  S.board.phase=phase||null;
  S.board.mine=false;
  render();
}

function vBoard(){
  const B=S.board;
  let cs=visibleCases().filter(c=>c.step<STEPS.length);
  if(B.mine)cs=cs.filter(c=>c.assign.some(a=>a.s===S.me));
  /* 担当は絞り込み（N-9）。'none' は未割当 */
  if(B.who==='none')cs=cs.filter(c=>!c.assign.length);
  else if(B.who)cs=cs.filter(c=>c.assign.some(a=>a.s===B.who));
  /* 納期は複数選択できる。「本日と明日をまとめて見たい」に応えるため */
  if(B.dues.length)cs=cs.filter(c=>B.dues.includes(c.due));
  /* 手元／これから（スタッフのサマリから飛んできたとき） */
  if(B.phase&&B.who)cs=cs.filter(c=>myPhase(c,B.who)===B.phase);

  const sortFn=(a,b)=>{
    if(a.prio!==null&&b.prio===null)return -1;
    if(a.prio===null&&b.prio!==null)return 1;
    if(a.prio!==null&&b.prio!==null)return a.prio-b.prio;
    if(a.due!==b.due)return a.due<b.due?-1:1;
    return caseStar(b)-caseStar(a);
  };

  let lanes;
  if(B.group==='product'){
    const keys=[...new Set(cs.map(c=>c.mat))];
    lanes=keys.map(k=>({key:k,title:k,items:cs.filter(c=>c.mat===k).sort(sortFn)}));
  }else if(B.group==='clinic'){
    const keys=[...new Set(cs.map(c=>c.clinic))];
    lanes=keys.map(k=>({key:k,title:clinicOf(k).name,items:cs.filter(c=>c.clinic===k).sort(sortFn)}));
  }else if(B.group==='route'){
    const keys=[...new Set(cs.map(c=>variantOf(c).route))];
    lanes=keys.filter(Boolean).map(k=>({key:k,title:(routeOf(k)||{name:'—'}).name,
      items:cs.filter(c=>variantOf(c).route===k).sort(sortFn)}));
  }else if(B.group==='due'){
    /* 納期区分でまとめる。急ぎの塊がそのまま列になる */
    lanes=DUE_BUCKETS.map(b=>({key:b.k,title:b.l,
      items:cs.filter(c=>bucketOf(c.due)===b.k).sort(sortFn)})).filter(l=>l.items.length);
  }else{
    lanes=STEPS.map((st,i)=>({key:'s'+i,title:st.n,lock:!st.chg,items:cs.filter(c=>c.step===i).sort(sortFn)}));
  }

  const sug=suggest();
  const dueLabel=B.dues.length?`納期 ${B.dues.length}日`:'納期';
  const staffs=STAFF.filter(s=>s.role==='LAB_STAFF');

  return `
  <div class="row mb"><h1 style="margin:0">案件ボード</h1>
    <span class="note">${cs.length}件</span><span class="sp"></span>
    <div class="seg">
      <button class="${B.group==='step'?'on':''}" onclick="setB('group','step')">工程</button>
      <button class="${B.group==='due'?'on':''}" onclick="setB('group','due')">納期</button>
      <button class="${B.group==='product'?'on':''}" onclick="setB('group','product')">製品</button>
      <button class="${B.group==='clinic'?'on':''}" onclick="setB('group','clinic')">医院</button>
      <button class="${B.group==='route'?'on':''}" onclick="setB('group','route')">工程ルート</button>
    </div>
    <div class="seg"><button class="${B.dense?'':'on'}" onclick="setB('dense',false)">詳細</button>
      <button class="${B.dense?'on':''}" onclick="setB('dense',true)">コンパクト</button></div>
  </div>

  ${boardSummary()}

  <div class="card mb"><div class="bd row">
    <span class="note">絞り込み</span>
    <select style="width:auto" onchange="setB('who',this.value||null)">
      <option value="">担当：すべて</option>
      ${staffs.map(s=>`<option value="${s.id}" ${B.who===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
      <option value="none" ${B.who==='none'?'selected':''}>未割当</option>
    </select>
    <button class="btn sm ${B.dues.length?'pri':''}" onclick="S.bDue=!S.bDue;render()">
      ${esc(dueLabel)} ${S.bDue?'▲':'▼'}</button>
    ${B.phase?`<span class="b prog">${B.phase==='now'?'手元にあるもの':'これから来るもの'}</span>`:''}
    <span class="sp" style="flex:1"></span>
    ${isOverseer()?`<div class="seg"><button class="${B.mine?'':'on'}" onclick="setB('mine',false)">全件</button>
      <button class="${B.mine?'on':''}" onclick="setB('mine',true)">自分</button></div>`:''}
    ${(B.who||B.dues.length||B.mine||B.phase)?`<button class="btn sm" onclick="resetB()">絞り込みを解除</button>`:''}
  </div>
  ${S.bDue?`<div class="fpanel">
    <div class="row mb"><b style="font-size:12.5px">納期で絞り込み</b>
      <span class="note">複数選べます</span><span class="sp" style="flex:1"></span>
      ${DUE_BUCKETS.map(b=>`<button class="btn sm" onclick="S.board.dues=bucketDates('${b.k}');render()">${b.l}</button>`).join('')}
      <button class="btn sm" onclick="S.board.dues=[];render()">すべて</button></div>
    <div class="chips">${(()=>{
      const m={};visibleCases().filter(c=>c.step<STEPS.length).forEach(c=>{m[c.due]=(m[c.due]||0)+1});
      return Object.keys(m).sort().map(d=>{
        const days=daysTo(d),on=B.dues.includes(d);
        const t=days<0?'od':days===0?'d0':days===1?'d1':days<=3?'d3':'';
        const lb=days<0?`超過 ${-days}日`:days===0?'本日':days===1?'明日':fmtJ(new Date(d+'T00:00:00+09:00'));
        return `<button class="chip dchip ${t} ${on?'on':''}" onclick="toggleBDue('${d}')">
          ${lb}<span class="n">${m[d]}</span></button>`}).join('')})()}</div>
  </div>`:''}
  </div>

  ${B.who&&B.who!=='none'?`<p class="note mb">
    ${esc(staffOf(B.who).name)} の担当案件${B.phase?`（${B.phase==='now'?'手元にあるもの':'これから来るもの'}）`:''}を、
    ${B.group==='step'?'工程':B.group==='due'?'納期':B.group==='product'?'製品':B.group==='clinic'?'医院':'工程ルート'}ごとに分けています</p>`:''}

  ${sug?`<div class="alert warn mb row">
    <div style="flex:1">${sug.text}</div>
    <button class="btn sm" onclick="S.board.dues=['${sug.date}'];render()">まとめて表示</button></div>`:''}

  <div class="kbwrap"><div class="kb">
    ${lanes.map(l=>`<div class="lane ${l.lock?'lock':''}">
      <div class="lh"><span>${esc(l.title)}</span><span class="n">${l.items.length}</span>
        ${l.lock?'<span style="margin-left:auto;font-size:11px;color:var(--danger)">変更不可</span>':''}</div>
      <div class="ls">${l.items.map((c,idx)=>card(c,idx,l.items.length)).join('')||'<div class="note" style="padding:8px">なし</div>'}</div>
    </div>`).join('')||'<div class="empty">該当する案件はありません</div>'}
  </div></div>`;
}
function toggleBDue(d){
  const a=S.board.dues,i=a.indexOf(d);
  i<0?a.push(d):a.splice(i,1);render();
}

function card(c,idx,total){
  const t=tone(c.due);
  return `<div class="kc ${t} ${S.board.dense?'compact':''}" onclick="go('case','${c.id}')">
    <div class="t">${c.prio!==null?'<span class="pin">📌</span>':''}${esc(c.patient)}様
      ${c.isRush?'<span class="b wait">特急</span>':''}</div>
    <div class="m">${esc(clinicOf(c.clinic).name)}</div>
    <div class="m">${esc(c.type)} ${esc(c.mat)}${c.units>1?' ×'+c.units:''}</div>
    <div class="f">
      ${covB(c.cov)}
      ${CFG.showShipDate
        ?`<span class="due ${shipTone(c)}" title="発送日">🚚 ${shipTxt(c)}</span>`
        :`<span class="due ${t}">${dueTxt(c.due)}</span>`}
      <span class="sp"></span>
      ${starHtml(caseStar(c))}
      ${c.assign.map(a=>av(a.s,a.r!=='MAIN')).join('')}
    </div>
    ${CFG.showShipDate?`<div class="m" style="font-size:10.5px">医院着 ${dueLabel(c.due)}</div>`:''}
    ${!S.board.dense&&isOverseer()?`<div class="f" onclick="event.stopPropagation()">
      <button class="btn sm" style="padding:1px 6px;font-size:11px" onclick="movePrio('${c.id}',-1)">↑</button>
      <button class="btn sm" style="padding:1px 6px;font-size:11px" onclick="movePrio('${c.id}',1)">↓</button>
      ${c.tray?`<span class="note">${esc(c.tray)}</span>`:''}
    </div>`:''}
  </div>`;
}
function setB(k,v){S.board[k]=v;render()}
function resetB(){S.board.mine=false;S.board.who=null;S.board.dues=[];S.board.phase=null;render()}
function movePrio(id,dir){
  const c=findCase(id);
  const peers=CASES.filter(x=>x.step===c.step).sort((a,b)=>
    (a.prio??999)-(b.prio??999)||(a.due<b.due?-1:1));
  peers.forEach((p,i)=>p.prio=i);
  const i=peers.indexOf(c),j=i+dir;
  if(j<0||j>=peers.length)return;
  [peers[i].prio,peers[j].prio]=[peers[j].prio,peers[i].prio];
  toast('優先順位を変更しました');
}
function suggest(){
  const tomorrow=fmt(addDays(TODAY,1));
  const t=CASES.filter(c=>c.due===tomorrow&&c.step>=3&&c.step<LAST());
  if(t.length<3)return null;
  const mats=[...new Set(t.map(c=>c.mat))];
  const m=mats[0];
  const later=CASES.filter(c=>c.mat===m&&c.due>tomorrow&&c.due<=fmt(addDays(TODAY,3))&&c.step>=3&&c.step<LAST());
  if(!later.length)return null;
  return {date:tomorrow,
    text:`明日発送の${t.length}件に加えて、${later.length}件が同じ「${esc(m)}」です。まとめて加工すると効率的です。`};
}

/* ============================================================
   案件一覧・詳細
   ============================================================ */
/* 一覧のフィルタ。ダッシュボードの各ブロックから絞り込んで飛んでくる（A-5） */
/* ============================================================
   案件一覧の絞り込みと並び替え（🏭 v0.7 でレビュー指摘を反映）

   ★納期と担当は「複数選択」できる。1つだけ選ぶ形だと
     「明日と明後日の分をまとめて見たい」「あの2人の分を見たい」ができない。
   ★並び替えは受注順（既定）と納期順を切り替えられる。
   ============================================================ */
const F={clinic:null,step:null,cov:null,dues:[],staff:[],q:'',
  sortKey:'no',sortDir:'asc',open:null};

function filterByClinic(id){resetF();F.clinic=id;S.sel=[];go('cases')}
function filterByStep(i){resetF();F.step=i;S.sel=[];go('cases')}
/* 納期を指定して一覧へ飛ぶ（ダッシュボード・案件ボードからの導線） */
function filterByDue(dates){resetF();F.dues=[].concat(dates);F.sortKey='due';F.sortDir='asc';S.sel=[];go('cases')}
function filterByStaff(ids){resetF();F.staff=[].concat(ids);F.sortKey='due';F.sortDir='asc';S.sel=[];go('cases')}
function resetF(){F.clinic=null;F.step=null;F.cov=null;F.dues=[];F.staff=[];F.q='';F.open=null}
function clearFilter(){resetF();S.sel=[];render()}
const hasFilter=()=>!!(F.clinic||F.step!==null||F.cov||F.dues.length||F.staff.length||F.q);

function filteredCases(){
  let cs=visibleCases();
  if(F.clinic)cs=cs.filter(c=>c.clinic===F.clinic);
  if(F.step!==null)cs=cs.filter(c=>c.step===F.step);
  if(F.cov)cs=cs.filter(c=>c.cov===F.cov);
  if(F.dues.length)cs=cs.filter(c=>F.dues.includes(c.due));
  if(F.staff.length)cs=cs.filter(c=>
    F.staff.includes('none')&&!c.assign.length ? true
    : c.assign.some(a=>F.staff.includes(a.s)));
  if(F.q){
    const q=F.q.toLowerCase();
    cs=cs.filter(c=>[c.no,c.patient,c.chart,clinicOf(c.clinic).name,c.type,c.mat]
      .some(v=>String(v).toLowerCase().includes(q)));
  }
  return sortCases(cs);
}
const SORTS={
  no:  {l:'受注順',   f:(a,b)=>a.no<b.no?-1:1},
  due: {l:'納期',     f:(a,b)=>a.due!==b.due?(a.due<b.due?-1:1):caseStar(b)-caseStar(a)},
  ship:{l:'発送日',   f:(a,b)=>shipOf(a)!==shipOf(b)?(shipOf(a)<shipOf(b)?-1:1):caseStar(b)-caseStar(a)},
  clinic:{l:'医院',   f:(a,b)=>clinicOf(a.clinic).name.localeCompare(clinicOf(b.clinic).name,'ja')},
  patient:{l:'患者',  f:(a,b)=>a.patient.localeCompare(b.patient,'ja')},
  step:{l:'工程',     f:(a,b)=>a.step-b.step||(a.due<b.due?-1:1)},
  diff:{l:'難易度',   f:(a,b)=>caseStar(a)-caseStar(b)}
};
function sortCases(cs){
  const s=SORTS[F.sortKey]||SORTS.no;
  const out=cs.slice().sort(s.f);
  return F.sortDir==='desc'?out.reverse():out;
}
/* 同じ列を押したら昇降を反転、違う列なら昇順から */
function setSort(k){
  if(F.sortKey===k)F.sortDir=F.sortDir==='asc'?'desc':'asc';
  else{F.sortKey=k;F.sortDir=k==='diff'?'desc':'asc'}
  render();
}
const sortArrow=k=>F.sortKey!==k?'<span class="sa">↕</span>'
  :`<span class="sa on">${F.sortDir==='asc'?'↑':'↓'}</span>`;
const th=(k,label,extra)=>`<th class="sortable ${F.sortKey===k?'on':''}" ${extra||''}
  onclick="setSort('${k}')" title="この列で並び替え">${label}${sortArrow(k)}</th>`;

/* ---------- 納期の複数選択 ---------- */
/* データにある納期だけを候補にする。存在しない日を選ばせない */
function dueOptions(){
  const base=visibleCases();
  const m={};
  base.forEach(c=>{m[c.due]=(m[c.due]||0)+1});
  return Object.keys(m).sort().map(d=>({d,n:m[d],days:daysTo(d)}));
}
const dueChipLabel=o=>o.days<0?`超過 ${-o.days}日`:o.days===0?'本日':o.days===1?'明日'
  :fmtJ(new Date(o.d+'T00:00:00+09:00'));
function toggleDue(d){const i=F.dues.indexOf(d);i<0?F.dues.push(d):F.dues.splice(i,1);S.sel=[];render()}
/* よく使うまとまりをワンタッチで。個別の日を選ぶより速い */
function dueQuick(kind){
  const os=dueOptions();
  F.dues=kind==='over'?os.filter(o=>o.days<0).map(o=>o.d)
    :kind==='today'?os.filter(o=>o.days===0).map(o=>o.d)
    :kind==='2days'?os.filter(o=>o.days>=0&&o.days<=1).map(o=>o.d)
    :kind==='week'?os.filter(o=>o.days>=0&&o.days<=6).map(o=>o.d)
    :[];
  S.sel=[];render();
}
/* ---------- 担当の複数選択 ---------- */
function toggleStaffF(id){const i=F.staff.indexOf(id);i<0?F.staff.push(id):F.staff.splice(i,1);S.sel=[];render()}
function staffOptions(){
  const base=visibleCases();
  return [...STAFF.filter(s=>s.role==='LAB_STAFF').map(s=>({id:s.id,name:s.name,
      n:base.filter(c=>c.assign.some(a=>a.s===s.id)).length})),
    {id:'none',name:'未割当',n:base.filter(c=>!c.assign.length).length}];
}
function togglePanel(k){F.open=F.open===k?null:k;render()}

function filterBar(){
  const dOpts=dueOptions(),sOpts=staffOptions();
  const dueLabel=F.dues.length?`納期 ${F.dues.length}日`:'納期';
  const stLabel=F.staff.length
    ? `担当 ${F.staff.map(id=>id==='none'?'未割当':staffOf(id).name.split(' ')[0]).join('・')}`
    : '担当';
  return `

/* 絞り込みの内容を1行で言い表す。何が効いているか分からなくなるのを防ぐ */
function filterSummary(){
  const p=[];
  if(F.q)p.push(`「${F.q}」で検索`);
  if(F.cov)p.push(F.cov==='INSURANCE'?'保険':'自費');
  if(F.step!==null)p.push(`工程「${STEPS[F.step].n}」`);
  if(F.clinic)p.push(clinicOf(F.clinic).name);
  if(F.dues.length)p.push(`納期 ${F.dues.length}日分`);
  if(F.staff.length)p.push(`担当 ${F.staff.map(id=>id==='none'?'未割当':staffOf(id).name).join('・')}`);
  return p.join(' ／ ');
}

function vCases(){
  const cs=filteredCases();

  const nsel=S.sel.length;
  const sum=filterSummary();

  const paperN=CASES.filter(isPaperCase).length;

  return `
  <div class="row mb" style="justify-content:space-between;align-items:flex-start;gap:10px">
    <div>
      <h1 style="margin:0">案件一覧</h1>
      <p class="sub" style="margin:2px 0 0">${cs.length}件${sum?` ／ 絞り込み：${esc(sum)}`:''}
        ／ 並び：${esc((SORTS[F.sortKey]||SORTS.no).l)}${F.sortDir==='asc'?'（昇順）':'（降順）'}
        ${paperN?` ／ うち紙の依頼 <b>${paperN}件</b>`:''}</p>
    </div>
    ${!isStaff()?`<button class="btn pri" onclick="startPaper()" style="flex:none">＋ 紙の依頼を入力</button>`:''}
  </div>

  <div class="card mb stick">
    ${filterBar()}
    ${nsel&&isOverseer()?`
    <div class="actbar">
      <span class="cnt">${nsel}件を選択中</span>
      <button class="btn sm pri" onclick="bulkAssign()">一括アサイン</button>
      <button class="btn sm" onclick="bulkStep()">工程を進める</button>

  <div class="card"><div class="listwrap"><table>
    <thead><tr>${isOverseer()?`<th style="width:34px">

          onclick="toggleSelAll(${JSON.stringify(ids).replace(/"/g,'&quot;')})"></th>`:''}

      ${th('step','工程')}${th('diff','難易度')}<th>担当</th>${CFG.rfid?'<th>トレイ</th>':''}
      ${CFG.showShipDate?th('ship','発送日'):''}${th('due','納期（医院着）')}</tr></thead>
    <tbody>${shown.map(c=>`<tr class="clk" onclick="go('case','${c.id}')"
      style="${S.sel.includes(c.id)?'background:var(--primary-soft)':''}">
      ${isOverseer()?`<td onclick="event.stopPropagation()">
        <input type="checkbox" ${S.sel.includes(c.id)?'checked':''} onclick="toggleSel('${c.id}')"></td>`:''}
      <td><code>${esc(c.no)}</code>${c.isRush?' <span class="b wait">特急</span>':''}</td>
      <td>${esc(clinicOf(c.clinic).name)}</td>
      <td><b>${esc(c.patient)}</b><div class="note">${esc(c.chart)}</div></td>
      <td>${covB(c.cov)}</td><td>${esc(c.type)}<div class="note">${teethLabel(c.teeth)}</div></td>
      <td>${esc(c.mat)}</td>

      <td>${starHtml(caseStar(c))}</td>
      <td>${c.assign.map(a=>av(a.s,a.r!=='MAIN')).join('')||'<span class="b wait">未割当</span>'}</td>
      ${CFG.rfid?`<td class="note">${esc(c.tray||'—')}</td>`:''}
      ${CFG.showShipDate?`<td style="color:${daysTo(shipOf(c))<=1?'var(--danger)':''};font-weight:700">${shipTxt(c)}</td>`:''}
      <td style="color:${daysTo(c.due)<=1?'var(--danger)':''};font-weight:${daysTo(c.due)<=1?'700':'400'}">${dueLabel(c.due)}</td></tr>`).join('')
      ||`<tr><td colspan="14" class="empty">該当する案件はありません</td></tr>`}</tbody>
  </table></div></div>

/* 一括操作の選択（A-8） */
function toggleSel(id){const i=S.sel.indexOf(id);i<0?S.sel.push(id):S.sel.splice(i,1);render()}
function toggleSelAll(ids){
  const all=ids.every(id=>S.sel.includes(id));
  S.sel=all?S.sel.filter(id=>!ids.includes(id)):[...new Set([...S.sel,...ids])];
  render();
}
function clearSel(){S.sel=[];render()}
function bulkAssign(){
  const n=S.sel.length;
  S.modal={title:`${n}件を一括アサイン`,body:`
    <p style="font-size:13.5px;color:var(--muted)">選択した ${n} 件のメイン担当をまとめて設定します。</p>
    <label class="f" style="margin-bottom:0"><span class="lb">メイン担当</span>
      <select id="baStaff">${STAFF.filter(s=>s.role==='LAB_STAFF').map(s=>
        `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>`,
    ok:'割り当てる',fn:()=>{
      const sid=document.getElementById('baStaff').value;
      S.sel.forEach(id=>{const c=findCase(id);
        c.assign=c.assign.filter(a=>a.r!=='MAIN');c.assign.push({s:sid,r:'MAIN'})});
      S.modal=null;S.sel=[];toast(`${n}件を ${staffOf(sid).name} に割り当てました`);render()}};
  render();
}
function bulkStep(){
  const n=S.sel.length;
  S.modal={title:`${n}件の工程を進める`,body:`
    <div class="alert warn mb">選択した ${n} 件を、それぞれ次の工程へ進めます。<br>
      工程の進行は記録に残り、取り消せません。</div>
    <p class="note">加工工程に入っている案件は仕様変更ができなくなります。</p>`,
    ok:'進める',fn:()=>{S.sel.forEach(id=>{const c=findCase(id);if(c.step<STEPS.length-1)c.step++});
      S.modal=null;S.sel=[];toast(`${n}件の工程を進めました`);render()}};
  render();
}

        : '<span class="note">（チェックなし）</span>'}</dd>
      ${paperTech(variantOf(c)).map(f=>`<dt>${esc(f.l)}</dt><dd>${
        c.tech&&c.tech[f.c] ? esc(c.tech[f.c])
        : '<span class="note">（紙に記載なし）</span>'}</dd>`).join('')}
      <dt>特記事項</dt><dd>${c.note?esc(c.note):'<span class="note">—</span>'}</dd>

    <div class="alert warn mt" style="font-size:12.5px">

  <div class="grid g21">

      </div></div>

      <div class="card"><div class="hdr"><h3>やり取りの記録</h3></div><div class="bd">
        <div class="tl">${c.tl.map(e=>`<div class="tli ${e.k}">
          <div class="tm">${esc(e.t)}</div>
          <div class="tx"><span class="who">${esc(e.w)}</span> ${esc(e.x)}</div></div>`).join('')}</div>
        ${(MSGS[c.id]||[]).length?`<h3 class="mt">メッセージ</h3>

        <div class="row"><div style="flex:1" class="note">${CFG.ticketSize} ／ 第1版</div>
          <button class="btn sm" onclick="openTicket('${c.id}')">プレビュー</button></div>
      </div></div>
    </div>
  </div>`;
}

function vShip(){
  const scope=S.shipScope||(isStaff()?'mine':'all');
  const days=[0,1,2,3].map(n=>{
    const d=fmt(addDays(TODAY,n));
    return {n,date:d,
      label:n===0?`本日 ${fmtJ(new Date(d+'T00:00:00+09:00'))}`
        :n===1?`明日 ${fmtJ(new Date(d+'T00:00:00+09:00'))}`
        :n===2?`明後日 ${fmtJ(new Date(d+'T00:00:00+09:00'))}`
        :fmtJ(new Date(d+'T00:00:00+09:00'))};
  });
  /* 担当スコープ。LAB_STAFF は自分の担当だけ（visibleCases が既にそうしている） */
  const base=visibleCases().filter(c=>c.step<STEPS.length);
  const src=scope==='mine'?base.filter(c=>c.assign.some(a=>a.s===S.me)):base;
  const late=src.filter(c=>daysTo(shipOf(c))<0);
  const carrier=(CARRIERS.find(x=>x.pref)||CARRIERS[0]||{name:'—'});
  return `
  <div class="row mb"><h1 style="margin:0">発送予定</h1>
    <span class="sp"></span>
    ${isStaff()?'':`<div class="seg">
      <button class="${scope==='mine'?'on':''}" onclick="S.shipScope='mine';render()">担当の分</button>
      <button class="${scope==='all'?'on':''}" onclick="S.shipScope='all';render()">全体</button>
    </div>`}
    <button class="btn sm" onclick="csvShip()">CSV出力</button></div>
  <p class="sub">${esc(fmtJ(TODAY))} 時点 ／ ${scope==='mine'?esc(ME().name)+' の担当':'技工所全体'}
    ／ 既定の配送業者 ${esc(carrier.name)}</p>

  ${late.length?`<div class="alert dgr mb">
    <b>発送予定日を過ぎているものが ${late.length}件 あります。</b>
    <div class="note mt">${late.slice(0,4).map(c=>
      `${esc(clinicOf(c.clinic).name)} ${esc(c.patient)}様（${esc(fmtJ(new Date(shipOf(c)+'T00:00:00+09:00')))}）`).join(' ／ ')}
      ${late.length>4?` ほか ${late.length-4}件`:''}</div></div>`:''}

  ${days.map(d=>{
    /* 特急を上に、あとはケース番号順。スマホで指が届く並びにする */
    const cs=src.filter(c=>shipOf(c)===d.date)
      .sort((a,b)=>(b.isRush?1:0)-(a.isRush?1:0)||a.no.localeCompare(b.no));
    return `<div class="shipday ${d.n===0?'today':''}">
      <div class="h">${esc(d.label)}<span class="n">${cs.length}</span></div>
      ${cs.length?cs.map(c=>{
        const cl=clinicOf(c.clinic);
        const ready=c.step>=STEPS.length-1;
        return `<div class="it" onclick="go('case','${c.id}')">
          <span class="b ${ready?'done':(c.step>=STEPS.length-3?'prog':'wait')}"
            style="flex:0 0 auto">${ready?'梱包済':esc(STEPS[c.step].n)}</span>
          <div class="g"><b>${esc(cl.name)}</b> ／ ${esc(c.patient)}様
            <div class="s">${esc(c.type)} ${esc(c.mat)}${c.units>1?' ×'+c.units:''}
              ・ 医院着 ${esc(dueLabel(c.due))}${c.tray?' ・ '+esc(c.tray):''}</div></div>
          ${c.isRush?'<span class="b wait">特急</span>':''}
          ${starHtml(caseStar(c))}
        </div>`}).join('')
        :'<div class="it" style="cursor:default"><span class="note">予定はありません</span></div>'}
    </div>`}).join('')}

  <div class="card"><div class="hdr"><h3>配送の指定</h3></div><div class="bd">
    <div class="tw"><table><thead><tr><th>業者</th><th>午前指定</th><th>追加送料</th></tr></thead>
      <tbody>${CARRIERS.map(c=>`<tr>
        <td>${esc(c.name)}${c.pref?' <span class="b done">既定</span>':''}</td>
        <td>${c.am?'<span class="b prog">できる</span>':'<span class="b gray">できない</span>'}</td>
        <td>${c.am&&c.amFee?yen(c.amFee):'—'}</td></tr>`).join('')}
      </tbody></table></div>
    <div class="alert info mt" style="font-size:12.5px">
      ★ 午前中・10時までのご指定があるときは
      <b>${esc((CARRIERS.find(c=>c.am)||{name:'—'}).name)}</b> 一択です。
      追加送料が発生するため、医院の依頼画面にもその旨を出します。
      設定は［設定 › 医院・取引条件］です。</div>
  </div></div>`;
}
function csvShip(){
  const src=visibleCases().filter(c=>c.step<STEPS.length)
    .sort((a,b)=>shipOf(a)<shipOf(b)?-1:1);
  DL.csv.export(`発送予定_${stampL()}.csv`,
    [{k:'ship',l:'発送日'},{k:'due',l:'医院着'},{k:'no',l:'ケース番号'},{k:'clinic',l:'医院'},
     {k:'patient',l:'患者'},{k:'type',l:'技工物'},{k:'step',l:'工程'},{k:'assign',l:'担当'},{k:'tray',l:'トレイ'}],
    src.map(c=>({ship:shipOf(c),due:c.due,no:c.no,clinic:clinicOf(c.clinic).name,
      patient:c.patient,type:c.type+'／'+c.mat,step:STEPS[c.step].n,
      assign:c.assign.map(a=>staffOf(a.s).name).join(' / '),tray:c.tray||''})));
  toast('CSVを出力しました');
}

function vCapacity(){
  if(!isOverseer())return noPerm();
  const weeks=[0,1,2,3].map(w=>{
    const from=addDays(TODAY,w*7),to=addDays(TODAY,w*7+6);
    return {label:`${fmtJ(from)}〜${fmtJ(to)}`,
      staff:STAFF.filter(s=>s.role==='LAB_STAFF').map(s=>{
        const n=CASES.filter(c=>c.assign.some(a=>a.s===s.id)&&c.due>=fmt(from)&&c.due<=fmt(to)).length;
        return {s,n};
      })};
  });
  const cap=12;
  return `

    </tr>`).join('')}</tbody>
  </table></div></div>
  <div class="card mt"><div class="hdr"><h3>工程別の滞留</h3></div><div class="bd">
    ${STEPS.map((st,i)=>{const n=CASES.filter(c=>c.step===i).length;const p=Math.min(100,n*5);

/* ============================================================

let LINK_REQS=[];   /* この技工所が出している紐付け申請 */

function startAddClinic(){
  S.ac={step:0,by:'code',q:'',results:null,sel:null,msg:'',
        nw:{name:'',tel:'',addr:'',dr:'',email:'',mode:'SYSTEM',
            inDef:'SHIP',outDef:'SHIP',dist:''},dupWarn:null};
  go('addclinic');
}
function acSet(k,v){S.ac[k]=v;render()}
function acSearch(){
  const a=S.ac,q=(a.q||'').trim();
  if(a.by==='code'){
    if(!/^CL-\d{4}-\d{5}$/i.test(q)){
      toast('医院コードは CL-2026-00417 の形式で完全一致で入力してください');return;
    }
    a.results=GLOBAL_CLINICS.filter(c=>c.code.toUpperCase()===q.toUpperCase());
  }else if(a.by==='tel'){
    const t=q.replace(/[^0-9]/g,'');
    if(t.length<6){toast('電話番号は6桁以上を入力してください');return}
    a.results=GLOBAL_CLINICS.filter(c=>c.tel.includes(t));
  }else{
    if(q.length<3){toast('医院名は3文字以上を入力してください');return}
    a.results=GLOBAL_CLINICS.filter(c=>c.name.includes(q));
  }
  a.step=1;render();
}
function acPick(code){
  const c=GLOBAL_CLINICS.find(x=>x.code===code);
  if(c.linked){toast('この医院はすでに取引中です');return}
  if(LINK_REQS.some(r=>r.code===code)){toast('この医院にはすでに申請中です');return}
  S.ac.sel=c;S.ac.step=2;S.ac.msg=
    `いつもお世話になっております。${CFG.labName||'当技工所'}です。\n`+
    `貴院とのお取引をシステム上で開始させていただきたく、紐付けの申請をお送りします。\nご確認をお願いいたします。`;
  render();
}
function acSendLink(){
  const c=S.ac.sel;
  LINK_REQS.push({code:c.code,name:c.name,at:'たった今'});
  S.ac=null;toast(`${c.name} へ紐付け申請を送りました`);go('clinics');
}
function acToNew(){
  const a=S.ac;
  a.step=3;
  /* 検索キーを新規登録フォームに引き継ぐ */
  if(a.by==='tel')a.nw.tel=a.q;
  if(a.by==='name')a.nw.name=a.q;
  acCheckDup();
  render();
}
function acNwSet(k,v){S.ac.nw[k]=v;if(k==='tel')acCheckDup();render()}
function acCheckDup(){
  const t=(S.ac.nw.tel||'').replace(/[^0-9]/g,'');
  S.ac.dupWarn=t.length>=6?GLOBAL_CLINICS.filter(c=>c.tel.includes(t)):null;
  if(S.ac.dupWarn&&!S.ac.dupWarn.length)S.ac.dupWarn=null;
}
function acRegister(){
  const n=S.ac.nw;
  if(!n.name.trim()||!n.tel.trim()){toast('医院名と電話番号は必須です');return}
  if(S.ac.dupWarn&&S.ac.dupWarn.length&&!S.ac.dupAck){
    toast('重複の可能性があります。確認のチェックを入れてください');return;
  }
  const hv={inDef:n.inDef||'SHIP',outDef:n.outDef||'SHIP',dist:(n.dist||'').trim()||'—'};

  /* ★紙で取引する医院は、システム全体の医院マスタに登録しない（BR-93・BR-32）。
     医院コードも発行せず、招待も送らない。使わない相手にアカウントを配らない。 */
  if(n.mode==='PAPER'){
    const id='pc'+(PAPER_CLINICS.length+1)+'_'+Date.now().toString().slice(-4);
    PAPER_CLINICS.push({id,name:n.name.trim(),dr:n.dr||'—',tel:n.tel.trim(),paper:true,
      ...hv,memo:'',score:{total:0},notes:[],users:[]});
    S.ac=null;
    toast(`${n.name} を紙の医院として登録しました（医院コードなし・招待は送っていません）`);
    go('clinics');return;
  }

  if(!(n.email||'').trim()){toast('招待の送り先メールアドレスを入れてください');return}
  const code='CL-2026-'+String(500+GLOBAL_CLINICS.length).padStart(5,'0');
  GLOBAL_CLINICS.push({code,name:n.name.trim(),addr:n.addr||'—',
    tel:n.tel.replace(/[^0-9]/g,''),linked:true});
  CLINICS.push({id:'cl'+(CLINICS.length+1),code,name:n.name.trim(),dr:n.dr||'—',
    email:n.email.trim(),reg:'2026-08-12',...hv,
    score:{total:null,orders:0,enough:false},notes:[],users:[]});
  S.ac=null;
  toast(`${n.name} を登録しました（医院コード ${code}）。${n.email} へ招待を送りました`);
  go('clinics');
}

       通常は医院が発送する。★納期がギリギリのとき、発送すると翌日着になるため、
       近距離なら技工所が取りに行く。
     復路（技工所 → 医院）：完成品を届ける
       通常は技工所が発送する。★同じ理由で、近距離なら直接持っていく。

   ★どちらも「普段の決め方」と「その回だけの変更」の2階層。
     変更するのは技工所側で、理由を残す。
   ============================================================ */
const INBOUND_JA ={SHIP:'医院が発送',   PICKUP :'技工所が取りに行く'};
const OUTBOUND_JA={SHIP:'技工所が発送', DELIVER:'技工所が届けに行く'};
const LEG_JA={in:'往路（印象・模型）', out:'復路（完成品）'};
const legLabel=(leg,v)=>(leg==='in'?INBOUND_JA:OUTBOUND_JA)[v]||'—';
/* 既定から外れているか。外れているなら理由が要る */
const legOff=(c,leg)=>{
  const cl=clinicOf(c.clinic);
  const def=leg==='in'?(cl.inDef||'SHIP'):(cl.outDef||'SHIP');
  return (leg==='in'?c.hvIn:c.hvOut)!==def;
};

function startPaper(){
  S.pp={clinic:PAPER_CLINICS[0]?.id||'', newClinic:false,
        nm:'', dr:'', tel:'', dist:'', nwIn:'SHIP', nwOut:'SHIP',
        patient:'', chart:'', pno:'', visit:'',
        variant:VARIANTS[0].id, units:1, teeth:'46', shade:'',
        mats:{}, tech:{}, changeNotice:false,
        due:fmt(addDays(TODAY,7)), hvIn:'', hvOut:'', note:''};
  go('paper');
}
const ppSet=(k,v)=>{
  S.pp[k]=v;
  /* ★来院日が入ったら、納期をその前日に寄せる。
     早く作りすぎない（原則38）。最短日に間に合っても来院日の前日に届ける */
  if(k==='visit'&&v) S.pp.due=fmt(addDays(new Date(v+'T00:00:00+09:00'),-1));
  render();
};
const ppMat=(k,on)=>{S.pp.mats[k]=on; render()};
/* ★空文字は「紙に記載なし」。既定値で埋めない（責任証跡） */
const ppTech=(k,v)=>{ if(v) S.pp.tech[k]=v; else delete S.pp.tech[k]; render()};

          <select onchange="ppSet('nwIn',this.value)">

              `<option value="${k}" ${a.nwIn===k?'selected':''}>${l}</option>`).join('')}</select></label>
        <label class="f"><span class="lb">普段の復路 <span class="hint">完成品を届ける</span></span>

    :`<label class="f" style="margin-bottom:0"><span class="lb">医院</span>
        <select onchange="ppSet('clinic',this.value)">

      ${cl&&cl.memo?`<p class="note mt">${esc(cl.memo)}</p>`:''}`}

  <div class="alert warn mb">
    ★<b>紙に書いていない項目は、空欄のままにしてください。</b>

  <div class="card mb"><div class="hd"><b>患者</b></div><div class="bd">

        <select onchange="ppSet('variant',this.value)">

            ${x.cov==='INSURANCE'?'[保険]':'[自費]'} ${esc(x.type)} / ${esc(x.mat)}</option>`).join('')}</select></label>
      <label class="f"><span class="lb">本数</span>
        <input type="number" min="1" value="${a.units}" oninput="S.pp.units=Math.max(1,+this.value||1)"></label>

    </div>
    <p class="note mt">
      技工料の目安 <b>${yen(v.price*a.units)}</b>（${esc(v.type)}／${esc(v.mat)} × ${a.units}本）。

  <div class="card mb"><div class="hd"><b>同梱物</b>

    <p class="note mb">

  <div class="card mb"><div class="hd"><b>技工指示</b>
    <span class="sp"></span><span class="note">紙に書かれているものだけ</span></div><div class="bd">
    <div class="grid g2">
      ${paperTech(v).map(f=>`
        <label class="f"><span class="lb">${esc(f.l)}</span>
          <select onchange="ppTech('${f.c}',this.value)">
            <option value="">${NOTE_NONE}</option>
            ${f.opts.map(o=>`<option value="${esc(o)}" ${a.tech[f.c]===o?'selected':''}>${esc(o)}</option>`).join('')}

      ${hvOut==='DELIVER'?'<b>復路は直接お届けなので、配送日数がかかりません。</b>':''}
      ${hvIn==='PICKUP'?'<b>往路はこちらが取りに行きます。</b>医院からの発送を待ちません。':''}
    </p>
  </div></div>

  <div class="row" style="gap:8px">
    <button class="btn pri" onclick="savePaper()">この内容で登録する</button>
    <button class="btn" onclick="go('cases')">やめる</button>

}

function savePaper(){
  const a=S.pp;
  if(a.newClinic&&!a.nm.trim()){toast('医院名を入れてください');return}
  if(!a.patient.trim()){toast('患者名を入れてください');return}

  /* 新しい紙の医院は、この技工所の中だけに作る。★医院コードは付けない（BR-32） */
  let cid=a.clinic;
  if(a.newClinic){
    cid='pc'+(PAPER_CLINICS.length+1)+'_'+Date.now().toString().slice(-4);
    PAPER_CLINICS.push({id:cid,name:a.nm.trim(),dr:a.dr.trim(),tel:a.tel.trim(),paper:true,
      inDef:a.nwIn,outDef:a.nwOut,dist:a.dist.trim(),memo:'',
      score:{total:0},notes:[],users:[]});
  }
  const cl=paperOf(cid);
  const v=VARIANTS.find(x=>x.id===a.variant)||VARIANTS[0];
  const hvIn =a.hvIn ||cl.inDef;
  const hvOut=a.hvOut||cl.outDef;
  const no=200+CASES.length+1;

  CASES.unshift({
    id:'kp'+Date.now(), no:'NKTN-2026-P'+String(no).padStart(3,'0'),
    clinic:cid, paper:true,                       /* ★紙由来の印 */
    patient:a.patient.trim(), chart:a.chart.trim()||'—', pno:a.pno.trim()||'—',
    visit:a.visit||null,
    cov:v.cov,type:v.type,mat:v.mat,variant:v.id,units:a.units,
    /* 「46,47」のような入力を配列にする */
    teeth:(()=>{const t=a.teeth.split(/[^0-9]+/).filter(Boolean).map(Number).filter(n=>n>=11&&n<=48);
             return t.length?t:[46]})(),
    shade:a.shade.trim()||null,                 /* ★空欄は null。'A3' で埋めない */
    mats:Object.keys(a.mats).filter(k=>a.mats[k]),
    tech:{...a.tech},                           /* ★書いてある項目だけが入る */
    due:a.due, ship:fmt(addDays(new Date(a.due+'T00:00:00+09:00'),-1)),
    hvIn, hvOut, hvInReason:null, hvOutReason:null,
    step:0, assign:[], items:1,
    diff:v.diff+(a.units>1?a.units*2:0)+(v.cov==='PRIVATE'?5:0),
    tray:null, isRush:false, amount:v.price*a.units, changeNotice:!!a.changeNotice, prio:null,
    note:a.note.trim(),
    tl:[{t:nowJ(),w:ME().name,
      x:'紙の依頼を入力しました（'+esc(cl.name)+'）'+
        (paperTech(v).some(f=>!a.tech[f.c])
          ? '　※紙に記載が無かった項目：'+paperTech(v).filter(f=>!a.tech[f.c]).map(f=>f.l).join('・')
          : ''),
      k:'hi'}]
  });
  S.pp=null;
  toast(`登録しました — ${cl.name} / ${a.patient}様`);
  go('cases');
}
/* 履歴の時刻。デモの「今日」を使う */
function nowJ(){const d=new Date();return `${DL.TODAY.slice(5).replace('-','/')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

/* ============================================================
   受け渡しの途中変更（FR-HD-007・008）
   ------------------------------------------------------------
   ★普段は発送の医院でも、納期がギリギリなら技工所の判断で切り替わる。
     往路：発送だと翌日着になるので、近ければ取りに行く
     復路：発送だと翌日着になるので、近ければ持っていく
   ★どちらも「あとから」変わる。案件の途中で変更できなければ使えない。
   ★既定から外すときは理由を残す（後から「なぜそうしたか」が分かるように）。
   ============================================================ */
const HV_REASONS={
  in :['配送を待つと納期に間に合わないため','医院から取りに来てほしいと依頼があったため',
       '近くへ行く用事があるため','再製作・修正で急ぐため'],
  out:['配送だと翌日着になり納期に間に合わないため','医院から直接持ってきてほしいと依頼があったため',
       '近くへ行く用事があるため','再製作・修正で急ぐため'],
};
function openHv(id,leg){
  const c=findCase(id); if(!c)return;
  const cl=clinicOf(c.clinic);
  const def=leg==='in'?(cl.inDef||'SHIP'):(cl.outDef||'SHIP');
  const cur=leg==='in'?c.hvIn:c.hvOut;
  const opts=leg==='in'?INBOUND_JA:OUTBOUND_JA;
  S.modal={title:`${LEG_JA[leg]}の受け渡しを変更`,wide:true,body:`
    <p class="note mb">${esc(cl.name)}（${esc(cl.dist||'—')}）の既定は
      <b>${legLabel(leg,def)}</b> です。</p>
    <div class="chips mb">
      ${Object.entries(opts).map(([k,l])=>
        `<button class="chip ${cur===k?'on':''}" onclick="hvPick('${id}','${leg}','${k}')">
          ${l}${k===def?'（既定）':''}</button>`).join('')}
    </div>
    <div id="hvReason">${cur!==def?hvReasonBox(id,leg,cur):''}</div>
    <div class="alert info" style="font-size:12.5px">
      ${leg==='in'
        ? '★<b>往路を「取りに行く」にすると、医院からの発送を待ちません。</b>納期の起点が変わります。'
        : '★<b>復路を「届けに行く」にすると、配送日数がかかりません。</b>その分だけ製作に使える日数が増えます。'}
      <br>既定と違う方法にする場合は、<b>理由を残してください。</b>
    </div>`,
    ok:null};
  render();
}
function hvReasonBox(id,leg,val){
  const c=findCase(id);
  const cur=leg==='in'?c.hvInReason:c.hvOutReason;
  return `<label class="f"><span class="lb">理由 <span style="color:var(--danger);font-size:10.5px;font-weight:700">必須</span></span>
    <select id="hvR">
      <option value="">選んでください</option>
      ${HV_REASONS[leg].map(r=>`<option value="${esc(r)}" ${cur===r?'selected':''}>${esc(r)}</option>`).join('')}
    </select></label>
  <button class="btn pri mt" onclick="hvSave('${id}','${leg}','${val}')">この内容で変更する</button>`;
}
function hvPick(id,leg,val){
  const c=findCase(id), cl=clinicOf(c.clinic);
  const def=leg==='in'?(cl.inDef||'SHIP'):(cl.outDef||'SHIP');
  if(val===def){ hvSave(id,leg,val,true); return; }   /* 既定に戻すなら理由は要らない */
  /* 選択だけ先に反映して、理由の欄を出す */
  if(leg==='in')c.hvIn=val; else c.hvOut=val;
  openHv(id,leg);
}
function hvSave(id,leg,val,toDefault){
  const c=findCase(id);
  const reason=toDefault?null:(document.getElementById('hvR')?.value||'');
  if(!toDefault&&!reason){toast('理由を選んでください');return}
  if(leg==='in'){ c.hvIn=val; c.hvInReason=reason; }
  else{ c.hvOut=val; c.hvOutReason=reason; }
  c.tl.push({t:nowJ(),w:ME().name,
    x:`${LEG_JA[leg]}を「${legLabel(leg,val)}」に変更${reason?`（${reason}）`:'（既定に戻した）'}`,k:'hi'});
  S.modal=null;
  toast(`${LEG_JA[leg]}を ${legLabel(leg,val)} にしました`);
  render();
}

/* 紙の医院を、システムに入った医院へ紐づける（昇格）。
   ★これまでの紙の案件も一緒に付け替える。履歴を切らないため。 */
function linkPaper(pid){
  const pc=paperOf(pid); if(!pc)return;
  const n=CASES.filter(c=>c.clinic===pid).length;
  S.modal={title:`${pc.name} を紐づける`,wide:true,body:`
    <div class="alert info mb">
      <b>${esc(pc.name)}</b> がシステムを導入したら、既存の医院と結び付けます。<br>
      これまでの<b>紙の案件 ${n}件も、そのまま新しい医院へ引き継がれます</b>（履歴を切らないため）。
    </div>
    <label class="f" style="margin-bottom:0"><span class="lb">紐づけ先の医院</span>
      <select id="lpTo">${CLINICS.map(c=>
        `<option value="${c.id}">${esc(c.name)}（${esc(c.code)}）</option>`).join('')}</select></label>
    <p class="note mt">
      ★実際には<b>医院コードで検索して、医院側の承認を得てから</b>紐づきます（BR-32・BR-33）。
      ここでは取引中の医院から選ぶ形にしています。
    </p>`,
    ok:'紐づける',fn:()=>{
      const to=document.getElementById('lpTo').value;
      CASES.filter(c=>c.clinic===pid).forEach(c=>{
        c.clinic=to;
        c.tl.push({t:nowJ(),w:ME().name,
          x:`紙の医院「${pc.name}」を ${clinicOf(to).name} に紐づけました`,k:'hi'});
      });
      PAPER_CLINICS=PAPER_CLINICS.filter(c=>c.id!==pid);
      S.modal=null;
      toast(`${pc.name} を ${clinicOf(to).name} に紐づけました（案件 ${n}件を移行）`);
      render();
    }};
  render();
}

    </div>
    <label class="f" style="margin-bottom:0"><span class="lb">IOSデータの場合</span>
      <div class="row"><div class="sw ${CFG.iosNoShip!==false?'on':''}"

};
const stampL=()=>'20260815';
function csvPrices(){
  DL.csv.export(`基本技工料_${stampL()}.csv`,LCSV.prices,VARIANTS.map(v=>({
    cov:v.cov==='INSURANCE'?'保険':'自費',type:v.type,mat:v.mat,price:v.price,
    days:v.days,diff:v.diff,rush:v.rush?'可':'不可'})));
  toast('基本技工料を書き出しました');
}
function importPrices(){
  DL.csv.pickFile(text=>{
    if(text==null){toast('ファイルを読み込めませんでした');return}
    const {items}=DL.csv.toObjects(LCSV.prices,DL.csv.parse(text));
    const issues=items.map(o=>{
      if(!o.type||!o.mat)return {level:'error',msg:'技工物と材料は必須です'};
      if(!/^\d+$/.test(String(o.price||'').replace(/[,¥]/g,'')))return {level:'error',msg:'単価が数値ではありません'};
      const hit=VARIANTS.find(v=>v.type===o.type&&v.mat===o.mat);
      return hit?{level:'warn',msg:'既存を更新'}:null;
    });
    const errs=issues.filter(x=>x&&x.level==='error').length;
    S.modal={title:'基本技工料の取り込み',wide:true,body:`
      <p>${items.length}行を読み込みました。技工物と材料の組み合わせが一致する行は更新します。</p>
      ${errs?`<div class="alert dgr mb">${errs}行にエラーがあります。該当行は取り込みません。</div>`:''}
      ${DL.csv.previewHtml(LCSV.prices,items,issues)}`,
      ok:`${items.length-errs}行を取り込む`,fn:()=>{
        let add=0,upd=0;
        items.forEach((o,i)=>{
          if(issues[i]&&issues[i].level==='error')return;
          const price=+String(o.price).replace(/[,¥]/g,'')||0;
          const hit=VARIANTS.find(v=>v.type===o.type&&v.mat===o.mat);
          if(hit){hit.price=price;if(o.days)hit.days=+o.days;upd++}
          else{VARIANTS.push({id:'x'+Date.now()+add,cov:o.cov==='自費'?'PRIVATE':'INSURANCE',
            type:o.type,mat:o.mat,price,days:+o.days||5,diff:+o.diff||15,rush:o.rush!=='不可'});add++}
        });
        closeModal();toast(`新規 ${add}件・更新 ${upd}件を取り込みました`);render();
      }};
    render();
  });
}
function csvClinicPrices(){
  DL.csv.export(`医院別単価_${stampL()}.csv`,LCSV.clinicPrices,CLINIC_PRICES.map(o=>{
    const v=VARIANTS.find(x=>x.id===o.vid)||{};
    return {clinic:(clinicOf(o.clinic)||{}).name||'',cov:v.cov==='INSURANCE'?'保険':'自費',
      type:v.type,mat:v.mat,price:o.price,memo:o.memo||''};
  }));
  toast('医院別単価を書き出しました');
}
function importClinicPrices(){
  DL.csv.pickFile(text=>{
    if(text==null){toast('ファイルを読み込めませんでした');return}
    const {items}=DL.csv.toObjects(LCSV.clinicPrices,DL.csv.parse(text));
    const issues=items.map(o=>{
      const cl=CLINICS.find(c=>c.name===o.clinic);
      if(!cl)return {level:'error',msg:'医院名が見つかりません'};
      const v=VARIANTS.find(x=>x.type===o.type&&x.mat===o.mat);
      if(!v)return {level:'error',msg:'技工物・材料が見つかりません'};
      return null;
    });
    const errs=issues.filter(x=>x&&x.level==='error').length;
    S.modal={title:'医院別単価の取り込み',wide:true,body:`
      <p>${items.length}行を読み込みました。</p>
      ${errs?`<div class="alert dgr mb">${errs}行が既存のマスタと一致しません。先に技工物・材料と医院を登録してください。</div>`:''}
      ${DL.csv.previewHtml(LCSV.clinicPrices,items,issues)}`,
      ok:`${items.length-errs}行を取り込む`,fn:()=>{
        let n=0;
        items.forEach((o,i)=>{
          if(issues[i])return;
          const cl=CLINICS.find(c=>c.name===o.clinic);
          const v=VARIANTS.find(x=>x.type===o.type&&x.mat===o.mat);
          const price=+String(o.price).replace(/[,¥]/g,'')||0;
          const ex=CLINIC_PRICES.find(x=>x.clinic===cl.id&&x.vid===v.id);
          if(ex){ex.price=price;ex.memo=o.memo}
          else CLINIC_PRICES.push({clinic:cl.id,vid:v.id,price,memo:o.memo});
          n++;
        });
        closeModal();toast(`${n}件を取り込みました`);render();
      }};
    render();
  });
}

/* 手順の入れ替え。★これができることが要件そのもの */
function moveSub(fid,i,dir){
  const f=subOf(fid); if(!f)return;
  const j=i+dir; if(j<0||j>=f.steps.length)return;
  [f.steps[i],f.steps[j]]=[f.steps[j],f.steps[i]];
  S.subMv=[fid,j];
  toast(`「${f.steps[j]}」を${dir<0?'上':'下'}へ移しました`);
}
function openSubStep(fid,i){
  const f=subOf(fid); if(!f){toast('パターンが見つかりませんでした');render();return}
  const cur=i==null?'':f.steps[i];
  S.modal={title:i==null?`「${f.name}」に手順を追加`:`手順「${cur}」を編集`,body:`
    <label class="f"><span class="lb">手順名 <span class="req">必須</span></span>
      <input type="text" id="ssName" value="${esc(cur)}" placeholder="コンタクト調整"></label>
    ${i==null?`<label class="f" style="margin-bottom:0"><span class="lb">入れる位置</span>
      <select id="ssPos"><option value="-1">末尾に追加</option>
        ${f.steps.map((s,k)=>`<option value="${k}">${k+1}番目「${esc(s)}」の前</option>`).join('')}</select></label>`:''}
    <div class="alert info" style="font-size:12.5px">
      ここは<b>作業の手順書</b>です。RFID の読み取りは発生しません。
      チェックリストとして指示書に印字されます。</div>`,
    ok:i==null?'追加する':'保存する',fn:()=>{
      const nm=document.getElementById('ssName').value.trim();
      if(!nm){toast('手順名をご入力ください');return}
      if(i==null){
        const p=+document.getElementById('ssPos').value;
        if(p<0)f.steps.push(nm); else f.steps.splice(p,0,nm);
      }else f.steps[i]=nm;
      closeModal();toast('保存しました');
    }};
  render();
}
function delSubStep(fid,i){
  const f=subOf(fid); if(!f)return;
  const nm=f.steps[i];
  S.modal={title:'手順を削除',body:`<p>「<b>${esc(f.name)}</b>」から
    手順 <b>${esc(nm)}</b>（${i+1}番目）を削除します。</p>
    <p class="note">進行中の案件の履歴は変わりません。</p>`,
    ok:'削除する',danger:true,fn:()=>{f.steps.splice(i,1);closeModal();toast('削除しました')}};
  render();
}
function openSubPattern(id){
  const f=id?subOf(id):null;
  const d=f||{id:'f_'+Date.now(),name:'',kind:'',pre:'',steps:[]};
