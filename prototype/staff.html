<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>スタッフ端末（スマホ） — 技工物管理</title>
<style>
:root{
  --bg:#0f1613; --panel:#18231f; --panel-2:#1f2d28; --panel-3:#26362f;
  --line:#2c3d36; --line-2:#3a4f46;
  --text:#eaf2ef; --muted:#8fa79e; --faint:#6b8078;
  --primary:#2dd4bf; --primary-d:#0f766e;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --ins:#60a5fa; --pri:#fbbf24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
/* ★スマホ幅を基準に作る。PCで開いたときは中央に寄せて枠を出す（デモの見やすさ用） */
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:460px){ .phone{border:none} }

header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.lab{font-size:12px;color:var(--muted);letter-spacing:.02em}
.me{margin-left:auto;display:flex;align-items:center;gap:7px}
.av{width:30px;height:30px;border-radius:50%;background:var(--primary-d);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
select.who{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2);
  border-radius:8px;padding:5px 8px;font-size:13px;font-family:inherit;max-width:150px}

nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--panel)}
nav.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);font-size:13.5px;font-family:inherit;padding:11px 4px;cursor:pointer;font-weight:600}
nav.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
nav.tabs .n{display:inline-block;min-width:19px;padding:0 5px;margin-left:4px;border-radius:99px;
  background:var(--panel-3);color:var(--text);font-size:11.5px;line-height:18px;font-weight:700}
nav.tabs button.on .n{background:var(--primary);color:#04211d}

main{padding:14px 14px 90px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:12.5px}

/* ── 案件カード ───────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin-bottom:11px}
.card.act{border-color:var(--primary);background:var(--panel-2)}
.card.warn{border-color:var(--warn)}
.top{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.no{font-family:ui-monospace,monospace;font-size:12px;color:var(--faint)}
.ttl{font-size:16.5px;font-weight:700;line-height:1.35}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--panel-3);color:var(--muted)}
.chip.ins{background:#12304d;color:var(--ins)}
.chip.pri{background:#3a2f10;color:var(--pri)}
.chip.due{background:#3a1a1a;color:var(--danger);font-weight:700}
.chip.soon{background:#3a2f10;color:var(--warn);font-weight:700}
.chip.step{background:var(--primary-d);color:#eafffb;font-weight:700}

/* ★手袋でも押せるように大きく。現場の操作は迷わせない */
.act-btn{display:block;width:100%;margin-top:12px;padding:15px;border-radius:11px;
  border:none;font-family:inherit;font-size:16.5px;font-weight:700;cursor:pointer;
  background:var(--primary);color:#04211d}
.act-btn.done{background:var(--ok);color:#052e14}
.act-btn.ship{background:var(--ins);color:#04203f}
.act-btn:active{transform:translateY(1px)}
.act-btn.ghost{background:var(--panel-3);color:var(--text);font-size:14.5px;padding:11px;font-weight:600}

.el{display:flex;align-items:baseline;gap:6px;margin-top:9px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.el .lb{flex:none}
.el b{color:var(--text);font-family:ui-monospace,monospace}

/* ── 取り漏れの警告（BR-90）───────────── */
.gap{margin-top:10px;padding:9px 11px;border-radius:9px;background:#3a2f10;
  border:1px solid var(--warn);font-size:13px;color:#fde68a;line-height:1.65}
.gap b{color:#fff}

/* ── 読み取り ─────────────────────────── */
.scan{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:430px;margin:0 auto;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent);}
.scan button{width:100%;padding:16px;border-radius:13px;border:none;font-family:inherit;
  font-size:17px;font-weight:700;background:var(--primary);color:#04211d;cursor:pointer;
  box-shadow:0 6px 20px -6px rgba(45,212,191,.5)}
.mask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;
  place-items:end center;padding:0}
.sheet{width:100%;max-width:430px;background:var(--panel);border-radius:16px 16px 0 0;
  border:1px solid var(--line);border-bottom:none;padding:16px 14px calc(16px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:16px}
.cam{margin:12px 0;border:2px dashed var(--line-2);border-radius:12px;padding:22px 12px;
  text-align:center;color:var(--muted);font-size:13px;line-height:1.8;background:var(--panel-2)}
.cam .big{font-size:30px;display:block;margin-bottom:6px}
.pick{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:8px;color:var(--text);font-family:inherit;
  font-size:14px;cursor:pointer}
.pick:hover{border-color:var(--primary)}
.pick .p1{font-weight:700}
.pick .p2{font-size:12.5px;color:var(--muted);margin-top:2px}
input.code{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;
  padding:12px;color:var(--text);font-family:ui-monospace,monospace;font-size:16px}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;
  background:#04211d;border:1px solid var(--primary);color:var(--text);
  padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}

.empty{text-align:center;color:var(--faint);padding:34px 10px;font-size:14px;line-height:1.9}
.note{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--primary);
  border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.75;margin-bottom:12px}
.note b{color:var(--text)}

/* 詳細 */
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin-top:10px}
.dl dt{color:var(--muted);white-space:nowrap}
.dl dd{margin:0}
.flow{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.fs{font-size:11.5px;padding:3px 8px;border-radius:7px;background:var(--panel-3);color:var(--faint)}
.fs.done{background:#0e2c22;color:var(--ok)}
.fs.now{background:var(--primary);color:#04211d;font-weight:700}
.fs.miss{background:#3a2f10;color:var(--warn);font-weight:700}

  /* ★ラボ全体（2026-09-01 会議・スタッフにPCを見せない運用のため新設） */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center}
  .kpi .n{font-size:20px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .n.bad{color:var(--danger)}
  .kpi .l{font-size:10.5px;color:var(--muted);margin-top:2px}
  .steps{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
  .stepline{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
  .stepline:last-child{border-bottom:none}
  .sname{font-size:13px;flex:0 0 40%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sname.on{font-weight:700;color:var(--primary)}
  .sbar{flex:1;height:7px;background:var(--line-2);border-radius:4px;overflow:hidden}
  .sbar span{display:block;height:100%;background:var(--primary);border-radius:4px}
  .scount{flex:0 0 auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
  .row2{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
        border-radius:11px;padding:11px 12px;margin-top:7px;cursor:pointer}
  .row2 .ttl{font-size:14px;font-weight:700}
  .row2 .sub2{font-size:11.5px;color:var(--muted);margin-top:2px}
  .row2 .sub2 .bad{color:var(--danger);font-weight:700}
  .chev{color:var(--faint);flex:none}
  .search{width:100%;padding:11px 12px;font-size:15px;border:1px solid var(--line);
          border-radius:11px;background:var(--panel);color:var(--text)}
  .note.small{font-size:11.5px;padding:8px 11px}
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="hrow">
      <div>
        <div class="lab" id="labName">なかたに技工所</div>
        <div class="small faint" id="modeLine"></div>
      </div>
      <div class="me">
        <select class="who" id="whoSel"></select>
        <div class="av" id="avatar">高</div>
      </div>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="app"></main>
</div>
<div class="scan"><button id="scanBtn">📷　指示書のQRを読む</button></div>
<div id="overlay"></div>
<script src="shared.js"></script>
<script>
/* ============================================================
   スタッフ端末（スマホ）— 工程の記録
   ------------------------------------------------------------
   ★この画面の位置づけ（2026-08-29 新設）
     RFID を入れられる技工所はごくわずかという調査結果から、
     工程の記録は「①タップ ②QR ③RFID」の3方式にし、技工所が選ぶ。
     ①②は基本パック、③はオプション（BR-89）。

   ★読むのは工程あたり2回だけ（BR-92）
     RFID の3ゾーン（待機・作業中・完了）は「置くだけ」だから成立する。
     QR で同じことをやると 13工程 × 3回 = 1件39スキャンになり、現場が続かない。
     → 記録するのは「着手」と「完了」の2回。
       待ち時間は「前工程の完了時刻」から導出する（前工程の完了＝次工程の待機開始）。

   ★取り漏れは起きる前提で作る（BR-90・BR-91）
     議事録 1-3「1人でも取り漏れた瞬間にデータが壊れる」が QR の既知の弱点。
     - 工程の飛び越しをエラーにしない。記録したうえで画面に出す
     - 記録の欠けた案件は分析から外し、除外件数を管理者に見せる（BR-74 と同じ考え方）
   ============================================================ */
const esc = DL.esc;

/* ★2026-09-01 実データの23工程。lab.html / station.html と同一（整合テストが突き合わせる） */
const STEPS=[
  {c:'INTAKE',       n:'受付・確認'},
  {c:'MATERIAL_QC',  n:'資材検品'},
  {c:'MODEL',        n:'模型製作'},
  {c:'SCAN',         n:'スキャン'},
  {c:'DESIGN',       n:'CAD設計（デザイン）'},
  {c:'MILLING',      n:'ミリング'},
  {c:'SINTER',       n:'シンタリング（焼結）'},
  {c:'WAXUP',        n:'ワックスアップ'},
  {c:'CASTING',      n:'埋没・鋳造'},
  {c:'PRESS',        n:'プレス'},
  {c:'PORCELAIN',    n:'築盛・焼成'},
  {c:'RESIN',        n:'前装・レジン成形'},
  {c:'STAIN',        n:'ステイン・グレーズ'},
  {c:'FIT',          n:'適合調整・咬合調整'},
  {c:'POLISH',       n:'研磨・仕上げ'},
  {c:'CLASP',        n:'クラスプ・フレーム製作'},
  {c:'TRAY',         n:'トレー・咬合床製作'},
  {c:'SETUP',        n:'人工歯排列'},
  {c:'CURING',       n:'重合（義歯）'},
  {c:'INJECT',       n:'射出成形（熱可塑）'},
  {c:'REPAIR',       n:'義歯修理・増歯'},
  {c:'QC',           n:'最終検品'},
  {c:'SHIPPING',     n:'発送'},
];
const stepName = c => (STEPS.find(s=>s.c===c)||{n:c}).n;
const stepIdx  = c => STEPS.findIndex(s=>s.c===c);

/* ★作業中ゾーンを持たない工程＝素通り（原則45）。
   ここを「飛ばした」と扱うと切削の案件が全部アラートになる。 */
/* ★実データで「主に行うエリア」が空欄だった2工程。作業台を持たない＝素通り */
const PASS_THROUGH = ['MILLING','SINTER'];
const observable = c => !PASS_THROUGH.includes(c);

/* エリアごとの記録方式。★技工所が選ぶ。段階導入（主要工程だけRFID）も表現できる */
const AREAS=[
  {id:'a1',name:'受注と模型の台',steps:['INTAKE','MATERIAL_QC','MODEL','QC','SHIPPING'], mode:'QR'},
  {id:'a2',name:'スキャンとCAD設計の台',steps:['MODEL','SCAN','DESIGN'], mode:'QR'},
  {id:'a3',name:'代表の台',steps:['DESIGN'], mode:'TAP'},
  {id:'a4',name:'仕上げの台1',steps:['WAXUP','CASTING','PRESS','PORCELAIN','RESIN','STAIN','FIT','POLISH','CLASP','TRAY','SETUP','CURING','INJECT','REPAIR'], mode:'RFID'},
  {id:'a5',name:'仕上げの台2',steps:['WAXUP','CASTING','PRESS','PORCELAIN','RESIN','STAIN','FIT','POLISH','CLASP','TRAY','SETUP','CURING','INJECT','REPAIR'], mode:'RFID'},
  {id:'a6',name:'仕上げの台3',steps:['WAXUP','CASTING','PRESS','PORCELAIN','RESIN','STAIN','FIT','POLISH','CLASP','TRAY','SETUP','CURING','INJECT','REPAIR'], mode:'RFID'},
];
const areaOf = c => AREAS.find(a=>a.steps.includes(c)) || AREAS[0];
const MODE_JA = {TAP:'タップ', QR:'QR', RFID:'RFID'};

/* スタッフ。★対応できる工程＝技能。自分の担当をメインに出すための軸 */
const STAFF=[
  {id:'s1',name:'高根 弘二',init:'高',can:STEPS.map(s=>s.c)},
  {id:'s2',name:'中谷 誠',  init:'中',can:['INTAKE','MATERIAL_QC','MODEL','QC','SHIPPING']},
  {id:'s3',name:'佐藤 圭',  init:'佐',can:['SCAN','DESIGN','MILLING','SINTER','STAIN','FIT']},
  {id:'s4',name:'山本 千夏',init:'山',can:['WAXUP','CASTING','POLISH','FIT','QC']},
];
let ME = 's3';
const me = () => STAFF.find(s=>s.id===ME) || STAFF[0];

/* ---------- 受け渡しの方法（BR-94）----------
   医院ごとの既定（近所なので普段から直接）と、その回だけのイレギュラーを分ける。 */
/* ★往路と復路は別の移動。選べる値も違う。
   往路：印象・模型が医院から来る。通常は医院が発送するが、
        納期がギリギリなら近距離に限り取りに行く
   復路：完成品を医院へ届ける。通常は発送するが、同じ理由で持っていくことがある */
const INBOUND  = {SHIP:'医院が発送',   PICKUP :'取りに行く'};
const OUTBOUND = {SHIP:'発送する',     DELIVER:'届けに行く'};
const LEG_JA   = {in:'往路（印象・模型）', out:'復路（完成品）'};
const legLabel = (leg,v)=>(leg==='in'?INBOUND:OUTBOUND)[v]||'—';

const CLINICS=[
  {id:'c1',name:'さくら歯科クリニック',dist:'12km', inDef:'SHIP',  outDef:'SHIP'},
  {id:'c2',name:'A歯科医院',          dist:'1.5km',inDef:'SHIP',  outDef:'DELIVER'},
  {id:'c3',name:'B歯科クリニック',    dist:'8km',  inDef:'SHIP',  outDef:'SHIP'},
  {id:'c4',name:'みどり台デンタル',   dist:'0.9km',inDef:'PICKUP',outDef:'DELIVER'},
  {id:'c5',name:'（紙）川西歯科',     dist:'3km',  inDef:'SHIP',  outDef:'SHIP', paper:true},
];
const clinicOf = id => CLINICS.find(c=>c.id===id) || CLINICS[0];

/* ---------- 案件 ---------- */
let _s=20260829;
const rnd=()=>{_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff};
const pick=a=>a[Math.floor(rnd()*a.length)];
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

const TYPES=['クラウン','インレー','ブリッジ','前装冠','局部床義歯'];
const MATS={'クラウン':['フルジルコニア','e.max','金銀パラジウム'],'インレー':['e.max','金銀パラジウム'],
  'ブリッジ':['フルジルコニア','金銀パラジウム'],'前装冠':['前装鋳造冠'],'局部床義歯':['コバルトクロム']};

/* ルート：材料で通る工程が変わる（切削 vs 鋳造） */
function routeOf(mat){
  const cast = ['金銀パラジウム','前装鋳造冠','コバルトクロム'].includes(mat);
  return cast
    /* ★2026-09-01：実データの23工程・19ルートに合わせた（lab.html の ROUTES と同じ） */
    ? ['INTAKE','MATERIAL_QC','MODEL','WAXUP','CASTING','FIT','POLISH','QC','SHIPPING']
    : ['INTAKE','MATERIAL_QC','MODEL','SCAN','DESIGN','MILLING','SINTER','STAIN','FIT','POLISH','QC','SHIPPING'];
}

let CASES=[];
(function(){
  for(let i=0;i<14;i++){
    const type=pick(TYPES), mat=pick(MATS[type]);
    const route=routeOf(mat);
    const cl=pick(CLINICS);
    /* いまどこにいるか。route の途中に置く。
       ★素通りの工程（作業中ゾーンが無い）には止まれない。そこは通過するだけなので、
         スタッフが「着手する」対象にならない（原則45・36） */
    let at=ri(1,route.length-2);
    while(at<route.length-1 && !observable(route[at])) at++;
    const cur=route[at];
    const cov=rnd()<0.62?'INSURANCE':'PRIVATE';
    const d=ri(0,6);
    /* 履歴：ここまでの工程の完了時刻。★一部わざと欠かす（取り漏れの再現） */
    const log={};
    for(let k=0;k<at;k++){
      const c=route[k];
      if(!observable(c)) continue;                 /* 素通りの工程は記録が無いのが正常 */
      if(rnd()<0.12) continue;                     /* ★12%の確率で取り漏れ */
      log[c]={start:`08/${13+Math.floor(k/3)} ${8+k%9}:${DL.pad(ri(0,59),2)}`,
              end:`08/${13+Math.floor(k/3)} ${9+k%9}:${DL.pad(ri(0,59),2)}`};
    }
    CASES.push({
      id:'k'+i, no:'NKTN-2026-'+(1200+i*7),
      pno:'P-'+ri(10000,99999),
      type, mat, cov, route, cur,
      state: rnd()<0.30 ? 'ACTIVE' : 'WAIT',       /* 作業中 / 待ち */
      owner: rnd()<0.55 ? pick(STAFF).id : null,   /* 担当（未定もある） */
      clinicId: cl.id,
      hvIn: cl.inDef, hvOut: cl.outDef,            /* 既定は医院ごとの設定から */
      hvInReason: null, hvOutReason: null,
      due:['08/15','08/16','08/17','08/18','08/19','08/20','08/22'][d],
      dueDays:d,
      shade:pick(['A1','A2','A3','A3.5','B2']),
      teeth:pick(['右上6','左下7','右下4','左上5','前歯部 2〜3']),
      note:pick(['隣在歯に合わせて自然に','咬合強め。厚みを確保','コンタクトきつめで','指示書のとおり']),
      log,
      startedAt:null,
    });
  }
})();
const caseById = id => CASES.find(c=>c.id===id);

/* ============================================================
   取り漏れの検出（BR-90）
   ------------------------------------------------------------
   いまの工程より前で、観測できるはずなのに記録が無い工程を洗い出す。
   ★弾かない。記録したうえで画面に出す。
     弾くと現場が止まり、勝手に補完するとデータが嘘になる。
   ============================================================ */
function missingSteps(c){
  const at = c.route.indexOf(c.cur);
  return c.route.slice(0, at).filter(x => observable(x) && !c.log[x]);
}

/* 待ち時間は「前工程の完了時刻」から導出する（BR-92）。
   待機ゾーンを読ませないので、これが唯一の求め方になる。 */
function waitingSince(c){
  const at = c.route.indexOf(c.cur);
  for(let k=at-1;k>=0;k--){
    const rec = c.log[c.route[k]];
    if(rec && rec.end) return rec.end;
  }
  return null;
}

/* ---------- 表示の小物 ---------- */
const dueChip = c => {
  const cls = c.dueDays<=1 ? 'due' : c.dueDays<=3 ? 'soon' : '';
  const t = c.dueDays===0 ? '今日' : c.dueDays===1 ? '明日' : `${c.due}`;
  return `<span class="chip ${cls}">発送 ${t}</span>`;
};
const covChip = c => c.cov==='INSURANCE'
  ? '<span class="chip ins">保険</span>' : '<span class="chip pri">自費</span>';

/* ============================================================
   一覧の作り方
   ------------------------------------------------------------
   ★「自分の担当をメインに出す」（オーナー指示）
     1. 手元    … 自分が着手済みのもの
     2. これから … 自分が対応できる工程で待っているもの（担当が自分 or 未定）
   ============================================================ */
const myActive = () => CASES.filter(c => c.state==='ACTIVE' && c.owner===ME);
const myNext   = () => CASES.filter(c =>
  c.state==='WAIT' && me().can.includes(c.cur) && (c.owner===ME || c.owner===null));
const allWait  = () => CASES.filter(c => c.state==='WAIT');

/* ============================================================
   ★ラボ全体を見るための関数（2026-09-01 会議で追加）
   ------------------------------------------------------------
   > 「基本的には PC の画面は管理者しか入らなくて、
   >   これと同じような状況をスマホの方で確認できるような仕組みに落とし込む」
   > 「自分のタスクとラボ全体のタスクぐらい見れたらそれでいい」（宮腰さま）

   ★スタッフには PC を見せない運用にする。
     だから「全体の案件」と「まもなく自分に来るもの」は、この画面に無いと届かない。
   ★ただし BR-29 は守る。個人の生産性・順位は出さない。件数までにとどめる。
   ============================================================ */
/* まもなく自分に来るもの＝前の工程で作業中／完了していて、次が自分の担当工程 */
const comingToMe = () => CASES.filter(c => {
  if(c.state!=='WAIT' && c.state!=='ACTIVE') return false;
  const at = c.route.indexOf(c.cur);
  if(at < 0 || at+1 >= c.route.length) return false;
  /* 次の工程（素通りは飛ばす）が自分の技能に入っているか */
  let n = at+1;
  while(n < c.route.length && !observable(c.route[n])) n++;
  if(n >= c.route.length) return false;
  return me().can.includes(c.route[n]) && !me().can.includes(c.cur);
});
/* 工程ごとの滞留件数 */
const byStep = () => STEPS.map(st => ({
  st, n: CASES.filter(c => c.cur===st.c).length,
  act: CASES.filter(c => c.cur===st.c && c.state==='ACTIVE').length,
})).filter(x => x.n>0);
/* 納期の区分 */
const dueBucket = c => c.dueDays<=0 ? 'OVER' : c.dueDays<=1 ? 'TODAY' : c.dueDays<=3 ? 'SOON' : 'OK';
const DUE_JA = {OVER:'超過', TODAY:'本日', SOON:'3日以内', OK:'余裕あり'};

let TAB='now', TOAST=null, SHEET=null, DETAIL=null;

/* ============================================================
   操作 — 記録するのは「着手」と「完了」の2回だけ（BR-92）
   ============================================================ */
function nowStamp(){
  /* デモの「今日」を使う。実データではないので固定（DL.TODAY と揃える） */
  const d=new Date();
  return `08/15 ${DL.pad(d.getHours(),2)}:${DL.pad(d.getMinutes(),2)}`;
}
function doStart(id){
  const c=caseById(id); if(!c) return;
  c.state='ACTIVE'; c.owner=ME; c.startedAt=nowStamp();
  (c.log[c.cur] ||= {}).start = c.startedAt;
  toast(`着手しました — ${stepName(c.cur)}`);
  DETAIL=null; render();
}
function doFinish(id){
  const c=caseById(id); if(!c) return;
  (c.log[c.cur] ||= {}).end = nowStamp();
  const at=c.route.indexOf(c.cur);
  /* ★素通りの工程は飛ばして、次に「作業中ゾーンがある工程」まで送る。
     ただし飛ばした工程名は画面に残す（原則36：出さないと現物が行方不明に見える）。 */
  let next=at+1, passed=[];
  while(next < c.route.length && !observable(c.route[next])){
    passed.push(c.route[next]); next++;
  }
  if(next < c.route.length){
    c.cur = c.route[next];
    c.state='WAIT'; c.owner=null; c.startedAt=null;
    toast(passed.length
      ? `完了 → ${passed.map(stepName).join('・')}を通って「${stepName(c.cur)}」へ`
      : `完了 → 次は「${stepName(c.cur)}」へ`);
  }else{
    c.state='DONE';
    toast('完了しました');
  }
  DETAIL=null; render();
}
/* 受け渡しを決める。★既定と違うときだけ理由を残す（FR-HD-008） */
function setLeg(id, leg, how, reason, finish){
  const c=caseById(id); if(!c) return;
  const cl=clinicOf(c.clinicId);
  const def = leg==='in' ? cl.inDef : cl.outDef;
  const rsn = (how!==def) ? (reason||'（理由なし）') : null;
  if(leg==='in'){ c.hvIn=how; c.hvInReason=rsn; }
  else{ c.hvOut=how; c.hvOutReason=rsn; }
  if(finish){
    (c.log[c.cur] ||= {}).end = nowStamp();
    c.state='DONE';
  }
  toast(`${LEG_JA[leg]}：${legLabel(leg,how)}`);
  SHEET=null; DETAIL=null; render();
}

let toastTimer=null;
function toast(t){
  TOAST=t; render();
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{TOAST=null;render()},2400);
}

/* ============================================================
   QRの読み取り
   ------------------------------------------------------------
   ★デモではカメラを起動しない。
     file:// は secure context ではないので getUserMedia が動かない。
     本実装は BarcodeDetector（Chrome で qr_code 対応を実測済み）＋
     iOS 用のフォールバックで組む。★iOS Safari の対応は Phase 0 で要確認。
   ============================================================ */
function openScan(){
  SHEET={kind:'scan'}; render();
}
function scanPick(id){
  SHEET=null; DETAIL=id; TAB='now'; render();

}
function scanByCode(){
  const v=(document.getElementById('codeIn')?.value||'').trim().toUpperCase();
  if(!v){ toast('指示書番号を入れてください'); return; }
  const c=CASES.find(x=>x.no.toUpperCase().includes(v));
  if(!c){ toast('その番号は見つかりません'); return; }
  scanPick(c.id);
}

/* ============================================================
   描画
   ============================================================ */
function caseCard(c, kind){
  const cl=clinicOf(c.clinicId);
  const miss=missingSteps(c);
  const area=areaOf(c.cur);
  const last = c.route[c.route.length-1];
  const isLast = c.cur===last;

  /* ★次にやる操作は1つだけ出す。現場で迷わせないため */
  let btn='';
  if(c.state==='ACTIVE'){
    btn = isLast
      ? `<button class="act-btn ship" onclick="openHandover('${c.id}')">終わった → 引き渡しへ</button>`
      : `<button class="act-btn done" onclick="doFinish('${c.id}')">終わった</button>`;
  }else if(c.state==='WAIT'){
    btn = `<button class="act-btn" onclick="doStart('${c.id}')">着手する</button>`;
  }

  return `<div class="card ${c.state==='ACTIVE'?'act':''} ${miss.length?'warn':''}">
    <div class="top"><span class="no">${esc(c.no)}</span></div>
    <div class="ttl">${esc(c.type)}　<span class="muted" style="font-size:14px">${esc(c.mat)}</span></div>
    <div class="sub">${esc(cl.name)}　/　${esc(c.teeth)}　/　シェード ${esc(c.shade)}</div>
    <div class="chips">
      <span class="chip step">${esc(stepName(c.cur))}</span>
      ${covChip(c)} ${dueChip(c)}
      <span class="chip">${esc(area.name)}・${MODE_JA[area.mode]}</span>
    </div>
    ${c.state==='ACTIVE' && c.startedAt ? `<div class="el">着手 <b>${esc(c.startedAt)}</b></div>` : ''}
    ${c.state==='WAIT' && waitingSince(c) ? `<div class="el"><span class="lb">前の工程の完了</span> <b>${esc(waitingSince(c))}</b>
      <span class="faint small" style="flex-basis:100%">ここから待ち時間を数えます</span></div>` : ''}
    ${miss.length ? `<div class="gap">⚠ <b>${miss.map(stepName).join('・')}</b> の記録が抜けています。<br>
      作業は進めて構いません。<b>あとで管理者が確認します。</b></div>` : ''}
    ${btn}
    <button class="act-btn ghost" onclick="DETAIL='${c.id}';render()">指示書を見る</button>
  </div>`;
}

function vNow(){
  const a=myActive(), n=myNext();
  return `
  <div class="note">
    <b>読むのは「着手」と「終わった」の2回だけです。</b>
    待ち時間は前の工程の完了時刻から計算するので、届いたときに読む必要はありません。
  </div>

  <h2 style="margin-top:20px">これから来るもの <span class="muted small">${n.length}件</span></h2>
  ${n.length ? n.map(c=>caseCard(c,'next')).join('')
    : '<div class="empty">あなたが対応できる工程で待っているものはありません。</div>'}`;
}

function vAll(){
  const w=allWait();
  return `
  <div class="note">技工所全体の待ちです。<b>自分の技能外の工程も見えます</b>が、
    着手できるのは対応できる工程だけです。</div>
  ${w.length ? w.map(c=>{
    const can=me().can.includes(c.cur);
    return can ? caseCard(c,'all') : caseCard(c,'all').replace(/<button class="act-btn"[^>]*>着手する<\/button>/,
      '<div class="el faint">この工程はあなたの担当外です</div>');
  }).join('') : '<div class="empty">待ちはありません。</div>'}`;
}

/* ---------- 引き渡しのシート（BR-94）----------
   医院ごとの既定と、その回だけのイレギュラーを分ける。
   ★既定から外すときは理由を残す。「なぜ直接持っていったか」が後から分かるように。 */
/* leg='out' は最終工程での確定、leg='in' は途中での切り替え */
function openHandover(id){ SHEET={kind:'leg',id,leg:'out',finish:true}; render(); }
function openLeg(id,leg){ SHEET={kind:'leg',id,leg,finish:false}; render(); }

const LEG_NOTE={
  in :{SHIP:'医院からの発送を待ちます',
       PICKUP:'こちらが医院へ取りに行きます。★発送を待たないぶん着手が早まります'},
  out:{SHIP:'通常の配送に載せます',
       DELIVER:'こちらが医院へ持っていきます。★配送の日数がかかりません'},
};
function sheetLeg(id,leg,finish){
  const c=caseById(id), cl=clinicOf(c.clinicId);
  const opts=leg==='in'?INBOUND:OUTBOUND;
  const def =leg==='in'?cl.inDef:cl.outDef;
  const cur =leg==='in'?c.hvIn:c.hvOut;
  return `
  <h3>${LEG_JA[leg]}をどうしますか</h3>
  <p class="small muted">${esc(cl.name)}（${esc(cl.dist)}）の既定は
    <b style="color:var(--text)">${legLabel(leg,def)}</b> です。</p>
  ${Object.keys(opts).map(k=>`
    <button class="pick ${cur===k?'on':''}" onclick="pickLeg('${id}','${leg}','${k}',${finish})">
      <div class="p1">${opts[k]}${k===def?'　<span class="chip">医院の既定</span>':''}</div>
      <div class="p2">${LEG_NOTE[leg][k]}</div>
    </button>`).join('')}
  <button class="act-btn ghost" onclick="SHEET=null;render()">やめる</button>`;
}
function pickLeg(id,leg,how,finish){
  const c=caseById(id), cl=clinicOf(c.clinicId);
  const def=leg==='in'?cl.inDef:cl.outDef;
  if(how===def){ setLeg(id,leg,how,null,finish); return; }
  SHEET={kind:'reason',id,leg,how,finish}; render();
}
const REASONS={
  in :['配送を待つと納期に間に合わないため','医院から取りに来てほしいと依頼があったため',
       '近くへ行く用事があるため','再製作・修正で急ぐため'],
  out:['配送だと翌日着になり納期に間に合わないため','医院から直接持ってきてほしいと依頼があったため',
       '近くへ行く用事があるため','再製作・修正で急ぐため'],
};
function sheetReason(id,leg,how,finish){
  const c=caseById(id), cl=clinicOf(c.clinicId);
  const def=leg==='in'?cl.inDef:cl.outDef;
  return `
  <h3>${legLabel(leg,how)}にする理由</h3>

  ${REASONS[leg].map(r=>`<button class="pick" onclick="setLeg('${id}','${leg}','${how}','${esc(r)}',${finish})">

  <button class="act-btn ghost" onclick="SHEET=null;render()">やめる</button>`;
}

function sheetScan(){
  /* デモではカメラを開かない。実装の姿だけ示し、選べるようにする */
  const list=CASES.filter(c=>c.state!=='DONE').slice(0,6);
  return `
  <h3>指示書のQRを読む</h3>
  <div class="cam">
    <span class="big">📷</span>
    本番ではここにカメラが出ます。<br>
    <span class="faint">Chrome は <b>BarcodeDetector</b> で追加ライブラリなしに読めます（実測）。<br>
    HTTPS が必要です。★iOS Safari の対応は検証中。</span>
  </div>
  <p class="small muted" style="margin-bottom:8px">デモでは、読み取った結果を選んでください。</p>
  ${list.map(c=>`<button class="pick" onclick="scanPick('${c.id}')">
    <div class="p1">${esc(c.no)}　${esc(c.type)}</div>
    <div class="p2">${esc(stepName(c.cur))}／${esc(clinicOf(c.clinicId).name)}</div></button>`).join('')}
  <p class="small muted" style="margin:12px 0 6px">番号で探す</p>
  <input class="code" id="codeIn" placeholder="例：1200" inputmode="numeric">
  <button class="act-btn" style="margin-top:10px" onclick="scanByCode()">この番号で開く</button>
  <button class="act-btn ghost" onclick="SHEET=null;render()">閉じる</button>`;
}

/* ---------- 全体の描画 ---------- */
let LABSTEP=null, LABQ='';
const TABS=[['now','自分の作業'],['all','全体の待ち'],['lab','ラボ全体']];
function render(){
  const m=me();
  document.getElementById('avatar').textContent=m.init;
  const sel=document.getElementById('whoSel');
  if(sel.options.length!==STAFF.length){
    sel.innerHTML=STAFF.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  }
  sel.value=ME;

  /* いまの工程のエリアがどの記録方式かを出す。技工所ごと・エリアごとに違う */
  const modes=[...new Set(AREAS.map(a=>a.mode))].map(x=>MODE_JA[x]).join('＋');
  document.getElementById('modeLine').textContent=`記録方式：${modes}（エリアごとに設定）`;

  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>{
    const n = k==='now' ? myActive().length+myNext().length
            : k==='all' ? allWait().length : CASES.length;
    return `<button class="${TAB===k&&!DETAIL?'on':''}" onclick="TAB='${k}';DETAIL=null;render()">
      ${l}<span class="n">${n}</span></button>`;
  }).join('');

  document.getElementById('app').innerHTML =
    DETAIL ? vDetail() : (TAB==='now' ? vNow() : TAB==='lab' ? vLab() : vAll());

  let ov='';
  if(SHEET){
    const body = SHEET.kind==='scan' ? sheetScan()
      : SHEET.kind==='leg' ? sheetLeg(SHEET.id,SHEET.leg,SHEET.finish)
      : SHEET.kind==='reason' ? sheetReason(SHEET.id,SHEET.leg,SHEET.how,SHEET.finish) : '';
    ov += `<div class="mask" onclick="if(event.target===this){SHEET=null;render()}">
      <div class="sheet">${body}</div></div>`;
  }
  if(TOAST) ov += `<div class="toast">${esc(TOAST)}</div>`;
  document.getElementById('overlay').innerHTML=ov;
}

document.getElementById('whoSel').onchange=e=>{ME=e.target.value;DETAIL=null;render()};
document.getElementById('scanBtn').onclick=openScan;
render();
</script>
</body>
</html>
